<!doctype html><html><head><meta charset="utf-8"><style>
:root{ --gold:#d8b45a; --gold-lt:#f4e3a8; --gold-dk:#7a5c1e; --frame:#c8a24a; }
*{box-sizing:border-box;}
body{margin:0;background:#0a0a10;font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;}

.lor-card{position:relative;width:360px;aspect-ratio:2/3;border-radius:20px;overflow:hidden;
  background:#0d0b08;
  /* 금속 골드 프레임 = 다층 인셋 베벨 + 외곽 하이라이트 */
  box-shadow:
    inset 0 0 0 2px #5b4416,
    inset 0 0 0 5px #a3812f,
    inset 0 0 0 7px #e9d288,
    inset 0 0 0 11px #6e5417,
    inset 0 0 0 12px #2a1f0c,
    inset 0 0 34px rgba(0,0,0,.7),
    0 14px 40px rgba(0,0,0,.7);}
.lor-inner{position:absolute;inset:12px;border-radius:12px;overflow:hidden;background:#0a0906;}

/* 챔피언 아트 (상단 60%) */
.lor-art{position:absolute;top:0;left:0;right:0;height:64%;background-position:35% 20%;background-size:cover;
  background-image:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(10,9,6,.6) 82%,#0a0906 100%),url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Yasuo_0.jpg');}
.lor-art::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(0,0,0,.55);}

/* 하단 텍스트 패널 */
.lor-body{position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(180deg,rgba(10,9,6,0),#0b0a07 22%,#0b0a07);}

/* 코스트 젬 (좌상) */
.lor-cost{position:absolute;top:8px;left:8px;width:52px;height:52px;border-radius:50%;z-index:6;
  background:radial-gradient(circle at 38% 32%,#8 fc,#2f6fd6 42%,#1a3f86 78%,#0e2350);
  background:radial-gradient(circle at 38% 32%,#a9d4ff,#3b82f6 44%,#1e3a8a 80%,#0e2350);
  box-shadow:0 0 0 2px #f4e3a8,0 0 0 4px #7a5c1e,0 2px 8px rgba(0,0,0,.6),inset 0 -6px 10px rgba(0,0,0,.4),inset 0 4px 8px rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;}
.lor-cost b{font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.6);font-family:Georgia,serif;}

/* 상단 중앙 타입 배너 */
.lor-type{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  padding:3px 20px;font-size:12px;font-weight:700;color:var(--gold-lt);letter-spacing:2px;
  background:linear-gradient(180deg,#241a0c,#120c05);border:1px solid #6e5417;border-radius:3px;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);box-shadow:0 2px 5px rgba(0,0,0,.5);}

/* 지역 아이콘 (우상) */
.lor-region{position:absolute;top:8px;right:8px;width:46px;height:52px;z-index:6;
  background:radial-gradient(circle at 50% 42%,#1f6f4a,#0c3a26 75%);
  clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);
  box-shadow:0 0 0 2px #6e5417,0 2px 6px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;}
.lor-region span{font-size:24px;filter:drop-shadow(0 0 4px rgba(120,255,180,.6));}

/* 이름 배너 */
.lor-name{position:absolute;left:20px;right:20px;top:56.5%;transform:translateY(-50%);z-index:5;text-align:center;
  padding:7px 10px;background:linear-gradient(180deg,rgba(24,18,8,.96),rgba(10,7,3,.96));
  border-top:1px solid #8a6a24;border-bottom:1px solid #8a6a24;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%);
  box-shadow:0 3px 10px rgba(0,0,0,.6);}
.lor-name b{font-size:26px;font-weight:900;color:#f2e2ad;letter-spacing:2px;font-family:Georgia,'Noto Sans KR',serif;text-shadow:0 2px 4px rgba(0,0,0,.7);}

/* 키워드 알약 */
.lor-kw{position:absolute;left:0;right:0;top:63%;z-index:5;display:flex;gap:10px;justify-content:center;}
.lor-kw span{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#dfe7f5;
  padding:5px 15px;background:linear-gradient(180deg,#2b3550,#141a2b);border:1px solid #4a5a86;border-radius:16px;box-shadow:0 2px 5px rgba(0,0,0,.5);}

/* 설명 박스 */
.lor-desc{position:absolute;left:22px;right:22px;top:70.5%;z-index:5;text-align:center;font-size:13px;line-height:1.55;color:#e8e2d2;}
.lor-desc b{color:#f4e3a8;}

/* 레벨업/조건 */
.lor-lvl{position:absolute;left:22px;right:22px;bottom:11%;z-index:5;text-align:center;}
.lor-lvl-h{display:flex;align-items:center;gap:8px;justify-content:center;color:#9fb4e8;font-size:11px;font-weight:800;letter-spacing:3px;margin-bottom:4px;}
.lor-lvl-h::before,.lor-lvl-h::after{content:'';height:1px;flex:1;max-width:60px;background:linear-gradient(90deg,transparent,#5a6a96);}
.lor-lvl-t{font-size:12.5px;line-height:1.5;color:#e0913f;font-weight:700;}

/* 파워/체력 젬 (하단 좌/우) */
.lor-pow,.lor-hp{position:absolute;bottom:4px;width:52px;height:52px;z-index:6;display:flex;align-items:center;justify-content:center;
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);}
.lor-pow{left:6px;background:radial-gradient(circle at 40% 32%,#ffcf87,#e07a1e 55%,#8a3d08 85%);box-shadow:0 2px 7px rgba(0,0,0,.6);}
.lor-hp{right:6px;background:radial-gradient(circle at 40% 32%,#ff9a9a,#d63838 55%,#7a1414 85%);box-shadow:0 2px 7px rgba(0,0,0,.6);}
.lor-pow b,.lor-hp b{font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.6);font-family:Georgia,serif;}
.lor-stat-ic{position:absolute;bottom:56px;font-size:12px;z-index:6;color:#cbb98a;}
.lor-pow-ic{left:16px;} .lor-hp-ic{right:16px;}

/* 하단 중앙 육각 장식 */
.lor-foot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:22px;height:20px;z-index:7;
  background:linear-gradient(180deg,#e9d288,#8a6a24);clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);box-shadow:0 2px 4px rgba(0,0,0,.6);}
.note{position:fixed;bottom:6px;left:0;right:0;text-align:center;color:#6a6a78;font-size:11px;}
</style></head><body>
<div class="lor-card">
  <div class="lor-inner">
    <div class="lor-art"></div>
    <div class="lor-body"></div>
    <div class="lor-name"><b>야스오</b></div>
    <div class="lor-kw"><span>🪙 채집가</span><span>🏠 고향 특화</span></div>
    <div class="lor-desc">🌸 <b>아이오니아</b>로 파견하면 골드 <b>+30%</b>.<br>원정마다 <b>무료 복권권</b>을 주울 확률이 올라요.</div>
    <div class="lor-lvl">
      <div class="lor-lvl-h">파 견 조 건</div>
      <div class="lor-lvl-t">이 카드를 <b>★★★(프리즘)</b>까지 모아야<br>원정에 보낼 수 있습니다.</div>
    </div>
  </div>
  <div class="lor-cost"><b>3</b></div>
  <div class="lor-type">검 사</div>
  <div class="lor-region"><span>🌀</span></div>
  <div class="lor-stat-ic lor-pow-ic">🪙</div>
  <div class="lor-pow"><b>8</b></div>
  <div class="lor-stat-ic lor-hp-ic">🍀</div>
  <div class="lor-hp"><b>5</b></div>
  <div class="lor-foot"></div>
</div>
<div class="note">LoR 스타일 카드 목업 — 프레임/젬/배너/키워드/레벨업/파워·체력 구조 재현 · 내용·수치는 예시</div>
</body></html>

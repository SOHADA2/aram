<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;}
body{margin:0;background:#0a0a0f;font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;justify-content:center;padding:12px;}
.app{width:420px;background:linear-gradient(180deg,#12101a,#0a080f);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 5px #6b4f24,inset 0 0 0 7px #2a1d0c;}
/* 상단바 */
.top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:linear-gradient(180deg,#241a10,#160f0a);border-bottom:2px solid #6b4f24;}
.top .tt{font-weight:900;color:#f0dca0;font-size:14px;flex:1;}
.top .tt small{color:#ff9a6a;font-size:11px;}
.chip{font-family:monospace;font-weight:800;font-size:11px;background:linear-gradient(180deg,rgba(60,44,20,.55),rgba(20,14,8,.65));border:1px solid #6b4f24;border-radius:13px;padding:3px 8px;white-space:nowrap;}
.chip.g{color:#ffd76a;}
.resbar{display:flex;gap:5px;padding:6px 10px;background:linear-gradient(180deg,#1a140c,#120d08);border-bottom:1px solid #6b4f24;}
.resbar .chip{flex:1;text-align:center;color:#f0e2b8;}
.resbar .chip b{color:#8fce8a;font-weight:700;font-size:9px;}
/* 정착지 필드 */
.fort{position:relative;height:400px;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#5c7a42,#3f5a2c 62%,#2c4020 100%);}
.fort::before{content:'';position:absolute;inset:0;background:
  radial-gradient(circle at 50% 60%,rgba(120,100,60,.4),transparent 40%),
  repeating-linear-gradient(64deg,rgba(0,0,0,.05) 0 2px,transparent 2px 40px);}
/* 성벽 링 */
.wall{position:absolute;inset:14px 14px 22px;border-radius:24px;pointer-events:none;
  box-shadow:inset 0 0 0 3px #3e3524,inset 0 0 0 5px #a3906a,inset 0 0 0 13px #6e5f45,inset 0 0 0 15px #3e3524,inset 0 0 34px rgba(0,0,0,.45);}
/* 성벽 위 요철(총안) */
.merlons{position:absolute;left:32px;right:32px;top:11px;height:9px;z-index:2;
  background:repeating-linear-gradient(90deg,#9a8a66 0 10px,transparent 10px 17px);border-radius:2px;}
/* 코너 타워 */
.twr{position:absolute;width:34px;height:34px;border-radius:8px;z-index:4;
  background:radial-gradient(circle at 40% 30%,#b3a074,#6e5f45 70%,#3e3524);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 0 0 2px #3e3524;
  display:flex;align-items:flex-start;justify-content:center;}
.twr::before{content:'';position:absolute;top:-6px;width:100%;height:8px;background:repeating-linear-gradient(90deg,#9a8a66 0 6px,transparent 6px 11px);}
.twr .flag{font-size:12px;margin-top:-9px;}
.twr.lv{outline:2px solid #a9d4ff;}
.twr-lbl{position:absolute;font-size:8px;font-weight:800;color:#cfe4ff;background:rgba(10,20,40,.8);padding:0 4px;border-radius:5px;white-space:nowrap;z-index:5;}
/* 성문(하단) */
.gate{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:52px;height:22px;z-index:4;
  background:linear-gradient(180deg,#6a4a24,#3a260f);border:2px solid #8a6a30;border-bottom:none;border-radius:8px 8px 0 0;box-shadow:inset 0 4px 8px rgba(0,0,0,.5);}
.gate::after{content:'⚔️';position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:11px;}
/* 건물 플롯 */
.bld{position:absolute;transform:translate(-50%,-50%);z-index:6;text-align:center;cursor:pointer;}
.bld .plat{width:52px;height:22px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%);position:absolute;left:50%;top:60%;transform:translate(-50%,0);}
.bld .ic{position:relative;font-size:30px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));}
.bld .lv{position:absolute;top:-6px;right:-8px;font-size:8px;font-weight:900;color:#1a1206;background:linear-gradient(135deg,#f4e3a8,#d8b45a);padding:0 5px;border-radius:6px;z-index:2;}
.bld .nm{font-size:8.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;margin-top:-2px;}
/* 영웅 토큰 */
.hero{position:absolute;transform:translate(-50%,-50%);z-index:7;text-align:center;}
.hero .por{width:40px;height:40px;border-radius:50%;background-size:cover;background-position:35% 15%;border:2px solid #a78bfa;box-shadow:0 3px 6px rgba(0,0,0,.6);}
.hero .nm{font-size:8.5px;font-weight:800;color:#e8dcf0;text-shadow:0 1px 2px #000;}
.hero .hpbar{width:38px;height:4px;border-radius:3px;background:rgba(0,0,0,.5);margin:1px auto 0;overflow:hidden;}
.hero .hpbar>div{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);}
/* 습격 몬스터(성 밖) */
.mob{position:absolute;z-index:3;text-align:center;font-size:22px;filter:drop-shadow(0 2px 3px #000);animation:mobBob 1.4s ease-in-out infinite;}
@keyframes mobBob{50%{transform:translateY(-3px);}}
.raid-t{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);z-index:8;font-size:10px;font-weight:800;color:#ffb4a0;background:rgba(30,10,10,.85);border:1px solid #7a3a2e;border-radius:12px;padding:2px 10px;white-space:nowrap;}
/* 하단 방어/힌트 */
.foot{padding:10px 12px 12px;background:linear-gradient(0deg,#140e08,#180f08);}
.dbar{height:8px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;position:relative;margin:2px 0 4px;}
.dbar .def{height:100%;width:74%;background:linear-gradient(90deg,#22c55e,#86efac);}
.dbar .line{position:absolute;top:-2px;bottom:-2px;left:66%;width:2px;background:#ff6a6a;}
.dmeta{display:flex;justify-content:space-between;font-size:10px;color:#c9b98a;}
.hint{font-size:9.5px;color:#8a7a52;text-align:center;margin-top:8px;}
.back{width:30px;height:30px;border:none;border-radius:8px;background:rgba(0,0,0,.5);color:#e8dcc0;font-size:15px;margin-right:4px;}
</style></head><body>
<div class="app">
  <div class="top"><button class="back">←</button><span class="tt">🌸 아이오니아 <small>★★ 위협</small></span><span class="chip">🎴 도감</span><span class="chip g">🪙 51,409</span></div>
  <div class="resbar">
    <span class="chip">🪨 340 <b>+12</b></span><span class="chip">🪵 280 <b>+12</b></span><span class="chip">🔮 46 <b>+3</b></span><span class="chip g">🪙 <b>+8/분</b></span>
  </div>
  <div class="fort">
    <div class="wall"></div><div class="merlons"></div>
    <!-- 코너 타워(방어 타워) -->
    <div class="twr lv" style="left:20px;top:44px;"><span class="flag">🚩</span></div><div class="twr-lbl" style="left:14px;top:80px;">🗼 타워 Lv2</div>
    <div class="twr" style="right:20px;top:44px;"><span class="flag">🏴</span></div>
    <div class="twr lv" style="left:20px;bottom:52px;"><span class="flag">🚩</span></div>
    <div class="twr" style="right:20px;bottom:52px;"><span class="flag">🏴</span></div>
    <div class="gate"></div>
    <!-- 건물들 -->
    <div class="bld" style="left:50%;top:28%;"><div class="plat"></div><span class="lv">Lv1</span><span class="ic">🏰</span><div class="nm">영웅 소환소</div></div>
    <div class="bld" style="left:28%;top:40%;"><div class="plat"></div><span class="lv">Lv2</span><span class="ic">💰</span><div class="nm">금광</div></div>
    <div class="bld" style="left:72%;top:40%;"><div class="plat"></div><span class="lv">Lv1</span><span class="ic">🪨</span><div class="nm">채석장</div></div>
    <div class="bld" style="left:30%;top:62%;"><div class="plat"></div><span class="lv">Lv1</span><span class="ic">🪵</span><div class="nm">벌목장</div></div>
    <div class="bld" style="left:70%;top:62%;"><div class="plat"></div><span class="lv">Lv1</span><span class="ic">🔮</span><div class="nm">룬 제단</div></div>
    <div class="bld" style="left:50%;top:50%;"><div class="plat"></div><span class="lv">Lv1</span><span class="ic">🏥</span><div class="nm">치료소</div></div>
    <!-- 영웅 -->
    <div class="hero" style="left:42%;top:74%;"><div class="por" style="background-image:url('https://ddragon.leagueoflegends.com/cdn/img/champion/loading/Yasuo_0.jpg')"></div><div class="nm">야스오</div><div class="hpbar"><div style="width:62%"></div></div></div>
    <!-- 습격 몬스터(성 밖) -->
    <div class="mob" style="left:38%;bottom:-2px;">🌪️</div><div class="mob" style="left:56%;bottom:-4px;animation-delay:.4s">🌪️</div>
    <div class="raid-t">⚔️ 폭주한 정령 습격 ⏱ 12:30</div>
  </div>
  <div class="foot">
    <div class="dmeta"><span>🛡️ 방어력 <b style="color:#f0e2b8">84</b> (타워2 + 야스오)</span><span style="color:#86efac;font-weight:800">✅ 방어 성공 예상</span></div>
    <div class="dbar"><div class="def"></div><div class="line"></div></div>
    <div class="hint">🏗️ 건물을 탭하면 건설·업글 · 성벽 코너 타워로 습격 방어 · 성문으로 몬스터가 몰려와요</div>
  </div>
</div>
</body></html>

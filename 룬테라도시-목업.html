<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>룬테라 전쟁 — 3D 타운 목업</title>
<style>
*{box-sizing:border-box;margin:0;}
body{background:#0a0a0f;font-family:system-ui,sans-serif;overflow:hidden;}
#wrap{position:relative;width:100vw;height:100vh;}
canvas{display:block;}
#tag{position:fixed;left:10px;top:8px;z-index:5;color:#f0dca0;font-weight:800;font-size:14px;text-shadow:0 2px 4px #000;}
#hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#c9b98a;font-size:11px;z-index:5;text-shadow:0 1px 2px #000;}
#err{position:fixed;left:10px;top:34px;color:#ff8a6a;font-size:12px;z-index:9;white-space:pre;}
</style></head>
<body><div id="wrap">
<div id="tag">🏰 룬테라 전쟁 · 3D 타운 목업</div>
<div id="err"></div>
<div id="hint">🖱️ 드래그로 회전 · 휠로 확대 · (판타지 타운 + 묘지 키트 · Kenney CC0)</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { clone as skClone } from 'three/addons/utils/SkeletonUtils.js';
const TOWN='assets/town/', GRAVE='assets/graveyard/', CASTLE='assets/castle/', SURV='assets/survival/', FOOD='assets/food/', P2=Math.PI/2, PI=Math.PI;
const KITDIR={town:TOWN,grave:GRAVE,castle:CASTLE,surv:SURV,food:FOOD};
const err=document.getElementById('err'), tag=document.getElementById('tag');
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(1.5,devicePixelRatio)); renderer.setSize(W,H);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('wrap').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#8fbfe0'); scene.fog=new THREE.Fog('#8fbfe0',40,78);
const D=13, aspect=W/H;
const cam=new THREE.OrthographicCamera(-D*aspect,D*aspect,D,-D,-60,140);
cam.position.set(22,19,22); cam.lookAt(0,0,0);
const ctrl=new OrbitControls(cam,renderer.domElement); ctrl.target.set(0,1,-1); ctrl.enableDamping=true; ctrl.maxPolarAngle=Math.PI*0.49;
scene.add(new THREE.HemisphereLight(0xdcefff,0x4a5a3a,0.9));
const sun=new THREE.DirectionalLight(0xfff3d8,1.5); sun.position.set(16,24,10); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const scam=sun.shadow.camera; scam.left=-30;scam.right=30;scam.top=30;scam.bottom=-30;scam.near=1;scam.far=80; sun.shadow.bias=-0.0005;
scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshStandardMaterial({color:0x6f9e46,roughness:1}));
ground.rotation.x=-P2; ground.position.y=-0.02; ground.receiveShadow=true; scene.add(ground);
const plaza=new THREE.Mesh(new THREE.CircleGeometry(5.5,44),new THREE.MeshStandardMaterial({color:0xc2ab7a,roughness:1}));
plaza.rotation.x=-P2; plaza.receiveShadow=true; scene.add(plaza);
// 묘지 흙 바닥
const gy=new THREE.Mesh(new THREE.PlaneGeometry(15,13),new THREE.MeshStandardMaterial({color:0x555046,roughness:1}));
gy.rotation.x=-P2; gy.position.set(-15,-0.01,-11); gy.receiveShadow=true; scene.add(gy);
const root=new THREE.Group(); scene.add(root);
const gl=new GLTFLoader(); const cache={}, charG={};
const ENV=[], CH=[], mixers=[], walkers=[], clock=new THREE.Clock();
function base(k){ return KITDIR[k]||TOWN; }
function put(n,x,z,o){ o=o||{}; ENV.push({n,x,z,o}); }
function chr(n,x,z,o){ o=o||{}; CH.push({n,x,z,o}); }
function house(cx,cz,o){ o=o||{}; const ry=o.ry||0,wall=o.wall||'wall',door=o.door||'wall-door',roof=o.roof||'roof-gable';
  put(door,cx,cz,{ry}); put(o.win||'wall-window-shutters',cx,cz,{ry:ry+P2}); put(wall,cx,cz,{ry:ry-P2}); put(wall,cx,cz,{ry:ry+PI}); put(roof,cx,cz,{y:1,ry}); if(o.chim) put('chimney',cx,cz,{y:1,ry}); }
// ════ 마을(밀집) ════
put('fountain-round',0,0);
house(-4,-3,{roof:'roof-gable'}); house(-6,0,{roof:'roof-high-gable',wall:'wall-wood',door:'wall-wood-door',ry:P2});
house(-4,3,{roof:'roof-gable',win:'wall-window-round',ry:PI}); house(4,-4,{roof:'roof-high-gable',wall:'wall-wood',door:'wall-wood-door',ry:-P2});
house(6,-1,{roof:'roof-gable',ry:-P2}); house(4,3,{roof:'roof-high-gable',ry:PI}); house(0,-6,{roof:'roof-gable'});
house(-1,6,{roof:'roof-high-gable',wall:'wall-wood',ry:PI}); house(7,2,{roof:'roof-gable',ry:-P2}); house(-7,-3,{roof:'roof-high-gable',ry:P2});
put('windmill',11,-7,{ry:0.4}); put('watermill',-11,5,{ry:2.4});
put('stall-red',1.5,4,{ry:PI}); put('stall-green',3.5,4,{ry:PI}); put('stall-bench',2.5,5,{}); put('cart',7,-3,{ry:0.6}); put('cart',-3,7,{ry:2});
put('banner-red',-2,-1,{}); put('banner-green',2,-1,{}); put('lantern',-1.4,1.4,{}); put('lantern',1.4,-1.4,{}); put('lantern',-1.4,-1.4,{});
put('pillar-stone',1.6,1.6,{}); put('hedge-large',-9,-1,{}); put('hedge-large',-9,1,{});
const trees=['tree','tree-high','tree-high-round','tree-crooked'];
[[-12,4],[-13,1],[9,7],[12,4],[13,1],[10,-3],[8,8],[-2,9],[5,8],[-6,8]].forEach((p,i)=>put(trees[i%4],p[0],p[1],{s:1+((i*7)%3)*0.12,ry:i}));
put('rock-large',12,-3,{ry:0.5}); put('rock-wide',9,3,{ry:1});
for(let i=1;i<=7;i++) put(i===4?'fence-gate':'fence',i,8,{});
// ════ 묘지 구역(밀도·묘지 키트) ════
const GX=-15,GZ=-11;
put('crypt-large',GX,GZ-3,{kit:'grave',ry:PI}); put('crypt-large-roof',GX,GZ-3,{kit:'grave',y:1,ry:PI}); put('crypt-large-door',GX,GZ-3,{kit:'grave',ry:PI});
put('crypt',GX+4,GZ-3,{kit:'grave',ry:PI}); put('crypt-door',GX+4,GZ-3,{kit:'grave',ry:PI});
put('altar-stone',GX,GZ+3,{kit:'grave'}); put('cross',GX,GZ+4,{kit:'grave'}); put('fire-basket',GX-2,GZ+2,{kit:'grave'}); put('fire-basket',GX+2,GZ+2,{kit:'grave'});
const gs=['gravestone-cross','gravestone-round','gravestone-bevel','gravestone-cross','gravestone-round'];
for(let r=0;r<3;r++)for(let c=0;c<4;c++){ put(gs[(r*4+c)%gs.length],GX-3+c*2,GZ+1+r*1.4,{kit:'grave',ry:(r+c)*0.3}); put('grave',GX-3+c*2,GZ+1.6+r*1.4,{kit:'grave'}); }
['pine','pine-crooked','pine-fall','pine'].forEach((p,i)=>put(p,GX-5+i*0.5,GZ-4+i*3,{kit:'grave',ry:i,s:1.1}));
put('pumpkin',GX-4,GZ+5,{kit:'grave'}); put('pumpkin-carved',GX-3,GZ+5.5,{kit:'grave'}); put('urn-round',GX+3,GZ+4,{kit:'grave'});
put('lightpost-single',GX-5,GZ,{kit:'grave'}); put('lightpost-double',GX+5,GZ+1,{kit:'grave'}); put('lantern-candle',GX,GZ+2.4,{kit:'grave'});
// 철제 펜스 둘레
for(let c=-4;c<=4;c++) put('iron-fence',GX+c,GZ+6,{kit:'grave'});
for(let c=-4;c<=4;c++) put('iron-fence',GX+c,GZ-6,{kit:'grave'});
for(let r=-6;r<=6;r+=2) put('iron-fence',GX-5,GZ+r,{kit:'grave',ry:P2});
put('iron-fence-border-gate',GX+5,GZ,{kit:'grave',ry:P2});
put('stone-wall',GX+5,GZ-3,{kit:'grave',ry:P2}); put('rocks-tall',GX-6,GZ-6,{kit:'grave'});
// ════ 성 키트: 공성 무기 마당(공방) + 깃발 ════
put('siege-catapult',9,1,{kit:'castle',ry:-P2}); put('siege-ram',10,2.4,{kit:'castle',ry:-P2}); put('siege-trebuchet',11,0.4,{kit:'castle',ry:-P2}); put('siege-ballista',9,3,{kit:'castle',ry:-P2});
put('flag',-0.6,-0.6,{kit:'castle'}); put('flag-pennant',0.6,0.6,{kit:'castle'}); put('flag-banner-long',-4,-4,{kit:'castle'}); put('flag-banner-long',4,4,{kit:'castle'}); put('flag-wide',0,-6.6,{kit:'castle'});
put('rocks-large',13,-1,{kit:'castle'});
// ════ 서바이벌 키트: 야영지 + 자원 더미 ════
put('tent',-9,4,{kit:'surv',ry:0.4}); put('tent-canvas',-8,6,{kit:'surv',ry:-0.3}); put('campfire-pit',-8,5,{kit:'surv'}); put('chest',-10,4,{kit:'surv',ry:0.5}); put('barrel',-7,4,{kit:'surv'}); put('box-large',-10,6,{kit:'surv'}); put('signpost',-6,5,{kit:'surv',ry:0.6});
put('resource-wood',-9,-4,{kit:'surv'}); put('resource-stone',-10,-3,{kit:'surv'}); put('resource-planks',-8,-4.5,{kit:'surv'}); put('barrel',6.5,-3.5,{kit:'surv'}); put('box',-4,6.5,{kit:'surv'}); put('bucket',1,-2,{kit:'surv'});
// ════ 음식 키트: 시장 좌판 위 상품 ════
put('apple',1.2,3.6,{kit:'food',s:1.4}); put('bread',1.8,3.6,{kit:'food',s:1.4}); put('cheese',1.2,4.3,{kit:'food',s:1.4}); put('fish',1.8,4.3,{kit:'food',s:1.4});
put('carrot',3.2,3.6,{kit:'food',s:1.4}); put('corn',3.8,3.6,{kit:'food',s:1.4}); put('cabbage',3.2,4.3,{kit:'food',s:1.4}); put('bag',3.8,4.3,{kit:'food',s:1.2});
// ════ 애니메이션 캐릭터 ════
chr('character-keeper',0,3,{clip:'walk',patrol:[[-3,3],[3,3]]});    // 마을 관리인 산책
chr('character-keeper',-5,-1,{clip:'idle',ry:1});                   // 상인
chr('character-skeleton',GX-1,GZ+3,{kit:'grave',clip:'walk',patrol:[[GX-3,GZ+3],[GX+3,GZ+3]]});
chr('character-zombie',GX+2,GZ,{kit:'grave',clip:'idle',ry:2});
chr('character-vampire',GX,GZ-1.5,{kit:'grave',clip:'idle',ry:PI});
chr('character-ghost',GX-3,GZ-2,{kit:'grave',clip:'idle',y:0.4});
// ════ 병렬 로드 → 배치 ════
const envKeys=[...new Set(ENV.map(p=>(p.o.kit||'town')+'|'+p.n))];
const charNames=[...new Set(CH.map(c=>c.n))];
Promise.all([
  ...envKeys.map(k=>{ const [kit,n]=k.split('|'); return gl.loadAsync(base(kit)+n+'.glb').then(g=>{cache[k]=g.scene;}).catch(e=>err.textContent+='\n'+n+':'+e.message); }),
  ...charNames.map(n=>gl.loadAsync(GRAVE+n+'.glb').then(g=>{charG[n]=g;}).catch(e=>err.textContent+='\nCH '+n+':'+e.message))
]).then(()=>{
  for(const {n,x,z,o} of ENV){ const src=cache[(o.kit||'town')+'|'+n]; if(!src)continue; const m=src.clone(true);
    m.position.set(x,o.y||0,z); m.rotation.y=o.ry||0; if(o.s)m.scale.setScalar(o.s);
    m.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); root.add(m); }
  for(const {n,x,z,o} of CH){ const g=charG[n]; if(!g)continue; const obj=skClone(g.scene);
    obj.position.set(x,o.y||0,z); obj.rotation.y=o.ry||0; obj.scale.setScalar(0.9);
    obj.traverse(c=>{if(c.isMesh){c.castShadow=true;c.frustumCulled=false;}}); root.add(obj);
    const mx=new THREE.AnimationMixer(obj); const cl=g.animations.find(a=>a.name===(o.clip||'idle'))||g.animations.find(a=>a.name==='idle')||g.animations[0];
    if(cl){ mx.clipAction(cl).play(); } mixers.push(mx);
    if(o.patrol){ walkers.push({obj,a:o.patrol[0],b:o.patrol[1],t:Math.random(),dir:1,sp:0.5}); } }
  mixers.forEach(m=>m.update(0.6));   // 첫 프레임 포즈
  tag.textContent='🏰 룬테라 타운 · 건물+묘지 '+root.children.length+'개 · 🎬캐릭터 '+mixers.length;
  document.title='TOWN_READY_'+root.children.length+'_CH'+mixers.length;
  renderer.render(scene,cam);
});
addEventListener('resize',()=>{ const w=innerWidth,h=innerHeight,a=w/h; cam.left=-D*a;cam.right=D*a;cam.top=D;cam.bottom=-D;cam.updateProjectionMatrix(); renderer.setSize(w,h); });
(function loop(){ const dt=Math.min(0.05,clock.getDelta());
  mixers.forEach(m=>m.update(dt));
  walkers.forEach(w=>{ w.t+=dt*w.sp*0.35*w.dir; if(w.t>1){w.t=1;w.dir=-1;} if(w.t<0){w.t=0;w.dir=1;}
    const x=w.a[0]+(w.b[0]-w.a[0])*w.t, z=w.a[1]+(w.b[1]-w.a[1])*w.t; w.obj.position.x=x; w.obj.position.z=z;
    w.obj.rotation.y=Math.atan2((w.b[0]-w.a[0])*w.dir,(w.b[1]-w.a[1])*w.dir); });
  ctrl.update(); renderer.render(scene,cam); requestAnimationFrame(loop); })();
</script></body></html>

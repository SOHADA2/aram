<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;}
body{margin:0;background:#0a0a0f;font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;justify-content:center;padding:16px;}
.map-shell{position:relative;width:740px;border-radius:16px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 0 6px #6b4f24, inset 0 0 0 8px #2a1d0c;}
.map-head{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:linear-gradient(180deg,rgba(20,14,6,.92),rgba(20,14,6,0));}
.map-title{font-weight:900;font-size:17px;color:#f0dca0;letter-spacing:1px;text-shadow:0 2px 4px #000;}
.map-gold{font-family:monospace;font-weight:800;color:#ffd76a;font-size:13px;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:20px;border:1px solid rgba(200,168,75,.4);}
.map-canvas{position:relative;width:740px;height:860px;}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* 지역 노드 */
.node{position:absolute;transform:translate(-50%,-50%);z-index:10;text-align:center;cursor:pointer;}
.node .pin{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:5px 10px 6px;border-radius:12px;
  background:linear-gradient(180deg,rgba(28,22,12,.94),rgba(14,10,5,.94));border:1px solid #7a5c1e;box-shadow:0 4px 12px rgba(0,0,0,.55);min-width:74px;}
.node .ic{font-size:20px;line-height:1;filter:drop-shadow(0 1px 2px #000);}
.node .nm{font-size:11.5px;font-weight:800;color:#f0e2b8;letter-spacing:.3px;}
.node .meta{font-size:9px;color:#c9b98a;font-weight:700;}
.node .thr{font-size:9px;color:#ff9a6a;letter-spacing:-1px;}
.node.locked .pin{filter:grayscale(.7);opacity:.6;}
.node.locked .lock{font-size:14px;}
.node.home .pin{border-color:#ffd76a;box-shadow:0 0 0 2px rgba(255,215,106,.35),0 4px 14px rgba(0,0,0,.6);background:linear-gradient(180deg,rgba(60,44,14,.96),rgba(30,20,6,.96));}
.node.home .badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;color:#2a1c06;background:linear-gradient(135deg,#f4e3a8,#d8b45a);padding:1px 7px;border-radius:8px;white-space:nowrap;}
.node.active .pin{border-color:#a78bfa;box-shadow:0 0 0 2px rgba(167,139,250,.4),0 0 18px rgba(167,139,250,.5);animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(167,139,250,.25),0 0 26px rgba(167,139,250,.7);}}
.node.active .badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;color:#fff;background:linear-gradient(135deg,#8b5cf6,#a78bfa);padding:1px 7px;border-radius:8px;white-space:nowrap;}
/* 원정 토큰 */
.token{position:absolute;transform:translate(-50%,-50%);z-index:11;font-size:22px;filter:drop-shadow(0 2px 4px #000);}
.token .t-time{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:#c4b5fd;background:rgba(10,6,20,.85);padding:1px 6px;border-radius:8px;white-space:nowrap;font-family:monospace;}
/* 하단 정보바 */
.map-foot{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:10px 14px 12px;background:linear-gradient(0deg,rgba(16,11,4,.96),rgba(16,11,4,0));}
.foot-card{display:flex;align-items:center;gap:10px;background:rgba(28,22,12,.9);border:1px solid #7a5c1e;border-radius:12px;padding:9px 12px;}
.foot-ic{font-size:26px;}
.foot-info{flex:1;min-width:0;}
.foot-nm{font-size:13px;font-weight:900;color:#f0e2b8;}
.foot-sub{font-size:10.5px;color:#b9a878;line-height:1.5;}
.foot-btn{padding:9px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,#d4a843,#f0c84a);color:#1a1206;font-size:13px;font-weight:800;white-space:nowrap;}
.legend{position:absolute;top:44px;right:12px;z-index:20;font-size:9px;color:#c9b98a;background:rgba(10,7,3,.6);border-radius:8px;padding:5px 8px;line-height:1.7;}
</style></head><body>
<div class="map-shell">
<div class="map-canvas" id="cv">
  <svg viewBox="0 0 740 860" preserveAspectRatio="none">
    <defs>
      <radialGradient id="sea" cx="50%" cy="42%" r="75%">
        <stop offset="0%" stop-color="#2a3b46"/><stop offset="60%" stop-color="#1a2a34"/><stop offset="100%" stop-color="#0e181f"/>
      </radialGradient>
      <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b9a06a"/><stop offset="100%" stop-color="#8a7444"/>
      </linearGradient>
      <filter id="coast"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="16"/></filter>
      <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter>
    </defs>
    <rect width="740" height="860" fill="url(#sea)"/>
    <!-- 위경도 그리드 -->
    <g stroke="rgba(200,180,120,.06)" stroke-width="1">
      <path d="M0 160H740M0 320H740M0 480H740M0 640H740M0 800H740"/>
      <path d="M148 0V860M296 0V860M444 0V860M592 0V860"/>
    </g>
    <g filter="url(#coast)" stroke="#5f4a22" stroke-width="2.5">
      <!-- 발로란(북부 대륙) -->
      <path fill="url(#land)" d="M92,150 C60,80 210,52 350,72 C470,88 560,72 612,138 C666,205 600,320 500,352 C380,388 210,384 148,340 C66,292 66,200 92,150 Z"/>
      <!-- 슈리마(남부 대륙) -->
      <path fill="url(#land)" d="M196,612 C300,566 486,576 548,632 C598,676 566,792 474,832 C360,878 246,862 196,808 C142,750 146,652 196,612 Z"/>
      <!-- 아이오니아(동쪽 섬들) -->
      <path fill="url(#land)" d="M628,236 C672,214 712,232 710,280 C708,322 664,332 632,308 C600,285 592,258 628,236 Z"/>
      <path fill="url(#land)" d="M690,330 C714,324 726,346 708,362 C692,376 674,356 690,330 Z"/>
      <!-- 빌지워터(섬) -->
      <path fill="url(#land)" d="M528,404 C570,392 600,410 594,442 C588,470 546,478 520,456 C498,438 500,418 528,404 Z"/>
      <!-- 이쉬탈(정글·슈리마 남동) -->
      <path fill="#6f7a3e" d="M566,760 C610,748 646,764 638,796 C630,824 586,830 560,808 C540,790 540,772 566,760 Z"/>
    </g>
    <!-- 그림자 군도(저주받은 어두운 섬) -->
    <g filter="url(#rough)"><path fill="#1f3a34" stroke="#0c221d" stroke-width="2" d="M622,470 C654,462 676,482 664,506 C654,526 622,526 608,506 C596,489 600,478 622,470 Z"/></g>
    <!-- 밴들 시티(영혼계·환상 섬·은은한 발광) -->
    <g filter="url(#rough)"><path fill="#7a5a86" stroke="#4a3358" stroke-width="2" d="M198,442 C240,428 278,446 272,476 C266,504 224,510 200,488 C182,472 178,456 198,442 Z"/></g>
    <!-- 대륙 라벨 -->
    <text x="300" y="220" fill="rgba(60,44,16,.5)" font-size="26" font-weight="800" letter-spacing="8" text-anchor="middle" font-family="Georgia">VALORAN</text>
    <text x="366" y="720" fill="rgba(60,44,16,.5)" font-size="24" font-weight="800" letter-spacing="10" text-anchor="middle" font-family="Georgia">SHURIMA</text>
    <!-- 원정 경로(밴들→그림자군도) 점선 -->
    <path d="M232,480 Q460,470 636,494" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round" opacity=".8"/>
    <!-- 나침반 -->
    <g transform="translate(672,792)" opacity=".55"><circle r="26" fill="none" stroke="#c8a24a" stroke-width="1.5"/><path d="M0,-24 L5,0 L0,24 L-5,0 Z" fill="#c8a24a"/><path d="M-24,0 L0,-5 L24,0 L0,5 Z" fill="#8a6a24"/><text y="-30" fill="#c8a24a" font-size="11" text-anchor="middle" font-weight="800">N</text></g>
  </svg>

  <!-- 지역 노드 -->
  <div class="node home" style="left:31%;top:52%;"><span class="badge">🏠 홈</span><div class="pin"><span class="ic">🍄</span><span class="nm">밴들 시티</span><span class="meta">⏱ 20분 · ☆</span></div></div>
  <div class="node" style="left:20%;top:25%;"><div class="pin"><span class="ic">🦅</span><span class="nm">데마시아</span><span class="meta">⏱ 40분</span><span class="thr">★</span></div></div>
  <div class="node locked" style="left:57%;top:23%;"><div class="pin"><span class="ic">⚔️</span><span class="nm">녹서스 <span class="lock">🔒</span></span><span class="meta">확장 예정</span></div></div>
  <div class="node" style="left:43%;top:41%;"><div class="pin"><span class="ic">⚙️</span><span class="nm">자운</span><span class="meta">⏱ 1시간</span><span class="thr">★★</span></div></div>
  <div class="node" style="left:90%;top:33%;"><div class="pin"><span class="ic">🌸</span><span class="nm">아이오니아</span><span class="meta">⏱ 1시간</span><span class="thr">★★</span></div></div>
  <div class="node locked" style="left:75%;top:59%;"><div class="pin"><span class="ic">🌊</span><span class="nm">빌지워터 <span class="lock">🔒</span></span><span class="meta">⏱ 1:20 · ★★★</span></div></div>
  <div class="node locked" style="left:50%;top:9%;"><div class="pin"><span class="ic">❄️</span><span class="nm">프렐요드 <span class="lock">🔒</span></span><span class="meta">⏱ 1:40 · ★★★</span></div></div>
  <div class="node locked" style="left:47%;top:74%;"><div class="pin"><span class="ic">🏜️</span><span class="nm">슈리마 <span class="lock">🔒</span></span><span class="meta">⏱ 2:00 · ★★★</span></div></div>
  <div class="node active" style="left:86%;top:57%;"><span class="badge">원정 중</span><div class="pin"><span class="ic">🌙</span><span class="nm">그림자 군도</span><span class="meta">★★★★</span></div></div>
  <div class="node locked" style="left:58%;top:87%;"><div class="pin"><span class="ic">🔮</span><span class="nm">공허 <span class="lock">🔒</span></span><span class="meta">⏱ 3~4h · ★★★★★</span></div></div>

  <!-- 이동 중 토큰 -->
  <div class="token" style="left:62%;top:56.5%;">🐱<span class="t-time">⏱ 1:12:30 남음</span></div>

  <div class="legend">⏱ 이동시간 · ★ 위협도<br>🔒 해금 필요 · 🏠 홈</div>
</div>
<div class="map-head"><span class="map-title">🗺️ 룬테라 원정</span><span class="map-gold">🪙 51,409G</span></div>
<div class="map-foot">
  <div class="foot-card">
    <span class="foot-ic">🌸</span>
    <div class="foot-info"><div class="foot-nm">아이오니아 <span style="color:#ff9a6a;font-size:10px;">★★ 위협</span></div>
      <div class="foot-sub">⏱ 약 1시간 · 🏠 요네·진·야스오 고향(보너스) · 보상: 골드 + 강화권/정수</div></div>
    <button class="foot-btn">파견 보내기 ›</button>
  </div>
</div>
</div>
</body></html>

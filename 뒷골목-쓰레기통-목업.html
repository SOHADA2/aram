<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
body{background:#07070c;font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;justify-content:center;padding:14px;min-height:100vh;}
.sheet{width:400px;border-radius:16px;overflow:hidden;background:#0b0a10;box-shadow:0 30px 80px rgba(0,0,0,.75);position:relative;}
/* ── 뒷골목 씬 ── */
.scene{position:relative;height:500px;overflow:hidden;image-rendering:auto;}
/* 밤하늘 */
.sky{position:absolute;top:0;left:0;right:0;height:70px;background:linear-gradient(180deg,#0e1424,#1a2036);z-index:1;}
.sky::after{content:'🌙';position:absolute;top:8px;right:22px;font-size:20px;filter:drop-shadow(0 0 8px rgba(255,240,200,.5));}
/* 지붕(빨간 기와) */
.roof{position:absolute;top:44px;left:-10px;right:-10px;height:52px;z-index:3;
  background:url('assets/alley/roof_clay_red_center.png') repeat;background-size:52px;
  box-shadow:0 8px 14px rgba(0,0,0,.55);border-top:2px solid #7a3320;filter:brightness(.82) saturate(1.05);}
.roof::after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(180deg,#2a1810,transparent);}
/* 건물 벽(하프팀버) */
.facade{position:absolute;top:92px;left:0;right:0;bottom:118px;z-index:2;
  background:url('assets/alley/timber_square_planks.png') repeat;background-size:72px;filter:brightness(.62) saturate(.9);}
.facade::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,rgba(0,0,0,.5));}
/* 벽돌 하단 굽 */
.plinth{position:absolute;left:0;right:0;bottom:118px;height:44px;z-index:3;
  background:url('assets/alley/wall_brick_sand_both.png') repeat;background-size:64px 128px;filter:brightness(.6) saturate(.85);
  box-shadow:inset 0 8px 12px rgba(0,0,0,.4);}
/* 바닥(자갈) */
.floor{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:4;
  background:url('assets/alley/floor_stone.png') repeat;background-size:60px;filter:brightness(.5) saturate(.85);
  box-shadow:inset 0 12px 18px rgba(0,0,0,.55);}
.floor::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 50% -10%,rgba(0,0,0,.5),transparent 60%);}
/* ── 복권방 정문(불 켜진 문) ── */
.shop{position:absolute;top:132px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;}
.shop .door{width:100px;height:184px;background:url('assets/alley/door_wood_window_lit.png') no-repeat center/contain;
  filter:drop-shadow(0 0 24px rgba(255,190,90,.55)) drop-shadow(0 8px 10px rgba(0,0,0,.6));}
.shop-glow{position:absolute;top:128px;left:50%;transform:translateX(-50%);width:220px;height:230px;z-index:4;pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(255,196,110,.32),transparent 62%);}
/* 매달린 간판 */
.sign{position:absolute;top:90px;left:50%;transform:translateX(-50%);z-index:6;text-align:center;}
.sign .rope{width:2px;height:14px;margin:0 auto;background:#2a1c0c;}
.sign .board{display:inline-block;padding:6px 16px;border-radius:8px;position:relative;
  background:linear-gradient(180deg,#6a4a24,#3f2a12);border:2px solid #8a6a30;box-shadow:0 6px 12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,150,.2);}
.sign .board b{font-size:14px;font-weight:900;color:#f7e2ad;text-shadow:0 1px 2px #000;letter-spacing:1px;}
.sign .board small{display:block;font-size:8px;color:#d8b878;letter-spacing:3px;margin-top:1px;}
.sign .board::before,.sign .board::after{content:'';position:absolute;top:-4px;width:5px;height:5px;border-radius:50%;background:#caa24e;}
.sign .board::before{left:8px;}.sign .board::after{right:8px;}
/* 랜턴 */
.lantern{position:absolute;top:120px;z-index:6;font-size:22px;filter:drop-shadow(0 0 10px rgba(255,190,90,.8));animation:sway 3.5s ease-in-out infinite;}
.lantern.l{left:40px;top:106px;}.lantern.r{right:40px;animation-delay:1.2s;}
@keyframes sway{50%{transform:rotate(6deg);}}
/* 작은 창문 */
.win{position:absolute;top:158px;z-index:5;width:46px;height:56px;border-radius:4px;border:3px solid #3a2814;
  background:linear-gradient(180deg,#ffcf87,#e07a1e);box-shadow:0 0 16px rgba(255,180,90,.5),inset 0 0 0 2px #2a1c0c;
  background-image:linear-gradient(#2a1c0c 0 0),linear-gradient(#2a1c0c 0 0);background-size:100% 2px,2px 100%;background-position:center;background-repeat:no-repeat;}
.win.l{left:34px;top:150px;}.win.r{right:34px;top:150px;}
/* ── 쓰레기통(자갈 위) ── */
.can{position:absolute;bottom:12px;left:50%;transform:translateX(-52%);z-index:8;width:150px;height:172px;cursor:grab;}
.can .yuumi{position:absolute;top:-52px;left:50%;transform:translateX(-50%);font-size:52px;z-index:9;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));animation:dig 1.1s ease-in-out infinite;}
@keyframes dig{50%{transform:translateX(-50%) translateY(4px) rotate(-4deg);}}
.can .lid{position:absolute;top:-2px;left:50%;transform:translateX(-50%) rotate(-9deg);width:158px;height:22px;border-radius:8px 8px 4px 4px;
  background:linear-gradient(180deg,#8a8d92,#5c5f64);border:2px solid #3e4044;z-index:3;box-shadow:0 3px 6px rgba(0,0,0,.5);}
.can .lid::after{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:32px;height:10px;background:#6b6e73;border:2px solid #3e4044;border-radius:6px 6px 0 0;}
.can .body{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:146px;height:156px;overflow:hidden;
  background:linear-gradient(90deg,#46484d,#7c7f84 40%,#3e4044);border:2px solid #2b2c2f;border-radius:10px 10px 16px 16px/8px 8px 26px 26px;box-shadow:inset 0 0 18px rgba(0,0,0,.5);}
.can .body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,0,0,.14) 14px 16px);}
.can .junk{position:absolute;bottom:6px;width:100%;text-align:center;font-size:22px;letter-spacing:2px;line-height:1.3;}
.can .glowline{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:120px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);z-index:2;}
.fly{position:absolute;font-size:11px;z-index:9;animation:fly 4s linear infinite;}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(14px,-10px)}50%{transform:translate(4px,-18px)}75%{transform:translate(-12px,-6px)}100%{transform:translate(0,0)}}
/* 비/분위기 */
.rain{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.14;
  background:repeating-linear-gradient(78deg,transparent 0 22px,rgba(180,200,230,.5) 22px 23px);animation:rain .5s linear infinite;}
@keyframes rain{to{background-position:0 26px;}}
.vig{position:absolute;inset:0;z-index:10;pointer-events:none;box-shadow:inset 0 0 90px 24px rgba(0,0,0,.7);}
/* 헤더 */
.head{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;padding:9px 12px;
  background:linear-gradient(180deg,rgba(8,6,10,.85),transparent);}
.head .tt{flex:1;font-weight:900;color:#f2e2ad;font-size:14px;text-shadow:0 2px 4px #000;}
.head .x{width:28px;height:28px;border:none;border-radius:8px;background:rgba(0,0,0,.5);color:#e8dcc0;font-size:15px;}
/* ── 하단 UI 패널(나무 간판) ── */
.panel{background:linear-gradient(180deg,#1a130b,#120d07);border-top:2px solid #6b4f24;padding:11px 13px 14px;}
.digs{display:flex;gap:7px;margin-bottom:9px;}
.dig-slot{flex:1;text-align:center;padding:6px 4px;border-radius:9px;background:linear-gradient(180deg,rgba(60,44,20,.5),rgba(20,14,8,.6));border:1px solid #6b4f24;}
.dig-slot .ic{font-size:16px;}.dig-slot .lb{font-size:8px;color:#c9b98a;font-weight:700;margin-top:1px;}
.dig-slot.got{opacity:.4;filter:grayscale(.6);}
.prog{height:8px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin-bottom:7px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
.prog>div{height:100%;width:38%;background:linear-gradient(90deg,#d4a843,#f0c84a);}
.hint{font-size:10px;color:#c9b98a;text-align:center;}
.hint b{color:#ffd76a;}
.earn{margin-top:8px;text-align:center;font-size:11px;color:#8fce8a;font-weight:800;}
.cap{font-size:11px;color:#7a8a6a;text-align:center;padding:8px;}
</style></head>
<body>
<div class="sheet">
  <div class="scene" id="scene">
    <div class="sky"></div>
    <div class="roof"></div>
    <div class="facade"></div>
    <div class="plinth"></div>
    <div class="shop-glow"></div>
    <div class="win l"></div><div class="win r"></div>
    <div class="lantern l">🏮</div><div class="lantern r">🏮</div>
    <div class="sign"><div class="rope"></div><div class="board"><b>🎟 복권방</b><small>뒷골목 상점</small></div></div>
    <div class="shop"><div class="door"></div></div>
    <div class="floor"></div>
    <div class="fly" style="bottom:150px;left:44%;">🪰</div>
    <div class="can" id="can">
      <div class="glowline"></div>
      <div class="yuumi">🐱</div>
      <div class="lid"></div>
      <div class="body"><div class="junk">🥫🍌📄<br>🐟🦴🧦📦</div></div>
    </div>
    <div class="rain"></div>
    <div class="vig"></div>
    <div class="head"><span class="tt">🗑️ 뒷골목 쓰레기통</span><button class="x">✕</button></div>
  </div>
  <div class="panel">
    <div class="digs">
      <div class="dig-slot"><div class="ic">🥈</div><div class="lb">실버 무료</div></div>
      <div class="dig-slot"><div class="ic">🥇</div><div class="lb">골드 무료</div></div>
      <div class="dig-slot got"><div class="ic">🌈</div><div class="lb">받음</div></div>
    </div>
    <div class="prog"><div></div></div>
    <div class="hint">🐱 <b>유미가 뒤적뒤적</b> 뒤지는 중 · 손을 넣어 함께 뒤져보세요</div>
    <div class="earn">이번 판 +180 🪙 · 무료 복권 1장</div>
  </div>
  <div class="cap">목업 — 뒷골목 복권방 씬 (실제 유미는 3D)</div>
</div>
</body></html>

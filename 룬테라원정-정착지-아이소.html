<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+KR:wght@700;900&display=swap');
*{box-sizing:border-box;}
body{margin:0;background:#07070c;font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;justify-content:center;padding:14px;}
.card{width:420px;position:relative;border-radius:20px;overflow:hidden;background:#0b0a10;box-shadow:0 30px 80px rgba(0,0,0,.75);}
.frame{position:absolute;inset:0;z-index:30;pointer-events:none;border-radius:20px;
  box-shadow:inset 0 0 0 2px #3a2c12,inset 0 0 0 4px #caa24e,inset 0 0 0 6px #7a5c22,inset 0 0 0 7px #2a1e0c,inset 0 0 60px rgba(0,0,0,.5);}
.hd{position:relative;z-index:12;display:flex;align-items:center;gap:8px;padding:12px 16px 8px;background:linear-gradient(180deg,rgba(20,15,8,.95),transparent);}
.hd .bk{width:30px;height:30px;border:none;border-radius:8px;background:rgba(0,0,0,.45);color:#e8dcc0;font-size:16px;}
.hd h1{margin:0;font-family:'Cinzel',serif;font-weight:800;font-size:18px;letter-spacing:1px;background:linear-gradient(180deg,#fdf1c4,#e9c766 55%,#b98b32);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hd .sub{font-size:9px;color:#c9a86a;letter-spacing:2px;}
.hd .ttl{flex:1;}
.pips{display:flex;gap:3px;}
.pips i{width:6px;height:6px;border-radius:50%;background:#ff7a4a;box-shadow:0 0 6px rgba(255,120,74,.7);}
.pips i.off{background:#3a2a20;box-shadow:none;}
.res{position:relative;z-index:12;display:flex;gap:7px;padding:0 14px 8px;}
.rc{flex:1;display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:11px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.35));border:1px solid rgba(202,162,78,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.rc .ico{font-size:15px;}
.rc .v{font-family:'Cinzel',serif;font-weight:800;font-size:12px;color:#f3e6c4;}
.rc .r{font-size:8px;color:#7fbf6a;font-weight:700;}
/* 아이소 씬 */
.scene{position:relative;z-index:5;height:420px;overflow:hidden;
  background:radial-gradient(60% 44% at 50% 40%,#3a3550,#1a1826 60%,#0c0b12 100%);}
.scene::before{content:'';position:absolute;inset:0;background:radial-gradient(50% 34% at 50% 36%,rgba(255,224,150,.14),transparent 70%);}
.scene::after{content:'';position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 42%,transparent 55%,rgba(0,0,0,.6));pointer-events:none;z-index:50;}
.scene img{position:absolute;image-rendering:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4));}
.tag{position:absolute;z-index:40;transform:translate(-50%,0);text-align:center;pointer-events:none;}
.tag .lv{font-family:'Cinzel',serif;font-size:8px;font-weight:800;color:#3a2a08;background:linear-gradient(180deg,#fbe9a8,#d9ab48);border:1px solid #8a6a24;border-radius:7px;padding:0 6px;box-shadow:0 2px 3px rgba(0,0,0,.5);}
.tag .nm{display:block;font-size:8.5px;font-weight:800;color:#f0e2c0;text-shadow:0 1px 2px #000;margin-top:1px;}
.hero-nm{position:absolute;z-index:40;transform:translate(-50%,0);text-align:center;font-size:9px;font-weight:800;color:#cdb4ff;text-shadow:0 1px 2px #000;}
.hero-nm .hp{width:38px;height:4px;border-radius:3px;background:rgba(0,0,0,.55);margin:1px auto 0;overflow:hidden;}
.hero-nm .hp>div{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);}
.raidtag{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:45;font-size:10px;font-weight:800;color:#ffd0b8;background:linear-gradient(180deg,rgba(60,18,14,.92),rgba(30,10,8,.92));border:1px solid #8a3a2a;border-radius:20px;padding:3px 12px;}
.raidtag b{color:#ff9a6a;}
.foot{position:relative;z-index:12;padding:10px 16px 14px;background:linear-gradient(0deg,#0d0a06,transparent);}
.dmeta{display:flex;justify-content:space-between;font-size:11px;color:#c9a86a;margin-bottom:5px;}
.dmeta b{color:#f3e6c4;}
.dbar{height:9px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
.dbar .def{height:100%;width:76%;background:linear-gradient(90deg,#1f7a3a,#4ade80 60%,#a7f3c0);box-shadow:0 0 10px rgba(74,222,128,.5);}
.dbar .ln{position:absolute;top:-2px;bottom:-2px;left:64%;width:2px;background:#ff7a5a;}
.ok{color:#8ef0a8;font-weight:800;}
</style></head><body>
<div class="card">
  <div class="hd"><button class="bk">‹</button><div class="ttl"><h1>IONIA · 아이오니아</h1><div class="sub">FIRST LANDS · 정착지</div></div><div class="pips"><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i></div></div>
  <div class="res">
    <div class="rc"><span class="ico">🪙</span><div><div class="v">51,409</div><div class="r">+8/분</div></div></div>
    <div class="rc"><span class="ico">🪨</span><div><div class="v">340</div><div class="r">+12</div></div></div>
    <div class="rc"><span class="ico">🪵</span><div><div class="v">280</div><div class="r">+12</div></div></div>
    <div class="rc"><span class="ico">🔮</span><div><div class="v">46</div><div class="r">+3</div></div></div>
  </div>
  <div class="scene" id="scene"></div>
  <div class="foot">
    <div class="dmeta"><span>🛡️ 방어력 <b>84</b> · 타워2 + 야스오</span><span class="ok">✦ 방어 성공 예상</span></div>
    <div class="dbar"><div class="def"></div><div class="ln"></div></div>
  </div>
  <div class="frame"></div>
</div>
<script>
const A='assets/rune/iso/';
const scene=document.getElementById('scene');
const TW=132, DX=TW/2, DY=TW/4, AN=0.80;   // 스프라이트폭 · 아이소 스텝 · 바닥앵커
const cx=210, cy=96;
function put(src,col,row,o){ o=o||{}; const sc=o.scale||1; const w=TW*sc, h=w*2;
  const x=cx+(col-row)*DX, y=cy+(col+row)*DY;
  const img=new Image(); img.src=A+src+'.png'; img.style.width=w+'px';
  img.style.left=(x-w/2)+'px'; img.style.top=(y-h*AN+(o.ey||0))+'px';
  img.style.zIndex=Math.round((col+row)*10+(o.dz||0));
  scene.appendChild(img); return {x,y,img}; }
function label(col,row,nm,lv,ey){ const x=cx+(col-row)*DX, y=cy+(col+row)*DY;
  const d=document.createElement('div'); d.className='tag'; d.style.left=x+'px'; d.style.top=(y-42+(ey||0))+'px';
  d.innerHTML=`<span class="lv">Lv${lv}</span><span class="nm">${nm}</span>`; scene.appendChild(d); }
// 바닥(3x3)
for(let r=0;r<3;r++)for(let c=0;c<3;c++) put((c+r)%2?'stoneTile_E':'stoneTile_N',c,r,{dz:-5});
// 성벽(뒤쪽 두 변) + 문
put('stoneWall_N',-1,0); put('stoneWall_N',-1,1); put('stoneWallCorner_N',-1,-1);
put('stoneWall_E',0,-1); put('stoneWallGate_N',1,-1); put('stoneWallWindow_E',2,-1);
put('stoneWallCorner_E',3,-1);
// 구조물(바닥 셀 위)
put('chestClosed_E',0,0,{dz:2}); label(0,0,'금광',2,-6);
put('woodenPile_E',2,0,{dz:2}); label(2,0,'벌목장',1,-4);
put('barrelsStacked_E',0,2,{dz:2}); label(0,2,'채석장',1,-2);
put('stoneColumn_E',2,2,{dz:2}); label(2,2,'룬 제단',1,-8);
put('tableRoundChairs_E',1,1,{dz:2}); label(1,1,'영웅 소환소',1,-2);
// 영웅
const H=put('hero_idle',1,2,{dz:5,scale:1.02});
const hn=document.createElement('div'); hn.className='hero-nm'; hn.style.left=H.x+'px'; hn.style.top=(H.y-6)+'px';
hn.innerHTML='야스오<div class="hp"><div style="width:62%"></div></div>'; scene.appendChild(hn);
</script>
<div class="raidtag" style="position:fixed;display:none"></div>
</body></html>

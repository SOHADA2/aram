<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>룬테라 전쟁 — 프로토타입 v0.4</title>
<style>
/* ═══ 클래식 전략 스타일 양피지 테마 ═══
   PC(≥900px)  = 브라우저 게임 레이아웃: 상단 메뉴 + 본문 + 우측 사이드바(개요) + 테이블 UI
   모바일(<900px) = 앱 레이아웃: 하단 탭바 + 카드 UI (모바일앱 스타일)         */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#0d0a06;color:#f0e2b8;font-family:'Noto Sans KR',system-ui,sans-serif;overscroll-behavior:none;
  background-image:radial-gradient(130% 80% at 50% 0,#1a1410,#0d0a06 55%,#00000066 100%);}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#17110a;
  box-shadow:0 0 0 1px #6b4f24,0 0 28px rgba(70,45,10,.4);}
/* 상단 스트립(목재) */
.topstrip{position:relative;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:2px solid #6b4f24;color:#f7e8bd;background-image:linear-gradient(180deg,rgba(34,23,11,.60),rgba(13,9,4,.85)),url('assets/alley/floor_stone_pattern.png');background-size:auto,130px;background-repeat:repeat;box-shadow:inset 0 1px 0 rgba(255,228,170,.1);}
.logo{font-weight:900;font-size:15px;color:#ffe9ad;text-shadow:0 1px 2px #000;white-space:nowrap;}
.world{font-size:9.5px;color:#cbb27e;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-ic{cursor:pointer;font-size:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,230,170,.3);border-radius:8px;padding:3px 9px;color:#f0dca0;font-weight:800;font-family:inherit;}
/* 자원바(정통 전략식: 자원 3종 + 저장고 게이지 + 인구) */
.resbar{display:flex;gap:7px;padding:10px 10px 7px;border-bottom:2px solid #6b4f24;background-image:linear-gradient(180deg,rgba(24,17,8,.72),rgba(12,8,4,.86)),url('assets/alley/floor_stone_pattern.png');background-size:auto,118px;background-repeat:repeat;}
.res{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;row-gap:2px;align-items:center;min-width:0;border-radius:7px;padding:4px 8px 5px;background:linear-gradient(180deg,#2a2114,#181109);border:1px solid #6b4f24;box-shadow:inset 0 1px 0 rgba(255,228,170,.12),inset 0 -3px 5px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.5);}
.res .ricon{grid-row:1/3;display:flex;align-items:center;}
.res .rtop{display:flex;align-items:baseline;gap:4px;min-width:0;}
.res .rslash{font-size:9px;font-weight:700;color:#8f7f57;}
.res .rcap{flex:0 1 auto;min-width:0;font-size:9px;font-weight:700;color:#8f7f57;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;}
.res .rbar{grid-column:2;height:3px;border-radius:2px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);overflow:hidden;}
.res .rbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fae4a,#c4da84);transition:width .5s linear;}
.res.warn .rbar>i{background:linear-gradient(90deg,#d0982f,#f0d07a);}
.res.full .rbar>i{background:linear-gradient(90deg,#b8452f,#e88a6a);}
.res.full{border-color:#a35340;animation:resFull 1.6s ease-in-out infinite;}
@keyframes resFull{0%,100%{box-shadow:inset 0 1px 0 rgba(255,228,170,.12),0 0 0 0 rgba(200,90,60,0);}50%{box-shadow:inset 0 1px 0 rgba(255,228,170,.12),0 0 7px 0 rgba(200,90,60,.55);}}
.res i{font-style:normal;font-size:14px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}

.res em{flex:0 0 auto;font-style:normal;font-weight:800;font-size:13.5px;color:#f4e6bd;font-variant-numeric:tabular-nums;letter-spacing:.4px;line-height:1;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.5);}


.res.warn em{color:#f2c968;} .res.full em{color:#ff8f6a;}
.res s{text-decoration:none;font-size:9px;color:#8fce8a;font-weight:800;white-space:nowrap;margin-left:auto;}
.res.warn s{color:#e8c86a;} .res.full s{color:#e08a6a;}
/* 좁은 화면: 생산량 → 저장고 용량 순으로 접는다(수량과 게이지는 끝까지 유지) */
@media(max-width:430px){.res s{display:none;} .res{padding:4px 6px 5px;column-gap:4px;} .res em{font-size:12.5px;} .res .rcap{display:none;} .res.pop .rcap{display:inline;font-size:8.5px;}}
/* PC 상단 메뉴(클래식) — 모바일 숨김 */
.pcmenu{display:none;}
/* 모바일 하단 탭바 — PC 숨김 */
.tabbar{position:sticky;bottom:0;z-index:40;display:flex;border-top:2px solid #6b4f24;padding:4px 6px calc(4px + env(safe-area-inset-bottom));background-image:linear-gradient(180deg,rgba(24,17,8,.72),rgba(12,8,4,.88)),url('assets/alley/floor_stone_pattern.png');background-size:auto,118px;background-repeat:repeat;}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;border:none;background:none;color:#cbb27e;font-weight:800;font-size:9.5px;cursor:pointer;border-radius:8px;font-family:inherit;}
.tab .ti{font-size:17px;line-height:1.1;} .tab.on{color:#ffe9ad;background:rgba(255,230,170,.12);}
.bdg{position:absolute;top:0;right:14%;background:#c9372c;color:#fff;font-size:8px;font-weight:900;border-radius:8px;padding:0 4px;min-width:13px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.4);}
/* 본문 그리드 */
.main{flex:1;padding:8px;display:block;}
.content{min-width:0;}
.sidebar{display:none;}
/* 양피지 패널 */
.box{background:#251c11;border:1px solid #6b4f24;border-radius:5px;box-shadow:inset 0 1px 0 #241c12,0 1px 3px rgba(90,60,20,.25);margin-bottom:8px;overflow:hidden;}
.box>.bh{display:flex;align-items:center;gap:6px;padding:6px 10px;background:linear-gradient(180deg,#2a2013,#251c11);border-bottom:1px solid #6b4f24;font-weight:900;font-size:12px;color:#f0e2b8;}
.box>.bh small{font-weight:700;color:#b09a6a;font-size:10px;}
.box>.bc{padding:8px 10px;}
.box.warnbox{border-color:#8a6a24;background:#2b2115;}
.box.warnbox .bc{font-size:11.5px;line-height:1.6;}
/* 정통 전략식 테이블 */
.twt{width:100%;border-collapse:collapse;font-size:11px;}
.twt th{background:#2e2415;border:1px solid #6b4f24;padding:4px 5px;font-size:10px;color:#e8dcc0;white-space:nowrap;}
.twt td{border:1px solid #54401f;padding:4px 5px;background:#221910;color:#f0e2b8;}
.twt tr:nth-child(even) td{background:#2b2216;}
.twt td.eff{font-size:10px;color:#8fce8a;font-weight:700;}
.twt td.mut{color:#a89668;font-size:10px;}
.twt tr.hl td{background:#39311d;box-shadow:inset 0 0 0 1px #d8a72c;}
.twt.rpt td,.twt.rpt th{text-align:center;font-family:monospace;}
.twt.rpt td:first-child{text-align:left;font-family:inherit;font-weight:800;font-size:10px;}
.twt.rpt tr.lossr td{color:#ff9a8a;font-weight:800;background:#2c2015;}
/* 버튼 */
.btn{border:1px solid #6b4f24;border-radius:5px;font-weight:800;cursor:pointer;font-family:inherit;padding:7px 12px;
  background:linear-gradient(180deg,#f4e3b3,#dfc182);color:#2e1f08;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(80,50,10,.25);font-size:12px;}
.btn:active{transform:translateY(1px);}
.btn.sm{padding:4px 9px;font-size:10.5px;}
.btn-red{background:linear-gradient(180deg,#d97f5a,#bd5027);color:#fff;border-color:#8a3a1a;text-shadow:0 1px 1px rgba(0,0,0,.35);}
.btn-green{background:linear-gradient(180deg,#a8c46a,#7fa23e);color:#243208;border-color:#5a7a22;}
.btn-blue{background:linear-gradient(180deg,#9dc0e0,#6c98c2);color:#0d2438;border-color:#3c6890;}
.btn:disabled{opacity:.45;cursor:default;filter:grayscale(.4);}
.btn.no{opacity:.6;} .btn.no{filter:grayscale(.35);}
/* 보호 배너 */
.protect-banner{margin:8px 8px 0;padding:6px 11px;border-radius:6px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,#12243a,#0e1d30);border:1px solid #7fa3c6;color:#bcd6f5;}
.protect-banner b{color:#a9d4ff;} .protect-banner .pb-sub{margin-left:auto;font-size:9px;font-weight:700;color:#e0a86a;}
/* 지도 */
#view-map{position:relative;}
.map-wrap{position:relative;width:100%;height:calc(100vh - 188px);height:calc(100dvh - 188px);min-height:300px;border-radius:8px;overflow:hidden;cursor:grab;touch-action:none;
  background:radial-gradient(120% 100% at 50% 20%,#0e2632,#081820 60%,#050f14 100%);
  box-shadow:inset 0 0 0 2px #6b4f24,inset 0 0 0 4px #54401f,0 3px 12px rgba(70,45,10,.35);}
.map-wrap.grabbing{cursor:grabbing;}
.map-content{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.grid-canvas{position:absolute;inset:0;image-rendering:auto;}
#armies{position:absolute;inset:0;z-index:6;pointer-events:none;}
.army-mk{position:absolute;transform:translate(-50%,-50%) scale(var(--mkz,1));transform-origin:center;z-index:6;text-align:center;pointer-events:none;}
.army-mk .am-ic{font-size:16px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.85));display:inline-block;}
.army-mk .am-lbl{display:block;font-size:8px;font-weight:800;font-family:monospace;color:#f0dca0;background:rgba(10,7,4,.82);border-radius:6px;padding:0 4px;margin-top:-2px;white-space:nowrap;}
.army-mk.raid .am-ic{filter:drop-shadow(0 0 6px rgba(255,70,55,.9));}
.army-mk.raid .am-lbl{color:#ffb0a0;background:rgba(50,10,8,.9);}
.map-edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
#mnodes{position:absolute;inset:0;z-index:5;}
.vmk{position:absolute;width:0;height:0;z-index:1;}
.vmk-box{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(var(--mkz,1));transform-origin:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;}
.vmk-ic{font-size:15px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));display:flex;align-items:center;justify-content:center;border-radius:50%;width:30px;height:30px;}
.vmk.big .vmk-ic{font-size:21px;width:40px;height:40px;} .vmk.mid .vmk-ic{font-size:16px;width:32px;height:32px;} .vmk.sml .vmk-ic{font-size:12px;width:24px;height:24px;opacity:.92;}
.vmk.v-me .vmk-ic{box-shadow:0 0 0 2px rgba(240,220,150,.9),0 0 14px rgba(240,220,150,.5);}
.vmk.v-player .vmk-ic{box-shadow:0 0 0 2px rgba(120,170,255,.8);}
.vmk.v-barb .vmk-ic{box-shadow:0 0 0 1.5px rgba(180,180,180,.55);}
.vmk-tag{margin-top:2px;font-size:8px;font-weight:800;white-space:nowrap;padding:1px 6px;border-radius:7px;background:linear-gradient(135deg,#f4e3a8,#d8b45a);color:#2a1c06;}
.vmk-tag.player{background:linear-gradient(135deg,#bcd3ff,#6f93d6);color:#0a1730;}
.vmk-tag.barb{background:linear-gradient(135deg,#6a6f76,#3e4248);color:#251c11;font-family:monospace;}
.map-fb{position:absolute;left:8px;right:8px;bottom:8px;z-index:8;font-size:10px;font-weight:700;color:#ffd9c0;
  background:rgba(40,12,8,.88);border:1px solid #b3261e;border-radius:8px;padding:7px 10px;line-height:1.5;}
.map-fb small{display:block;margin-top:3px;font-size:9px;color:#ffb9a0;font-family:monospace;word-break:break-all;}
.pz-reset{position:absolute;right:8px;top:8px;z-index:6;width:30px;height:30px;border:none;border-radius:8px;background:rgba(8,14,18,.7);border:1px solid rgba(200,168,75,.45);color:#f0dca0;font-size:15px;cursor:pointer;}
.pz-reset:active{transform:scale(.94);}
.pz-reset svg.ic{width:16px;height:16px;vertical-align:-3px;}
/* 3D 지도 마을 명패(다크 유지 — 지형 위 대비) */
.v3-labels{position:absolute;inset:0;z-index:6;pointer-events:none;}
.v3-label{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;text-align:center;
  background:linear-gradient(180deg,rgba(28,22,12,.94),rgba(14,10,5,.96));border:1px solid #a3812f;border-radius:8px;padding:2px 7px;box-shadow:0 3px 8px rgba(0,0,0,.55);}
.v3-label b{display:block;font-size:9.5px;font-weight:800;color:#f2e2ad;}
.v3-label i{font-size:8px;font-style:normal;font-weight:800;color:#3a2a08;background:linear-gradient(180deg,#fbe9a8,#d9ab48);border-radius:5px;padding:0 5px;}
.v3-label.empty{background:rgba(10,8,4,.6);border-style:dashed;border-color:rgba(200,168,75,.5);}
.v3-label .plus{font-size:9px;font-weight:800;color:#e6d29a;}
.v3-label:active{transform:translate(-50%,calc(-100% + 1px));}
/* 마을 3D 건물 명패 — 박스 없이 3D 위에 「아이콘 이름 레벨」이 새겨진 것처럼(외곽선으로 가독성 확보) */
.v3-label.blab{padding:0;background:none;border:0;box-shadow:none;border-radius:0;opacity:1;
  text-shadow:0 1px 0 #120c04, 0 -1px 0 #120c04, 1px 0 0 #120c04, -1px 0 0 #120c04,
              1px 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.65);}
.v3-label.blab b,.v3-label.blab .plus{display:inline-flex;align-items:baseline;gap:0;font-size:8.5px;font-weight:900;color:#fbeec2;}
.v3-label.blab .li{font-size:9.5px;text-shadow:0 1px 2px rgba(0,0,0,.85);}
.v3-label.blab .ln{font-weight:900;font-size:8.5px;white-space:nowrap;margin-left:2px;letter-spacing:-.3px;}
.v3-label.blab i{font-size:8.5px;font-weight:900;margin-left:3px;padding:0;background:none;border:0;
  color:#ffd870;text-shadow:inherit;}
.v3-label.blab.empty{opacity:.62;}
.v3-label.blab.empty .plus{color:#d9c99a;}
.v3-label.blab:hover{opacity:1;z-index:30;}

/* 마을 작업 게이지 — 별도 박스 없이 **건물 이름표 바로 아래**에 얇은 바 + 남은시간만 */
.v3-label.blab .wgm{display:none;margin-top:1px;}
.v3-label.blab .wgr{display:flex;align-items:center;justify-content:center;gap:3px;line-height:1;margin-top:1px;}
.v3-label.blab .wgr i{display:block;width:30px;height:3px;border-radius:2px;overflow:hidden;
  background:rgba(0,0,0,.55);box-shadow:0 0 0 1px rgba(0,0,0,.75);}
.v3-label.blab .wgr i>b{display:block;height:100%;width:0;background:linear-gradient(90deg,#b4cf6a,#eaf6b0);transition:width .4s linear;}
.v3-label.blab .wgr.train i>b{background:linear-gradient(90deg,#f0c86a,#ffe9a8);}
.v3-label.blab .wgr span{font-size:7px;font-weight:900;color:#ffe9a8;letter-spacing:-.2px;}
.vmk3.me b{color:#ffe6a8;} .vmk3.pl b{color:#bcd3ff;} .vmk3.barb{background:rgba(10,8,4,.7);} .vmk3.barb b{color:#d8c79a;font-size:9px;}
.mm3{position:absolute;transform:translate(-50%,-50%);z-index:7;text-align:center;pointer-events:none;}
.mm3 span{font-size:15px;filter:drop-shadow(0 1px 2px #000);display:block;}
.mm3 b{display:block;font-size:8px;font-weight:800;font-family:monospace;color:#f0dca0;background:rgba(10,7,4,.82);border-radius:5px;padding:0 3px;margin-top:-2px;}
.mm3.raid b{color:#ffb0a0;background:rgba(50,10,8,.9);}
/* 마을 3D 씬 */
.scene{position:relative;height:310px;overflow:hidden;border-radius:8px;margin-bottom:8px;border:1px solid #6b4f24;cursor:grab;touch-action:none;
  background:radial-gradient(62% 54% at 50% 46%,#40506a,#1c2230 58%,#0b0e15 100%);box-shadow:inset 0 0 0 2px #54401f,0 3px 12px rgba(70,45,10,.3);}
.scene.grabbing{cursor:grabbing;}
.scene-cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform;z-index:1;}
.scene::after{content:'';position:absolute;inset:0;background:radial-gradient(78% 66% at 50% 48%,transparent 58%,rgba(20,30,20,.32));pointer-events:none;z-index:50;}
.scene .stt{position:absolute;top:10px;left:12px;z-index:56;font-size:15px;font-weight:900;color:#f0dca0;text-shadow:0 2px 5px #000;pointer-events:none;}
.scene .stt small{font-size:10px;color:#ffce8a;margin-left:6px;font-family:monospace;}
.scene-amb{position:absolute;inset:0;z-index:2;pointer-events:none;}
.biome-fx{position:absolute;inset:0;z-index:47;pointer-events:none;overflow:hidden;}
.bp{position:absolute;border-radius:50%;opacity:0;will-change:transform,opacity;}
.bp.sq{border-radius:2px;}
@keyframes bpFall{0%{transform:translateY(-14px) translateX(0) rotate(0);opacity:0}12%{opacity:.9}88%{opacity:.7}100%{transform:translateY(430px) translateX(var(--dx)) rotate(220deg);opacity:0}}
@keyframes bpRise{0%{transform:translateY(0) translateX(0);opacity:0}18%{opacity:.85}100%{transform:translateY(-400px) translateX(var(--dx));opacity:0}}
@keyframes bpDrift{0%{transform:translateX(-40px);opacity:0}20%{opacity:.7}85%{opacity:.6}100%{transform:translateX(470px) translateY(var(--dy));opacity:0}}
.iso-tag{position:absolute;z-index:60;transform:translate(-50%,0);text-align:center;cursor:pointer;}
.iso-tag .ilv{font-size:9px;font-weight:800;color:#3a2a08;background:linear-gradient(180deg,#fbe9a8,#d9ab48);border:1px solid #8a6a24;border-radius:7px;padding:0 7px;}
.iso-tag .inm{display:block;font-size:9px;font-weight:800;color:#f0e2c0;text-shadow:0 1px 2px #000;margin-top:1px;}
.iso-emp{position:absolute;z-index:60;transform:translate(-50%,-50%);font-size:8.5px;font-weight:800;color:#e6d29a;background:rgba(10,8,4,.5);border:1px dashed rgba(200,168,75,.55);border-radius:9px;padding:2px 8px;white-space:nowrap;cursor:pointer;}
/* 모바일 건물 카드 */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.bld{background:#221910;border:1px solid #6b4f24;border-radius:7px;padding:6px 8px;box-shadow:inset 0 1px 0 #241c12;}
.bld.hl{background:#39311d;box-shadow:inset 0 0 0 1px #d8a72c;}
.bld-h{display:flex;align-items:center;gap:6px;}
.bld-ic{font-size:18px;} .bld-nm{font-size:11.5px;font-weight:800;color:#f0e2b8;}
.bld-lv{margin-left:auto;font-size:9px;font-weight:800;color:#3a2a08;background:linear-gradient(135deg,#f4e3a8,#d8b45a);padding:1px 6px;border-radius:7px;border:1px solid #a3812f;}
.bld-eff{font-size:9.5px;color:#8fce8a;margin:4px 0 6px;font-weight:700;min-height:12px;}
.bld-up{width:100%;padding:5px;border:1px solid #a3812f;border-radius:6px;background:linear-gradient(180deg,#f4e3b3,#dfc182);color:#2e1f08;font-size:9px;font-weight:800;cursor:pointer;font-family:inherit;}
.bld-up:disabled{opacity:.45;cursor:default;}
.bld-up.no{opacity:.6;} .bld-up.no{filter:grayscale(.35);}
.bld-open{width:100%;margin-top:5px;padding:5px;border:1px solid #5a7a22;border-radius:6px;background:linear-gradient(180deg,#cfe0a0,#a8c46a);color:#243208;font-size:9px;font-weight:800;cursor:pointer;font-family:inherit;}
/* 모바일 건물 아이콘 그리드(모바일식 — 탭하면 시트) */
.bgrid2{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.bt2{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:2px;padding:4px 3px;background:#221910;border:1px solid #6b4f24;border-radius:9px;cursor:pointer;}
.bt2:active{transform:translateY(1px);}
.bt2 .i{font-size:13px;line-height:1.1;filter:drop-shadow(0 1px 1px rgba(90,60,20,.3));}

.lor{width:300px;aspect-ratio:2/3;border-radius:16px;overflow:hidden;position:relative;background:#0d0b08;
  box-shadow:inset 0 0 0 2px #c9b98a,inset 0 0 0 5px #a3812f,inset 0 0 0 7px #2a2013,inset 0 0 0 10px #c9b98a,0 14px 40px rgba(0,0,0,.7);}
.lor .art{position:absolute;top:10px;left:10px;right:10px;height:60%;border-radius:8px;background-size:cover;background-position:35% 18%;box-shadow:inset 0 -30px 30px #0a0906;}
.lor .nm{position:absolute;top:58%;left:14px;right:14px;text-align:center;font-size:22px;font-weight:900;color:#f2e2ad;text-shadow:0 2px 4px #000;font-family:Georgia,serif;}
.lor .kw{position:absolute;top:66%;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#12243a;}
.lor .kw b{background:#243050;border:1px solid #4a5a86;border-radius:14px;padding:3px 12px;}
.lor .ds{position:absolute;top:73%;left:18px;right:18px;text-align:center;font-size:11.5px;color:#251c11;line-height:1.5;}
.lor .cost{position:absolute;top:8px;left:8px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#a9d4ff,#3b82f6 55%,#1e3a8a);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #f4e3a8;font-size:12px;font-weight:800;color:#fff;flex-direction:column;line-height:1;}
.lor .cost small{font-size:7px;}
.lor .rgn{position:absolute;top:10px;right:10px;font-size:22px;}
.lor .pw,.lor .hp{position:absolute;bottom:6px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);color:#fff;font-weight:900;font-size:18px;}
.lor .pw{left:6px;background:radial-gradient(circle at 40% 32%,#ffcf87,#e07a1e 60%,#8a3d08);}
.lor .hp{right:6px;background:radial-gradient(circle at 40% 32%,#ff9a9a,#d63838 60%,#7a1414);}
.lor .pw small,.lor .hp small{font-size:8px;}
/* 애니메이션 */
.vin{animation:viewIn .35s ease-out;}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ═══ PC 레이아웃(≥900px) — 데스크탑: 상단 메뉴 + 사이드바 + 테이블 ═══ */
@media(min-width:900px){
  .app{max-width:1280px;}
  .tabbar{display:none;}
  .toast{bottom:24px;}
  .topstrip{padding:9px 16px;} .logo{font-size:17px;} .world{font-size:11px;}
  .resbar{gap:10px;padding:9px 16px 7px;} .res em{font-size:15px;} .res i{font-size:15px;} .res{padding:5px 12px;gap:7px;} .res s{font-size:10px;}
  .res{flex:0 1 190px;padding:4px 10px;} .res em{font-size:12.5px;} .res s{font-size:9px;}
  .pcmenu{display:flex;align-items:stretch;gap:2px;padding:0 12px;border-bottom:2px solid #6b4f24;background-image:linear-gradient(180deg,rgba(30,21,10,.70),rgba(14,10,5,.86)),url('assets/alley/floor_stone.png');background-size:auto,110px;background-repeat:repeat;}
  .pcm{position:relative;border:none;background:none;color:#cbb896;font-weight:800;font-size:12.5px;padding:10px 16px;cursor:pointer;font-family:inherit;}
  .pcm:hover{background:rgba(255,230,170,.12);color:#ffe9ad;}
  .pcm.on{background:#17110a;color:#f4e6bd;border-radius:7px 7px 0 0;box-shadow:inset 0 2px 0 #caa24e;}
  .pcm .bdg{top:4px;right:4px;}
  .pcm-sep{flex:1;}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;padding:10px;align-items:start;}
  .sidebar{display:block;position:sticky;top:10px;}
  .map-wrap{height:calc(100vh - 176px);height:calc(100dvh - 176px);min-height:480px;}
  .scene{height:560px;}
  .picker,.picker.atk{max-width:520px;}
  .vi-acts .btn{font-size:13px;}
  .bgrid{grid-template-columns:1fr 1fr 1fr;}
}
@media(max-width:360px){ .res s{display:none;} .world{display:none;} }

function rivalGarrison(size){ return {spear:size*8, sword:size*4, archer:size*3, lcav:size, scout:size}; }
function barbLoot(size){ return {wood:size*180, clay:size*160, iron:size*110}; }
function protectLeft(w){ return (w&&w.protectUntil)? Math.max(0, w.protectUntil-Date.now()) : 0; }
function isProtected(w){ return protectLeft(w)>0; }
function fmtProtect(ms){ const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  return d>0? `${d}일 ${h}시간` : (h>0? `${h}시간 ${m}분` : `${m}분`); }
function allocSpawn(taken, players, R){   // (보존) 플레이어 스폰 분배 — 멀티 도입 시 사용 R=R||Math.random; const HC=Math.floor(HCOLS/2), HR=Math.floor(HROWS/2);
  for(let ring=4; ring<=14; ring++){ for(let t=0;t<80;t++){
    const ang=R()*Math.PI*2;
    const x=Math.round(HC+Math.cos(ang)*ring), y=Math.round(HR+Math.sin(ang)*ring*1.3);
    if(x<1||y<1||x>HCOLS-2||y>HROWS-2) continue;
    if(taken.has(x+','+y)) continue;
    let ok=true; for(const p of players){ if(fieldDist({x,y},p)<4){ ok=false; break; } }
    if(ok) return {x,y};
  } }
  return null;
}
function genWorld(now){
  const R=mkrng(778899); const W={}; now = now || Date.now();
  const HC=Math.floor(HCOLS/2), HR=Math.floor(HROWS/2), home={x:HC,y:HR};
  W[HOME_KEY]={x:HC,y:HR,name:'내 마을',owner:'me',size:6,loot:{wood:0,clay:0,iron:0},garrison:{},foundedAt:now};
  const taken=new Set([HC+','+HR]); let n=0, guard=0;
  // ⚠️ 라이벌 AI 마을/습격은 제거됨(사장님 피드백 — 의미 없는 가짜 라이벌 X) · 추후 실제 팀원 멀티로 설계
  while(n<700 && guard<80000){ guard++;
    const x=Math.floor(R()*HCOLS), y=Math.floor(R()*HROWS); const key=x+','+y;
    if(taken.has(key)) continue; const d=fieldDist({x,y},home); if(d<2.2) continue;
    taken.add(key);
    let size=1+Math.floor(R()*3)+(d>6?Math.floor(R()*3):0); size=Math.max(1,Math.min(6,size));
    W['v'+(n++)]={x,y,name:'야만인 마을',owner:'barb',size,loot:barbLoot(size),garrison:barbGarrison(size),wall:barbWall(size)};

function fresh(){ const now=Date.now(); return { ver:SAVE_VER, villages:{[HOME_KEY]:freshVillage()}, active:HOME_KEY, research:{}, spy:{}, world:genWorld(now), marches:[], reports:[], t:now }; }
function load(){ try{ const j=JSON.parse(localStorage.getItem('rune_proto')); if(j&&j.ver===SAVE_VER&&j.villages&&j.villages[HOME_KEY]&&j.world&&j.world[HOME_KEY]) return j; }catch(e){} return fresh(); }
function save(){ localStorage.setItem('rune_proto', JSON.stringify(S)); }
// 🌫️ 전장의 안개 — 공개된 헥스만 지도에 보임. 정찰/행군/점령으로 점점 밝혀짐(공개는 영구)
function _cubeH(x,y){ const q=x-((y-(y&1))>>1); return {x:q,z:y,y:-q-y}; }
function hexDistXY(ax,ay,bx,by){ const a=_cubeH(ax,ay),b=_cubeH(bx,by); return (Math.abs(a.x-b.x)+Math.abs(a.y-b.y)+Math.abs(a.z-b.z))/2; }
function isRevealed(x,y){ return !!(S.revealed && S.revealed[x+','+y]); }
function revealDisc(cx,cy,rad){ if(!S.revealed) S.revealed={}; let any=false;
  for(let y=Math.max(0,cy-rad-1); y<=Math.min(HROWS-1,cy+rad+1); y++)
    for(let x=Math.max(0,cx-rad-1); x<=Math.min(HCOLS-1,cx+rad+1); x++)
      if(hexDistXY(cx,cy,x,y)<=rad){ const k=x+','+y; if(!S.revealed[k]){ S.revealed[k]=1; any=true; } }
  return any; }
function seedReveal(){ if(!S.revealed) S.revealed={}; if(S._revSeed) return; S._revSeed=1;
  for(const id in S.world){ const w=S.world[id]; if(w.owner==='me') revealDisc(w.x,w.y,REVEAL_HOME); } }
// 행군 중인 부대 주변을 실시간으로 밝힘(안개가 걷히는 연출)
function revealMarchPositions(now){ if(!S.marches||!S.marches.length) return;
  for(const m of S.marches){
    const org=m.mode==='raid'?S.world[m.from]:(m.mode==='return'?S.world[m.to]:S.world[m.fromV||HOME_KEY]);
    const dst=m.mode==='raid'?S.world[m.to]:(m.mode==='return'?S.world[m.fromV||HOME_KEY]:S.world[m.to]);
    if(!org||!dst) continue;
    const sp=m.arriveAt-m.dep, p=sp>0?Math.min(1,Math.max(0,(now-m.dep)/sp)):1;
    revealDisc(Math.round(org.x+(dst.x-org.x)*p), Math.round(org.y+(dst.y-org.y)*p), 1); } }

// ═══════════ 로직 ═══════════
function tick(){
  const now=Date.now(); let dt=(now-S.t)/1000; if(dt<=0){ S.t=now; return; } dt=Math.min(dt, 24*3600);
  for(const id in S.villages) tickVillage(S.villages[id], dt, now);
  for(const id in S.world){ const w=S.world[id];
    if(w.loyalty!=null && w.loyalty<100) w.loyalty=Math.min(100, w.loyalty + dt/3600);   // 👑 충성도 +1/시간(정통 전략식·내 마을 포함)
    if(w.owner==='me') continue;
    const lc=w.size*300, gr=w.size*3;
    ['wood','clay','iron'].forEach(k=>{ w.loot[k]=Math.min(lc,(w.loot[k]||0)+gr*dt/60); });
    // 야만인 마을 성장(전략게임: 야만 마을은 서서히 성장)
    if(w.owner==='barb' && w.size<6 && Math.random()<dt/7200){ w.size++; w.wall=Math.max(w.wall||0, barbWall(w.size)); }
    // 수비대 재생(90분에 완충) — 파밍 후 다시 차오름
    const base = w.owner==='barb'? barbGarrison(w.size) : rivalGarrison(w.size);
    w.garrison=w.garrison||{};
    for(const u in base){ const cur=w.garrison[u]||0; if(cur<base[u]) w.garrison[u]=Math.min(base[u], cur+base[u]*dt/5400); }
  }
  revealMarchPositions(now);   // 🌫️ 행군 부대가 지나는 곳 안개 걷힘
  processMarches(now); processTrades(now); processResearch(now); maybeRaid(now); S.t=now;
}
// 🐴 상인 수송 — 도착 시 입고 후 자동 귀환, 귀환 완료 시 상인 복귀
function processTrades(now){ const A=S.trades||[];
  for(let i=A.length-1;i>=0;i--){ const t=A[i]; if(now<t.arriveAt) continue;
    if(t.back){ A.splice(i,1); continue; }
    const tv=S.villages[t.to];
    if(tv){ const cap=storeCapV(tv); ['wood','clay','iron'].forEach(k=>{ if((t.res[k]||0)>0) tv.res[k]=Math.min(cap,(tv.res[k]||0)+t.res[k]); });
      toast(`${crd(S.world[t.to])} 마을에 자원 도착 · ${resStr(t.res)}`); }
    else { const fv=S.villages[t.from];   // 대상이 더 이상 내 마을이 아님 → 싣고 되돌아옴
      if(fv){ const cap=storeCapV(fv); ['wood','clay','iron'].forEach(k=>{ if((t.res[k]||0)>0) fv.res[k]=Math.min(cap,(fv.res[k]||0)+t.res[k]); }); }
      toast('수송 대상 마을을 잃어 자원이 되돌아왔어요'); }
    const trip=t.arriveAt-t.dep; t.back=true; t.dep=now; t.arriveAt=now+trip; t.res={wood:0,clay:0,iron:0};
    if(S.active===t.from||S.active===t.to) S._dirtyVil=true;
  }
}
// ⚒️ 연구 완료 처리(전 마을 공통·동시 1건)
function processResearch(now){ const q=S.researchQ; if(!q||now<q.doneAt) return;
  S.research[q.u]=Math.min(RES_MAX,(S.research[q.u]||0)+1); S.researchQ=null;
  toast(`${TROOP[q.u].nm} 연구 Lv${S.research[q.u]} 완료 — +${S.research[q.u]*12}%`); S._dirtyVil=true;
}
function tickVillage(v, dt, now){ const cap=storeCapV(v);
  ['wood','clay','iron'].forEach(k=>{ v.res[k]=Math.min(cap,(v.res[k]||0)+prodPerMin(v.blds[k]||0)*dt/60); v.res[k]=Math.floor(v.res[k]*10)/10; });
  while(v.buildQ.length && now>=v.buildQ[0].doneAt){ const q=v.buildQ.shift(); v.blds[q.b]=(v.blds[q.b]||0)+1;
    if(v===S.v){ toast(`${BLD[q.b].nm} Lv${v.blds[q.b]} 완성`); S._dirtyVil=true; }
    if(v.buildQ.length){ const d=buildTimeV(v,v.buildQ[0].b)*1000; v.buildQ[0].doneAt=now+d; v.buildQ[0].dur=d; } }
  while(v.recQ.length && now>=v.recQ[0].doneAt){ const q=v.recQ.shift(); v.troops[q.u]=(v.troops[q.u]||0)+1;
    if(v.recQ.length){ const d=trainTimeV(v,v.recQ[0].u)*1000; v.recQ[0].doneAt=now+d; v.recQ[0].dur=d; } }
}
function hasUnits(u){ for(const k in u){ if(u[k]>0) return true; } return false; }
function armyTotalV(v){ let n=0; for(const u in v.troops) n+=v.troops[u]||0; return n; }
// 🏘️ 마을 발전 단계(건물 레벨 합) — 3D 마을 외형과 연동 (Town3D의 공식과 동일하게 유지할 것)
function vilStage(v){ let p=0; for(const b in v.blds) p+=v.blds[b]||0; return p>=45?3:p>=25?2:p>=10?1:0; }
const STAGE_NM=['개척지','마을','소도시','성곽 도시'];
function snapV(w){ return {name:w.name, x:w.x, y:w.y, owner:w.owner, size:w.size||1}; }
function crd(w){ return `(${w.x}|${w.y}) K${Math.floor(w.y/10)}${Math.floor(w.x/10)}`; }
// ══ 전투 엔진 ══
//  · 공격 병과(보/기/궁) 비율대로 부분 전투 → 병과별 방어(def/defC/defA) 가중 합산
//  · 🍀 운 -25%~+25%(공격자) · 사기(수비 점수/공격 점수 기반, 대 소환사만)
//  · 🧱 성벽 = 기본 방어(20×1.25^) + 방어 배율(1.037^)  · 🐏 파성추 = 전투 중 성벽 약화
//  · 손실 = 승자 (열세/우세)^1.5 비율, 패자 전멸 (정통 전투 공식)
function wallBasicDef(l){ return l>0? Math.round(20*Math.pow(1.25,l-1)) : 0; }
function twBattle(atkUnits, defStacks, opt){ opt=opt||{};
  const luck=(Math.random()*0.5-0.25);
  const A={inf:0,cav:0,arch:0};
  for(const u in atkUnits){ const c=atkUnits[u]||0; if(!c)continue; const t=TROOP[u];
    A[t.cls]+=c*t.atk*(opt.atkResearch?researchBonus(u):1); }
  const total=A.inf+A.cav+A.arch;
  const rams=Math.floor(atkUnits.ram||0); const wall0=opt.wall||0;
  const wallBattle=Math.max(0, wall0-Math.min(wall0, Math.floor(rams/(4+wall0))));
  const D={inf:0,cav:0,arch:0};
  defStacks.forEach(st=>{ for(const u in st){ const c=Math.floor(st[u]||0); if(!c)continue; const t=TROOP[u]; const b=opt.defResearch?researchBonus(u):1;
    D.inf+=c*t.def*b; D.cav+=c*t.defC*b; D.arch+=c*t.defA*b; } });
  const mix = total>0? (D.inf*A.inf+D.cav*A.cav+D.arch*A.arch)/total : D.inf;
  const defPow = mix*Math.pow(1.037,wallBattle) + wallBasicDef(wallBattle);
  const atkPow = total*(1+luck)*(opt.morale||1);
  const win = atkPow>defPow;
  const lossW = defPow<=0&&win ? 0 : Math.pow(Math.min(1, win? defPow/Math.max(1,atkPow) : atkPow/Math.max(1,defPow)), 1.5);
  return {win, luck, atkPow:Math.round(atkPow), defPow:Math.round(defPow),
    atkLossRatio: win? lossW : 1, defLossRatio: win? 1 : lossW, wallBattle};
}
function applyLoss(units, ratio){ const lost={}, left={};
  for(const u in units){ const c=Math.floor(units[u]||0); if(!c)continue;
    const l=Math.min(c, Math.round(c*ratio)); if(l) lost[u]=l; if(c-l>0) left[u]=c-l; }
  return {lost,left}; }
function vilPoints(v){ let p=0; for(const b in v.blds) p+=(v.blds[b]||0)*12; return Math.max(1,p); }
function moraleVs(originV, w){ const atkP=vilPoints(originV), defP=(w.size||1)*150;   // 점수 기반 사기: (수비/공격)×3+0.3, 0.3~1.0
  return Math.max(0.3, Math.min(1, defP/atkP*3 + 0.3)); }
function pushReport(r){ r.at=r.at||Date.now(); S.reports=S.reports||[]; S.reports.unshift(r); S.reports=S.reports.slice(0,30); }
// ══ 명령(집결지) — 공격/지원/정찰 공용 ══
function sendCommand(toId, units, mode){ const v=S.v;
  if((v.blds.rally||0)<1){ toast('집결지가 필요해요 — 마을에서 건설하세요'); return false; }
  for(const u in units){ if((v.troops[u]||0)<(units[u]||0)){ toast('병력이 부족해요'); return false; } }
  if(!hasUnits(units)){ toast('보낼 병력을 선택하세요'); return false; }
  if(mode==='scout'){ for(const u in units){ if(u!=='scout'&&units[u]>0){ toast('정찰은 정찰병만 보낼 수 있어요'); return false; } } }
  let slow=1; for(const u in units){ if(units[u]>0) slow=Math.max(slow,TROOP[u].speed); }
  const from=S.world[S.active], to=S.world[toId]; if(!to||!from) return false;
  const dist=fieldDist(from,to); const travel=Math.max(4000, travelMs(dist,slow));
  for(const u in units) v.troops[u]-=(units[u]||0);
  S.marches.push({fromV:S.active, to:toId, units:{...units}, dep:Date.now(), arriveAt:Date.now()+travel, mode});
  toast(`${MODE_NM[mode]||mode} 출발 — ${to.name} ${crd(to)} · ${dist.toFixed(1)}칸 · ${fmtDur(travel)}`);   // ⚠️ toast=textContent → modeLbl(SVG) 쓰면 마크업이 글자로 찍힘
  save(); return true;
}
function conquerVillage(id, survivors){ const w=S.world[id];
  const gar={...survivors}; if(gar.noble>0){ gar.noble--; if(!gar.noble) delete gar.noble; }
  const s=Math.max(1,w.size||1);
  w.owner='me'; w.name='내 마을'; w.loyalty=25; w.protectUntil=0; w.garrison={}; w.loot={wood:0,clay:0,iron:0};
  const nv=freshVillage(); const b=nv.blds;   // 정통 전략식: 정복한 마을은 개발 상태(건물) 유지 — 크기 기반 근사
  b.main=Math.min(10,Math.max(1,s)); b.wood=b.clay=b.iron=Math.min(15,s+2); b.farm=Math.min(12,s+1); b.storage=Math.min(12,s+1);
  if(w.wall) b.wall=Math.min(20,Math.round(w.wall));
  nv.res={wood:300,clay:300,iron:200}; nv.troops=gar;
  S.villages[id]=nv; revealDisc(w.x,w.y,REVEAL_HOME);   // 🌫️ 정복지=내 마을 시야
  toast(`${crd(w)} 마을을 정복했어요! 새 마을 획득 — 집결지부터 지으세요`); save();
}
function processMarches(now){
  S.marches.sort((a,b)=>b.arriveAt-a.arriveAt);   // 역순 루프가 배열 끝(가장 이른 도착)부터 처리 → 도착 시각 순 보장
  for(let i=S.marches.length-1;i>=0;i--){ const m=S.marches[i]; if(now<m.arriveAt) continue;
    if(m.mode==='raid'){ resolveDefense(m,now); S.marches.splice(i,1); continue; }
    if(m.mode==='attack'){ if(resolveAttack(m,now)) S.marches.splice(i,1); continue; }
    if(m.mode==='scout'){ if(resolveScout(m,now)) S.marches.splice(i,1); continue; }
    if(m.mode==='support'){ const tv=S.villages[m.to];
      if(tv){ tv.support.push({from:m.fromV||HOME_KEY, units:{...m.units}}); toast(`${crd(S.world[m.to])} 마을에 지원군 도착`); S.marches.splice(i,1); }
      else { const trip=m.arriveAt-m.dep; m.mode='return'; m.dep=now; m.arriveAt=now+trip; }   // 대상이 내 마을이 아니게 됨 → 회군
      continue; }
    // return — 출발 마을로 귀환
    const v=S.villages[m.fromV||HOME_KEY]||S.v; for(const u in m.units) v.troops[u]=(v.troops[u]||0)+m.units[u];
    if(m.loot){ const cap=storeCapV(v); ['wood','clay','iron'].forEach(k=>{ v.res[k]=Math.min(cap,(v.res[k]||0)+(m.loot[k]||0)); }); }
    S.marches.splice(i,1);
  }
}
function resolveAttack(m, now){
  const w=S.world[m.to]; if(!w) return true;
  revealDisc(w.x,w.y,REVEAL_HIT);   // 🌫️ 부대 도착 → 주변 공개
  if(w.owner==='me'){ const tv=S.villages[m.to]; if(tv) tv.support.push({from:m.fromV||HOME_KEY, units:{...m.units}}); return true; }   // 이미 함락됨 → 지원 합류
  const originV=S.villages[m.fromV||HOME_KEY]||S.v;
  const morale = w.owner==='player'? moraleVs(originV,w) : 1;
  const defStack={}; for(const u in (w.garrison||{})){ const c=Math.floor(w.garrison[u]||0); if(c) defStack[u]=c; }
  const r=twBattle(m.units,[defStack],{wall:Math.round(w.wall||0), atkResearch:true, morale});
  const aRes=applyLoss(m.units, r.atkLossRatio); const dRes=applyLoss(defStack, r.defLossRatio);
  w.garrison=dRes.left;
  const wall0=Math.round(w.wall||0); let wallTo=wall0;
  if((m.units.ram||0)>0 && wall0>0){ wallTo = r.win? r.wallBattle : wall0-Math.floor((wall0-r.wallBattle)/2); w.wall=wallTo; }   // 🐏 승리=파괴분 확정, 패배=절반
  let loot={wood:0,clay:0,iron:0};
  if(r.win){ let carry=0; for(const u in aRes.left) carry+=aRes.left[u]*TROOP[u].carry;
    const avail=(w.loot.wood||0)+(w.loot.clay||0)+(w.loot.iron||0), take=Math.min(carry,avail);
    ['wood','clay','iron'].forEach(k=>{ const t=avail>0?Math.floor(take*(w.loot[k]||0)/avail):0; loot[k]=t; w.loot[k]=(w.loot[k]||0)-t; }); }
  let cataDmg=0;
  if(r.win && (aRes.left.cata||0)>=2 && (w.size||1)>1){ cataDmg=Math.min((w.size||1)-1, Math.max(1, Math.floor((aRes.left.cata||0)/6))); w.size-=cataDmg; }   // 💥 투석기=마을 발전도 파괴
  let conquered=false; let loyTo=w.loyalty==null?100:w.loyalty;
  if(r.win && (aRes.left.noble||0)>0){ for(let i=0;i<aRes.left.noble;i++) loyTo-=20+Math.random()*15; w.loyalty=loyTo; if(loyTo<=0) conquered=true; }   // 👑 귀족 1명당 충성도 -20~-35
  const annihilated=!hasUnits(aRes.left);
  pushReport({type:'attack', win:r.win, tgt:snapV(w), luck:r.luck, morale, atkPow:r.atkPow, defPow:r.defPow,
    sent:{...m.units}, lost:aRes.lost, defUnits:annihilated?null:defStack, defLost:annihilated?null:dRes.lost,
    loot, wallFrom:wall0, wallTo, cataDmg, loyalty:r.win?Math.max(0,Math.round(loyTo)):null, conquered});
  const lt=(loot.wood+loot.clay+loot.iron)|0;
  if(conquered){ toast(`${w.name} 함락!`); conquerVillage(m.to, aRes.left); return true; }
  toast(r.win? `✅ ${w.name} 약탈 성공! +${NF(lt)} 자원 (📜 보고서)` : `💥 ${w.name} 공격 ${annihilated?'대패 — 전멸':'실패'} (📜 보고서)`);
  if(annihilated) return true;
  const trip=m.arriveAt-m.dep; m.mode='return'; m.units=aRes.left; m.loot=loot; m.dep=now; m.arriveAt=now+trip; return false;
}
// 🧭 정찰 — 정통 전략식: 수비 정찰병×2를 뚫어야 성공, 성공 시 자원·병력·성벽·충성도 정보
function resolveScout(m, now){
  const w=S.world[m.to]; if(!w||w.owner==='me') return true;
  const atkS=m.units.scout||0;
  const defS=Math.floor((w.garrison&&w.garrison.scout)||0);
  const power=defS*2;
  revealDisc(w.x,w.y, atkS>power?REVEAL_SCOUT:REVEAL_HIT);   // 🌫️ 정찰 도착 → 주변 공개(성공 시 더 넓게)
  if(atkS>power){
    const ratio=power>0? Math.pow(power/atkS,1.5) : 0;
    const lost=Math.min(atkS,Math.round(atkS*ratio)); const left=atkS-lost;
    const spy={res:{wood:Math.floor(w.loot&&w.loot.wood||0),clay:Math.floor(w.loot&&w.loot.clay||0),iron:Math.floor(w.loot&&w.loot.iron||0)},
      troops:{}, wall:Math.round(w.wall||0), loyalty:Math.round(w.loyalty==null?100:w.loyalty), size:w.size||1};
    for(const u in (w.garrison||{})){ const c=Math.floor(w.garrison[u]||0); if(c) spy.troops[u]=c; }
    let def=0; for(const u in spy.troops) def+=spy.troops[u]*TROOP[u].def;
    spy.def=Math.round(def*Math.pow(1.037,spy.wall)+wallBasicDef(spy.wall));
    S.spy[m.to]={at:now, ...spy};
    pushReport({type:'scout', win:true, tgt:snapV(w), sent:{scout:atkS}, lost:lost?{scout:lost}:{}, spy});
    toast(`🧭 ${w.name} 정찰 성공${lost?` · 정찰병 -${lost}`:''} (📜 보고서)`);
    if(left>0){ const trip=m.arriveAt-m.dep; m.mode='return'; m.units={scout:left}; m.loot=null; m.dep=now; m.arriveAt=now+trip; return false; }
    return true;
  }
  pushReport({type:'scout', win:false, tgt:snapV(w), sent:{scout:atkS}, lost:{scout:atkS}});
  toast(`${w.name} 정찰 실패 — 적 정찰병에 발각(전멸)`);
  return true;
}
// ⚔️ 피습 방어 — 정통 전략식: 공격자 승리 시 수비 병력 전멸 + 약탈(지하창고 보호) / 방어 성공 시 수비 비례 손실
function resolveDefense(m, now){
  const vid=m.to||HOME_KEY; const v=S.villages[vid]; const w=S.world[vid]; const a=S.world[m.from]; if(!v||!w) return;
  const stacks=[v.troops].concat((v.support||[]).map(s=>s.units));
  const r=twBattle(m.units, stacks, {wall:(v.blds.wall||0), defResearch:true});
  const atkName=a?a.name:'적 소환사';
  const myLost={}; const loot={wood:0,clay:0,iron:0};
  if(r.win){
    stacks.forEach(st=>{ for(const u in st){ const c=Math.floor(st[u]||0); if(c) myLost[u]=(myLost[u]||0)+c; } });
    v.troops={}; v.support=[];
    const aRes=applyLoss(m.units, r.atkLossRatio);
    let carry=0; for(const u in aRes.left) carry+=aRes.left[u]*TROOP[u].carry;
    const hideCap=(v.blds.hide||0)? Math.round(150*Math.pow(1.333,(v.blds.hide||0)-1)) : 0;
    let space=carry;
    ['wood','clay','iron'].forEach(k=>{ const av=Math.max(0,(v.res[k]||0)-hideCap); const t=Math.min(av,space); if(t>0){ v.res[k]-=t; loot[k]=Math.round(t); space-=t; } });
  } else {
    const rt=r.defLossRatio;
    const app=(st)=>{ for(const u in st){ const c=Math.floor(st[u]||0); if(!c){ delete st[u]; continue; }
      const l=Math.min(c,Math.round(c*rt)); st[u]=c-l; if(l) myLost[u]=(myLost[u]||0)+l; if(!st[u]) delete st[u]; } };
    app(v.troops); (v.support||[]).forEach(s=>app(s.units)); v.support=(v.support||[]).filter(s=>hasUnits(s.units));
  }
  const aRes2=applyLoss(m.units, r.win? r.atkLossRatio : 1);
  pushReport({type:'defense', win:!r.win, raid:m.mode==='raid', big:!!m.big, from:{name:atkName, x:a?a.x:0, y:a?a.y:0}, tgt:{name:'내 마을', x:w.x, y:w.y},
    luck:r.luck, atkPow:r.atkPow, defPow:r.defPow, atkUnits:{...m.units}, atkLost:aRes2.lost, myLost, loot});
  const rTag=m.big?'대규모 ':'';
  toast(r.win? `💥 ${rTag}야만인 습격 — ${crd(w)} 마을이 약탈당했어요! (📜 보고서)` : `🛡️ ${rTag}야만인 습격을 막아냈어요! (📜 보고서)`);
}
// ══ 🔥 야만인 습격 — 스폰/난이도 ══
// 발전도 = 습격 규모의 기준. ⚠️방어 건물(성벽·지하창고)은 제외 — 포함하면 "성벽을 올릴수록 습격이 세져서 더 아픈" 역효과가 남.
function villageDev(v){ let s=0; for(const b in v.blds){ if(b==='wall'||b==='hide') continue; s+=(v.blds[b]||0); } return s; }
// ⚠️ 습격 규모는 **병력만** 기준으로 잡는다(성벽 제외). 성벽까지 포함하면 성벽을 올릴수록 습격도 세져서
//    방어 투자가 상쇄돼 버림 → 성벽·지하창고가 순수 이득이 되도록 의도적으로 뺌.
function villageTroopPow(v){
  let d=0; const stacks=[v.troops].concat((v.support||[]).map(s=>s.units));
  stacks.forEach(st=>{ for(const u in st){ const c=Math.floor(st[u]||0); if(c) d+=c*TROOP[u].def*researchBonus(u); } });
  return d;
}
function raidRatio(dev){ const t=Math.max(0,Math.min(1,(dev-RAID_DEV_MIN)/RAID_RAMP_DEV)); return RAID_RATIO_MIN+(RAID_RATIO_MAX-RAID_RATIO_MIN)*t; }
function raidIntervalMs(dev){ return Math.max(RAID_INT_MIN, Math.round(RAID_INT_BASE*Math.pow(0.986, Math.max(0,dev-RAID_DEV_MIN)))); }
function raidUnitsFor(pow){   // 도끼병 위주 + 창병 — 기병·공성 없음(성벽 파괴·정복 불가)
  const u={axe:Math.max(1,Math.round(pow*0.72/TROOP.axe.atk))};
  const sp=Math.round(pow*0.28/TROOP.spear.atk); if(sp>0) u.spear=sp; return u;
}
function nearestBarb(w){ let best=null,bd=Infinity;
  for(const id in S.world){ const o=S.world[id]; if(o.owner!=='barb') continue;
    const d=fieldDist(w,o); if(d<bd){ bd=d; best=id; } }
  return best;
}
function spawnRaid(vid, now, immediate){
  const v=S.villages[vid], w=S.world[vid]; if(!v||!w) return;
  const big=Math.random()<RAID_BIG_CHANCE, dev=villageDev(v);
  let pow=Math.max(raidFloor(dev), villageTroopPow(v)*raidRatio(dev));
  pow*=(0.85+Math.random()*0.3); if(big) pow*=RAID_BIG_MULT;
  const from=nearestBarb(w)||vid;
  const travel=Math.max(RAID_WARN_MIN, travelMs(fieldDist(S.world[from],w), TROOP.axe.speed));
  const m={from, to:vid, units:raidUnitsFor(pow), mode:'raid', big, dep:now, arriveAt:now+travel};
  if(immediate){ m.dep=now-travel; m.arriveAt=now; resolveDefense(m, now); return; }
  S.marches.push(m);
  toast(`${big?'대규모 ':''}야만인 습격대가 ${crd(w)}로 몰려와요 — ${fmtDur(travel)} 후 도착`);
}
function maybeRaid(now){
  for(const vid in S.villages){ const v=S.villages[vid], w=S.world[vid];
    if(!w||w.owner!=='me') continue;
    const dev=villageDev(v);
    if(dev<RAID_DEV_MIN || !v.nextRaid){ v.nextRaid=now+raidIntervalMs(dev); continue; }   // 초반 구간·최초 진입은 타이머만 예약
    if(now<v.nextRaid) continue;
    let due=0; while(v.nextRaid<=now && due<50){ due++; v.nextRaid+=raidIntervalMs(dev); }
    for(let i=0;i<Math.min(due-1, RAID_OFFLINE_MAX);i++) spawnRaid(vid, now, true);          // 오프라인 밀린 분(제한적으로 즉시 정산)
    if((S.marches||[]).some(m=>m.mode==='raid'&&m.to===vid)) continue;                       // 이미 오는 중이면 중복 스폰 안 함
    spawnRaid(vid, now, false);
  }
}

function drawGrid(){

  const R=mkrng(424242);

  for(let i=0;i<=HROWS;i++){ const p=i*F+.5; g.beginPath(); g.moveTo(0,p); g.lineTo(pw,p); g.stroke(); }
  g.strokeStyle='rgba(202,168,75,.42)'; g.lineWidth=2;

  for(let i=0;i<=HROWS;i+=10){ g.beginPath(); g.moveTo(0,i*F); g.lineTo(pw,i*F); g.stroke(); }

// 팬/줌(2D 폴백 전용)
function attachPanZoom(wrap, content, opt){
  opt=opt||{}; const MAX=opt.max||3.6, DBL=opt.dbl||2.4;
  let sc=1,tx=0,ty=0,initSc=1; const pts=new Map(); let lastDist=0,downXY=null,panned=false,lastTap=0;
  const vw=()=>wrap.clientWidth||1, vh=()=>wrap.clientHeight||1;
  const cw0=()=>content.offsetWidth||vw(), ch0=()=>content.offsetHeight||vh();
  const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), M=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  function fitScale(){ return Math.min(vw()/cw0(), vh()/ch0()); }
  function coverScale(){ return Math.max(vw()/cw0(), vh()/ch0()); }
  function clamp(){ const MIN = opt.minScale!=null ? opt.minScale : Math.min(fitScale(),1);
    const MAXs = opt.maxScale!=null ? opt.maxScale : MAX*coverScale();
    sc=Math.max(MIN,Math.min(MAXs,sc));
    const cw=cw0()*sc, ch=ch0()*sc;
    tx = cw<=vw() ? (vw()-cw)/2 : Math.min(0,Math.max(vw()-cw,tx));
    ty = ch<=vh() ? (vh()-ch)/2 : Math.min(0,Math.max(vh()-ch,ty)); }
  function apply(){ clamp(); content.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${sc.toFixed(3)})`; if(opt.onZoom) opt.onZoom(sc); }
  function zoomAt(cx,cy,ns){ const px=(cx-tx)/sc, py=(cy-ty)/sc; sc=ns; clamp(); tx=cx-px*sc; ty=cy-py*sc; apply(); }
  function center(){ tx=(vw()-cw0()*sc)/2; ty=(vh()-ch0()*sc)/2; apply(); }
  wrap.addEventListener('wheel',e=>{ e.preventDefault(); const r=wrap.getBoundingClientRect();
    let dy=e.deltaY; if(e.deltaMode===1) dy*=16; else if(e.deltaMode===2) dy*=400; dy=Math.max(-120,Math.min(120,dy));
    zoomAt(e.clientX-r.left,e.clientY-r.top, sc*Math.exp(-dy*0.0008)); },{passive:false});
  wrap.addEventListener('pointerdown',e=>{ wrap.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); panned=false;
    if(pts.size===1) downXY={x:e.clientX,y:e.clientY};
    else if(pts.size===2){ const a=[...pts.values()]; lastDist=D(a[0],a[1]); }
    wrap.classList.add('grabbing'); });
  wrap.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId))return; const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const r=wrap.getBoundingClientRect();
    if(pts.size>=2){ const a=[...pts.values()]; const d=D(a[0],a[1]),m=M(a[0],a[1]); if(lastDist>0) zoomAt(m.x-r.left,m.y-r.top, sc*(d/lastDist)); lastDist=d; panned=true; }
    else if(pts.size===1 && downXY){ tx+=e.clientX-prev.x; ty+=e.clientY-prev.y; apply(); if(Math.abs(e.clientX-downXY.x)+Math.abs(e.clientY-downXY.y)>6) panned=true; } });
  function up(e){ pts.delete(e.pointerId); if(pts.size<2) lastDist=0;
    if(pts.size===0){ wrap.classList.remove('grabbing');
      if(panned){ wrap._panned=true; setTimeout(()=>{wrap._panned=false;},60); }
      else if(downXY){ const r=wrap.getBoundingClientRect(); const lx=downXY.x-r.left, ly=downXY.y-r.top;
        if(opt.onTap && opt.onTap((lx-tx)/sc,(ly-ty)/sc)){ lastTap=0; }
        else { const now=Date.now(); if(now-lastTap<300){ zoomAt(lx,ly, sc>initSc*1.25?initSc:initSc*DBL); lastTap=0; } else lastTap=now; } } } }
  wrap.addEventListener('pointerup',up); wrap.addEventListener('pointercancel',up);
  function init(){ initSc = opt.initScale!=null ? opt.initScale : (opt.fill ? coverScale() : Math.min(fitScale(),1)); sc=initSc;
    if(opt.focus){ tx=vw()/2 - opt.focus.fx*cw0()*sc; ty=vh()/2 - opt.focus.fy*ch0()*sc; apply(); } else center(); }
  window.addEventListener('resize',()=>{ const wasInit=Math.abs(sc-initSc)<0.01; init(); if(!wasInit){ sc=Math.min(sc,MAX*coverScale()); apply(); } });
  wrap._panzoom={ reset:()=>{ init(); }, apply, init };
  init(); return wrap._panzoom;
}

        : mode==='support'? `${I('shield')} 지원 병력 <b>${es.n}</b>명`
        : `${I('barracks')} 공격력 <b>${NF(es.atk)}</b>${w.owner==='player'?` · 사기 ${Math.round(moraleVs(v,w)*100)}%`:''} · 운 ±25%`}
        · ${es.travel?('행군 '+fmtDur(es.travel)):'—'}</div>
      <button class="btn ${mode==='attack'?'btn-red':(mode==='scout'?'btn-blue':'btn-green')} atk-go" ${rows.length?'':'disabled'}
        style="width:100%;padding:12px;margin-top:8px;font-size:14px">${modeLbl(mode)} 출발</button>
    </div>`;
    ov.querySelectorAll('.atab').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; sel={}; draw(); });
    ov.querySelectorAll('.atk-step button').forEach(bn=>bn.onclick=()=>{ const u=bn.dataset.u,d=bn.dataset.d;
      if(d==='max') sel[u]=v.troops[u]||0; else sel[u]=Math.max(0,Math.min(v.troops[u]||0,(sel[u]||0)+(+d))); draw(); });
    const go2=ov.querySelector('.atk-go'); if(go2&&rows.length) go2.onclick=()=>{
      const doSend=()=>{ if(sendCommand(id,sel,mode)){ ov.remove(); if(view==='map')renderMap(); if(view==='village')updateVillageDynamic(); renderTop(); renderSidebar(); } };
      if(mode==='attack' && isProtected(S.world[HOME_KEY])) confirmRelease(doSend); else doSend();
    };
  }
  draw(); document.body.appendChild(ov);
}

// 건물 효과 — ⚠️lv 인자 기준으로만 계산할 것(다음 레벨 미리보기가 같은 함수를 씀)
function bldEffTxt(b,lv){ const d=BLD[b];
  if(d.res) return `${RES[d.res]} +${prodPerMin(lv)}/분`;
  if(b==='farm') return `${I('pop')} 인구 ${NF(popCapAt(lv))}`;
  if(b==='storage') return `${I('storage')} 저장 ${NF(storeCapAt(lv))}`;
  if(b==='wall') return `${I('shield')} 방어 ×${Math.pow(1.037,lv).toFixed(2)} +${wallBasicDef(lv)}`;
  if(b==='main') return lv>1? `건설 ${Math.round((lv-1)*3.3)}% 단축` : `건설 속도`;
  if(b==='rally') return lv?`${I('rally')} 부대 지휘 가능`:`${I('rally')} 공격·지원·정찰에 필요!`;
  if(b==='barracks') return lv>1?`${I('sword')} 보병 훈련 ${Math.round((lv-1)*2)}% 단축`:`${I('sword')} 보병 훈련`;
  if(b==='stable') return lv>1?`${I('stable')} 기병 훈련 ${Math.round((lv-1)*2)}% 단축`:`${I('stable')} 기병 훈련`;
  if(b==='workshop') return lv>1?`${I('workshop')} 공성 병기 ${Math.round((lv-1)*2)}% 단축`:`${I('workshop')} 공성 병기`;
  if(b==='smithy'){ if(!lv) return `${I('smithy')} 성능 연구`;
    const un=RES_SMITHY_REQ.filter(r=>lv>=r).length;
    return un? `${I('smithy')} 연구 상한 Lv${un}/${RES_MAX}` : `${I('smithy')} 대장간 ${RES_SMITHY_REQ[0]}에서 연구 해금`; }
  if(b==='academy') return lv?`${I('noble')} 귀족 훈련 가능`:`${I('noble')} 귀족 훈련(마을 정복)`;
  if(b==='market') return lv?`${I('cart')} 상인 ${lv}명 · 교환 ${NF(lv*200)}`:`${I('market')} 자원 거래`;
  if(b==='hide') return `${I('hide')} 약탈 보호 ${NF(hideCapAt(lv))}`;
  return d.desc||'';
}
// 다음 레벨 미리보기 — 값이 실제로 바뀌는 건물만 「현재 → 다음」
function bldNextTxt(b,lv){ const d=BLD[b]; if(lv>=d.max) return '';
  const nx=bldEffTxt(b,lv+1); if(!nx||nx===bldEffTxt(b,lv)) return '';
  return nx;
}
// 🔥 습격 대비 상태 — 난이도를 숨기지 않고 "안전선"을 그대로 보여준다(자동 이벤트라 예측 가능해야 함)
function raidStatusHtml(v, now){
  const dev=villageDev(v), wl=v.blds.wall||0;
  if(dev<RAID_DEV_MIN) return `<div class="raid-st calm">${I('fire')} 야만인 습격 — 마을이 더 크면 시작돼요 <b>발전도 ${dev}/${RAID_DEV_MIN}</b></div>`;
  const inc=(S.marches||[]).find(m=>m.mode==='raid'&&m.to===S.active);
  const defNow=Math.round(villageTroopPow(v)*Math.pow(1.037,wl)+wallBasicDef(wl));
  const breach=Math.round(raidFloor(dev)*1.25);                 // 이 아래면 습격이 뚫려 약탈당함
  // 권장선 = 습격 규모가 '하한'에서 '내 병력 비례'로 넘어가는 교차점. 이 위부터 손실률이 ~10%로 안정된다.
  const rec=Math.round(raidFloor(dev)/raidRatio(dev));
  const lv = defNow<breach? 'danger' : (defNow<rec? 'warn' : 'ok');
  const perSpear=TROOP.spear.def*Math.pow(1.037,wl);
  const need=Math.max(0, Math.ceil((rec-defNow)/perSpear));
  const eta=inc? `<b class="hot">도착 ${fmtDur(inc.arriveAt-now)}</b>` : (v.nextRaid? `다음 <b>${fmtDur(Math.max(0,v.nextRaid-now))}</b>` : '');
  const head = inc? `${inc.big?'대규모 ':''}야만인 습격대 접근 중`
    : lv==='danger'? '야만인 습격 · <b class="hot">약탈 위험</b>'
    : lv==='warn'? '야만인 습격 · 막지만 손실 큼' : '야만인 습격 · 대비됨';
  return `<div class="raid-st ${inc?'inc':lv}">
    <span>${I('fire')} ${head}</span>
    <span class="rs-mid">${I('shield')} 방어 <b>${NF(defNow)}</b> / 권장 ${NF(rec)}${need?` · 창병 <b>+${need}</b>`:''}</span>
    <span class="rs-eta">${eta}</span></div>`;
}
function updateVillageDynamic(){

  let q='';
  // 🏗️ 건설·훈련 진행바는 마을 3D의 건물 이름표 아래에 붙는다(중복 제거).
  //    여기엔 3D로 못 보여주는 것 — 완료 예정 시각과 대기열 — 만 한 줄로 남긴다.

    let totalMs=h.doneAt-now; for(let i=1;i<v.buildQ.length;i++) totalMs+=buildTimeV(v,v.buildQ[i].b)*1000;

  if(v.recQ.length){ const h=v.recQ[0];
    let totalMs=h.doneAt-now; for(let i=1;i<v.recQ.length;i++) totalMs+=trainTimeV(v,v.recQ[i].u)*1000;
    const cnt={}; v.recQ.forEach(x=>cnt[x.u]=(cnt[x.u]||0)+1);

      <b>${fmtDur(rem)}</b><div class="qbar"><div style="width:${pct.toFixed(0)}%"></div></div></div>`; }
  (S.trades||[]).filter(t=>t.from===S.active||t.to===S.active).forEach(t=>{
    const rem=Math.max(0,t.arriveAt-now), tot=Math.max(1,t.arriveAt-t.dep);
    const pct=Math.max(0,Math.min(100,(1-rem/tot)*100)); const w=S.world[t.back?t.from:t.to];
    q+=`<div class="q-row ship">${I('cart')} <b>${t.back?'상인 귀환':(t.from===S.active?'자원 수송':'자원 도착 예정')}</b>
      <span class="qmeta">${w?crd(w):'?'} · ${t.back?`상인 ${t.n}명`:resStr(t.res)}</span>
      <b>${fmtDur(rem)}</b><div class="qbar"><div style="width:${pct.toFixed(0)}%"></div></div></div>`; });
  const qe=document.getElementById('vil-queues'); if(qe) qe.innerHTML=q;
  const be=document.getElementById('vil-blds');
  if(be){
    const rows=Object.keys(BLD).map(b=>{ const d=BLD[b]; const lv=v.blds[b]||0; const qd=v.buildQ.filter(x=>x.b===b).length; const eff=lv+qd; const maxed=eff>=d.max;
      const c=bcost(b,eff+1); const met=reqMet(b); const aff=canAffordV(c);
      const reqTxt=d.req? Object.keys(d.req).map(k=>BLD[k].nm+d.req[k]).join('·') : '';
      const hl=(b==='rally'&&lv<1&&met);
      return {b,d,lv,qd,maxed,c,met,aff,reqTxt,hl,ef:bldEffTxt(b,lv),nx:bldNextTxt(b,eff),tS:fmtSec(buildTime(b,eff+1))}; });
    if(pc){
      be.innerHTML=`<table class="twt"><tr><th style="text-align:left">건물</th><th>Lv</th><th style="text-align:left">효과</th><th>${I('wood')}</th><th>${I('clay')}</th><th>${I('iron')}</th><th>${I('time')}</th><th></th></tr>`+
        rows.map(r=>`<tr class="${r.hl?'hl':''}"><td>${I(r.d.ic)} <b>${r.d.nm}</b>${(r.b==='market'&&r.lv>=1)?` <button class="btn sm" onclick="openMarket()">열기</button>`:(r.b==='smithy'&&r.lv>=1)?` <button class="btn sm" onclick="openSmithy()">열기</button>`:''}</td>

          <td style="text-align:center">${r.maxed||!r.met?'':`<button class="btn sm ${r.aff?'':'no'}" onclick="build('${r.b}')">${r.lv?'업글':'건설'}</button>`}</td></tr>`).join('')+`</table>`;
    } else {
      // 📱 모바일식: 아이콘 그리드 — 탭하면 그 건물 시트(업글·훈련)가 떠서 스크롤 왕복 없음

    }
  }
  renderRecruit('vil-barracks','barracks',UNIT_GROUPS.barracks,pc);

  const ae=document.getElementById('vil-army'); if(ae){ const ks=Object.keys(TROOP).filter(u=>(v.troops[u]||0)>0);

    (v.support||[]).forEach((sp,ix)=>{ const fw=S.world[sp.from];
      h+=`<div class="rl-mrow support" style="margin-top:6px"><span>${I('shield')} 지원군 <b>${fw?crd(fw):'?'}</b></span><span class="rl-units">${Object.keys(sp.units).filter(u=>sp.units[u]>0).map(u=>I(TROOP[u].ic)+NF(sp.units[u])).join(' ')}</span><button class="btn sm" onclick="recallSupport('${S.active}',${ix})">회수</button></div>`; });
    ae.innerHTML=h; }
  const me=document.getElementById('vil-marches'); if(me){
    const ms=(S.marches||[]).filter(m=> m.mode==='raid'? m.to===S.active : (m.fromV||HOME_KEY)===S.active);

      : ms.map(m=>{ const w2=S.world[m.to]; const inc=m.mode==='raid';

window.build=function(b){ const v=S.v; const d=BLD[b]; const eff=(v.blds[b]||0)+v.buildQ.filter(x=>x.b===b).length; if(eff>=d.max){ toast('최대 레벨'); return; }
  if(!reqMet(b)){ toast('선행 건물이 필요해요'); return; } const c=bcost(b,eff+1); if(!payV(c)){ toast('자원 부족 · '+costStr(c)); return; }
  const now=Date.now(); const wasEmpty=v.buildQ.length===0; v.buildQ.push({b, doneAt:0});
  if(wasEmpty){ const d=buildTime(b,(v.blds[b]||0)+1)*1000; v.buildQ[0].doneAt=now+d; v.buildQ[0].dur=d; }
  save(); updateVillageDynamic(); renderTop(); renderSidebar(); };
window.recruit=function(u,n){ n=n||1; const v=S.v; const t=TROOP[u];
  if((v.blds[t.from]||0)<1){ toast(jo(BLD[t.from].nm,'이')+' 필요해요'); return; }
  let done=0;
  for(let i=0;i<n;i++){
    if(popUsed()+t.pop>popCap()){ if(!done) toast('인구(농장)가 부족해요 · 농장을 올리세요'); break; }
    if(!payV(t.cost)){ if(!done) toast('자원 부족 · '+costStr(t.cost)); break; }
    const wasEmpty=v.recQ.length===0; v.recQ.push({u,doneAt:0});
    if(wasEmpty){ const d=trainTime(u)*1000; v.recQ[0].doneAt=Date.now()+d; v.recQ[0].dur=d; } done++;
  }
  if(done){ save(); updateVillageDynamic(); renderTop(); renderSidebar(); }
};

// ⚖️ 시장 — 자원 교환(수수료 10%, 레벨당 200 용량)
window.openMarket=function(){ const v=S.v; const lv=v.blds.market||0; if(lv<1){ toast('시장이 필요해요 — 마을에서 건설'); return; }
  const vid=S.active;
  let tab='trade';                                  // trade=교환 · ship=수송
  let give='wood', get='clay'; const cap=()=>lv*200;
  let amt=Math.min(cap(), Math.floor(v.res[give]||0));
  let dest=null, load={wood:0,clay:0,iron:0};       // 수송 대상·적재량
  const ov=document.createElement('div'); ov.className='ov'; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  const pill=(k,cur,role)=>`<button class="mk-res ${cur===k?'on':''}" data-role="${role}" data-k="${k}">${I(RES[k],'r-'+k)} ${NF(v.res[k])}</button>`;

  function tradeBody(){ const got=Math.floor(amt*0.9);
    return `<div class="mk-lbl">내놓기</div><div class="mk-row">${['wood','clay','iron'].map(k=>pill(k,give,'give')).join('')}</div>
      <div class="mk-lbl">받기 <span style="color:#9a8a60">(수수료 10%)</span></div><div class="mk-row">${['wood','clay','iron'].map(k=>pill(k,get,'get')).join('')}</div>
      <div class="mk-amt"><button data-a="-">－</button><b>${RES[give]} ${NF(amt)}</b><button data-a="+">＋</button><button data-a="max" class="mx">최대</button></div>
      <div class="mk-eq">${RES[give]} ${NF(amt)} → ${RES[get]} <b style="color:#2e6b28">${NF(got)}</b></div>
      <button class="btn btn-green" style="width:100%;padding:11px;margin-top:8px" ${(amt>0&&give!==get)?'':'disabled'} data-a="go">교환</button>`; }

  function shipBody(){
    const owned=ownedIds().filter(id=>id!==vid);
    const free=merchFree(vid), total=merchTotal(v);
    const mine=(S.trades||[]).filter(t=>t.from===vid||t.to===vid);
    const listH = mine.length? `<div class="mk-lbl" style="margin-top:10px">진행 중 수송</div>`+mine.map(t=>{
        const w=S.world[t.back?t.from:t.to], out=(t.from===vid&&!t.back);
        return `<div class="mk-trow"><span>${t.back?I('back')+' 귀환':(out?I('cart')+' 보냄':I('cart')+' 받는 중')} <b>${w?crd(w):'?'}</b></span>
          <span class="mk-tres">${t.back?`상인 ${t.n}`:resStr(t.res)}</span><b>${fmtDur(t.arriveAt-Date.now())}</b></div>`; }).join('') : '';
    if(!owned.length) return `<div class="mk-empty">수송할 다른 마을이 없어요.<br><b>${I('noble')} 귀족으로 마을을 정복</b>하면 마을끼리 자원을 옮길 수 있어요.</div>
      <div class="mk-eq" style="margin-top:8px">${I('cart')} 상인 <b>${free}/${total}</b> · 시장 레벨당 1명</div>${listH}`;
    if(!dest||!S.villages[dest]) dest=owned[0];
    const from=S.world[vid], to=S.world[dest];
    const dist=fieldDist(from,to), travel=Math.max(4000, travelMs(dist,MERCH_SPEED));
    const tot=resSum(load), need=Math.ceil(tot/MERCH_CAP), ok=tot>0&&need<=free;
    return `<div class="mk-lbl">받을 마을</div>
      <div class="mk-row">${owned.map(id=>`<button class="mk-res ${id===dest?'on':''}" data-dest="${id}">${I('main')} ${S.world[id].x}|${S.world[id].y}</button>`).join('')}</div>
      <div class="mk-lbl" style="margin-top:8px">실을 자원 <span style="color:#9a8a60">(상인 1명당 ${NF(MERCH_CAP)})</span></div>
      ${['wood','clay','iron'].map(k=>`<div class="mk-lrow"><span class="mk-lk">${I(RES[k],'r-'+k)} ${RES_NM[k]}</span>
        <button data-l="-" data-k="${k}">－</button><b>${NF(load[k])}</b><button data-l="+" data-k="${k}">＋</button>
        <button class="mx" data-l="max" data-k="${k}">최대</button></div>`).join('')}
      <div class="mk-eq">${I('cart')} 상인 필요 <b style="color:${need>free?'#e08a6a':'#8fce8a'}">${need}</b> · 가용 ${free}명<br><small style="color:#9a8a60;font-weight:700">거리 ${dist.toFixed(1)}칸 · 편도 ${fmtDur(travel)} · 왕복 ${fmtDur(travel*2)}</small></div>
      <button class="btn btn-green" style="width:100%;padding:11px;margin-top:8px" ${ok?'':'disabled'} data-a="send">${tot>0&&need>free?`상인 부족 (${need}명 필요)`:'수송 보내기'}</button>${listH}`; }

  function draw(){ amt=Math.max(0,Math.min(amt, cap(), Math.floor(v.res[give]||0)));
    ['wood','clay','iron'].forEach(k=>{ load[k]=Math.max(0,Math.min(load[k], Math.floor(v.res[k]||0))); });
    ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span><div class="picker" style="max-width:360px">
      <h3 class="pick-h">${I('market')} 시장 <small>Lv${lv} · ${I('cart')} 상인 ${merchFree(vid)}/${merchTotal(v)}</small></h3>
      <div class="mk-tabs"><button class="${tab==='trade'?'on':''}" data-tab="trade">교환</button><button class="${tab==='ship'?'on':''}" data-tab="ship">${I('cart')} 수송</button></div>
      ${tab==='trade'? tradeBody() : shipBody()}</div>`;
    ov.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; draw(); });
    ov.querySelectorAll('.mk-res[data-role]').forEach(b=>b.onclick=()=>{ if(b.dataset.role==='give'){ give=b.dataset.k; amt=Math.min(cap(),Math.floor(v.res[give]||0)); } else get=b.dataset.k; draw(); });
    ov.querySelectorAll('[data-dest]').forEach(b=>b.onclick=()=>{ dest=b.dataset.dest; draw(); });
    ov.querySelectorAll('.mk-amt button, [data-a="go"]').forEach(b=>b.onclick=()=>{ const a=b.dataset.a;
      if(a==='-') amt=Math.max(0,amt-Math.max(10,Math.round(cap()/10)));
      else if(a==='+') amt+=Math.max(10,Math.round(cap()/10));
      else if(a==='max') amt=Math.min(cap(),Math.floor(v.res[give]||0));
      else if(a==='go'){ if(give===get){ toast('다른 자원을 고르세요'); return; } if(amt<=0||(v.res[give]||0)<amt){ toast('자원 부족'); return; }
        v.res[give]-=amt; const cp=storeCapV(v); v.res[get]=Math.min(cp,(v.res[get]||0)+Math.floor(amt*0.9)); save(); renderTop(); toast(`${RES[give]}${NF(amt)} → ${RES[get]}${NF(Math.floor(amt*0.9))} 교환`); amt=Math.min(cap(),Math.floor(v.res[give]||0)); }
      draw(); });
    ov.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k, st=100;
      if(b.dataset.l==='-') load[k]=Math.max(0,load[k]-st);
      else if(b.dataset.l==='+') load[k]+=st;
      else load[k]=Math.floor(v.res[k]||0);
      draw(); });
    const sendB=ov.querySelector('[data-a="send"]'); if(sendB) sendB.onclick=()=>{
      const tot=resSum(load), need=Math.ceil(tot/MERCH_CAP);
      if(tot<=0){ toast('실을 자원을 고르세요'); return; }
      if(need>merchFree(vid)){ toast(`상인이 부족해요 — ${need}명 필요`); return; }
      for(const k in load){ if((v.res[k]||0)<load[k]){ toast('자원 부족'); return; } }
      const to=S.world[dest]; const travel=Math.max(4000, travelMs(fieldDist(S.world[vid],to), MERCH_SPEED));
      for(const k in load) v.res[k]-=load[k];
      S.trades.push({from:vid, to:dest, res:{...load}, n:need, dep:Date.now(), arriveAt:Date.now()+travel, back:false});
      toast(`${crd(to)}로 수송 출발 — ${resStr(load)} · ${fmtDur(travel)}`);
      load={wood:0,clay:0,iron:0}; save(); renderTop(); if(view==='village') updateVillageDynamic(); draw(); };
  }
  draw(); document.body.appendChild(ov);
};

window.openSmithy=function(){ const v=S.v; const sm=v.blds.smithy||0; if(sm<1){ toast('대장간이 필요해요 — 마을에서 건설'); return; }
  const ov=document.createElement('div'); ov.className='ov'; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  let timer=null;
  const stop=()=>{ if(timer){ clearInterval(timer); timer=null; } };
  new MutationObserver((m,o)=>{ if(!document.body.contains(ov)){ stop(); o.disconnect(); } }).observe(document.body,{childList:true});
  function draw(){ const units=Object.keys(TROOP).filter(u=>(v.blds[TROOP[u].from]||0)>=1 && !TROOP[u].noble);
    const q=S.researchQ;
    const qH = q? (()=>{ const rem=Math.max(0,q.doneAt-Date.now()), tot=q.dur||rem, pct=Math.max(0,Math.min(100,(1-rem/Math.max(1,tot))*100));
      return `<div class="q-row" style="margin:2px 0 10px">${I('smithy')} <b>${TROOP[q.u].nm}</b> Lv${q.lvl+1} 연구 중
        <span class="qmeta">완료 ${fmtClock(q.doneAt)}</span><b>${fmtDur(rem)}</b>
        <div class="qbar"><div style="width:${pct.toFixed(0)}%"></div></div></div>`; })() : '';
    ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span><div class="picker" style="max-width:390px">
      <h3 class="pick-h">${I('smithy')} 대장간 연구 <small>Lv${sm} · 병력 ${I('sword')}${I('shield')} +12%/레벨</small></h3>${qH}
      ${units.length? units.map(u=>{ const t=TROOP[u], lvl=(S.research[u]||0), maxed=lvl>=RES_MAX;
        const req=resSmithyReq(lvl), gated=!maxed&&sm<req, c=maxed?null:resCost(u,lvl);
        const aff=c&&canAffordV(c), busy=!!q, secs=resTime(lvl,sm);
        const btn = maxed? `<button class="sm-btn" disabled>최대</button>`
          : gated? `<button class="sm-btn" disabled>대장간 ${req} 필요</button>`
          : busy? `<button class="sm-btn" disabled>연구 중</button>`
          : `<button class="sm-btn ${aff?'':'no'}" data-u="${u}">Lv${lvl+1} · ${costStr(c)} · ${I('time')}${fmtSec(secs)}</button>`;
        return `<div class="sm-row"><div class="sm-l"><span class="u-ic">${I(t.ic)}</span><b>${t.nm}</b> <span class="sm-lv">Lv${lvl}/${RES_MAX}</span>
            <div class="sm-b">${I('sword')}${Math.round(t.atk*(1+lvl*0.12))} ${I('shield')}${Math.round(t.def*(1+lvl*0.12))}${maxed?'':` <span style="color:#9a8a60">→ ${I('sword')}${Math.round(t.atk*(1+(lvl+1)*0.12))} ${I('shield')}${Math.round(t.def*(1+(lvl+1)*0.12))}</span>`}</div></div>
          ${btn}</div>`; }).join('')
        : '<div class="muted" style="margin:10px 0">연구할 병종이 없어요</div>'}
      <div class="mk-empty" style="margin-top:8px">연구는 <b>전 마을 공통</b>이고 한 번에 하나만 진행돼요 · 대장간을 올릴수록 상한 해금(Lv1→${RES_SMITHY_REQ[0]}·Lv2→${RES_SMITHY_REQ[1]}·Lv3→${RES_SMITHY_REQ[2]})되고 연구가 빨라져요</div>
    </div>`;
    ov.querySelectorAll('.sm-btn[data-u]').forEach(b=>b.onclick=()=>{ const u=b.dataset.u, lvl=(S.research[u]||0);

      if(view==='village') updateVillageDynamic(); draw(); });
    stop(); if(S.researchQ) timer=setInterval(()=>{ if(!document.body.contains(ov)){ stop(); return; } draw(); },1000);
  }
  draw(); document.body.appendChild(ov);
};

async function decorate(pts,count){ count=count||48;

function mkLabel(){ const d=document.createElement('div'); d.className='v3-label'; labelHost.appendChild(d); return d; }

//     확대하면 그 저해상도가 그대로 늘어나 "안개"가 아니라 **블러로 뭉갠 지형**처럼 보였음.
//   구름은 월드 좌표 기준으로 반복(repeat)시켜 확대해도 무늬가 또렷하게 유지된다.
function _makeCloudTex(){
  if(_cloudTex) return _cloudTex;
  const N=256, cv=document.createElement('canvas'); cv.width=cv.height=N; const g=cv.getContext('2d');
  g.fillStyle='#b9c6cf'; g.fillRect(0,0,N,N);
  const blob=(x,y,r,a,c)=>{ const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(${c},${a})`); rg.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill(); };
  for(let i=0;i<54;i++){ const x=Math.random()*N, y=Math.random()*N, r=16+Math.random()*44;
    const light=Math.random()<0.5, c=light?'246,252,255':'92,104,116', a=0.30+Math.random()*0.42;
    for(const dx of [-N,0,N]) for(const dy of [-N,0,N]) blob(x+dx,y+dy,r,a,c); }   // 경계 넘는 얼룩은 반대편에도 → 이음매 없음
  _cloudTex=new T.CanvasTexture(cv); _cloudTex.wrapS=_cloudTex.wrapT=T.RepeatWrapping;
  _cloudTex.colorSpace=T.SRGBColorSpace; return _cloudTex;
}
// ☁️ 구름 한 덩이 텍스처(알파) — 여러 로브를 겹쳐 뭉게구름 실루엣을 만든다
function _makePuffTex(){
  if(_puffTex) return _puffTex;
  const N=160, cv=document.createElement('canvas'); cv.width=cv.height=N; const g=cv.getContext('2d');
  const lobe=(x,y,r,a)=>{
    const rg=g.createRadialGradient(x,y,r*0.12,x,y,r);
    rg.addColorStop(0,`rgba(255,255,255,${a})`);
    rg.addColorStop(0.55,`rgba(255,255,255,${a*0.82})`);
    rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
  };
  lobe(N*0.5,N*0.52,N*0.34,0.95);
  lobe(N*0.34,N*0.46,N*0.24,0.9);
  lobe(N*0.66,N*0.47,N*0.25,0.9);
  lobe(N*0.46,N*0.36,N*0.21,0.88);
  lobe(N*0.60,N*0.62,N*0.20,0.85);
  lobe(N*0.38,N*0.63,N*0.19,0.85);
  _puffTex=new T.CanvasTexture(cv); return _puffTex;
}
// ☁️ 미탐험 구역 **위에 떠 있는** 구름층 — 지면을 뿌옇게 칠하는 게 아니라 실제로 구름이 덮는다
function buildClouds(cols,rows,rev,opts){
  if(_cloudMesh){ SC.remove(_cloudMesh); _cloudMesh.geometry.dispose(); _cloudMesh.material.dispose(); _cloudMesh=null; }
  _cloudIdx=Object.create(null);
  const cells=[];
  // 성글게(약 68%) — 빽빽하면 아래가 아예 안 보여 답답하다
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ if(rev[c+','+r]) continue; if(_hrand(c+7,r+13)>0.68) continue; cells.push([c,r]); }
  if(!cells.length) return;
  const mat=new T.MeshBasicMaterial({map:_makePuffTex(), transparent:true, depthWrite:false, color:0xc6d2de, opacity:0.66});
  _cloudMesh=new T.InstancedMesh(new T.PlaneGeometry(1,1), mat, cells.length);
  _cloudMesh.renderOrder=6; _cloudMesh.frustumCulled=false;
  _cloudDummy=new T.Object3D();
  for(let i=0;i<cells.length;i++){
    const [c,r]=cells[i]; const p=opts.hex(c,r); const q=_hrand(c,r), q2=_hrand(r,c);
    const d=_cloudDummy;
    d.position.set(p.x-off.x+(q-0.5)*0.8, 0.72+q2*0.5, p.z-off.z+(q2-0.5)*0.8);
    d.rotation.set(-Math.PI/2, 0, q*6.2832);
    const sc=2.0+q2*0.9; d.scale.set(sc,sc,1);
    d.updateMatrix(); _cloudMesh.setMatrixAt(i,d.matrix);
    const t=0.80+_hrand(c+911,r+733)*0.20;
    _cloudMesh.setColorAt(i,new T.Color(t,t*1.005,t*1.02));
    _cloudIdx[c+','+r]=i;
  }
  _cloudMesh.instanceMatrix.needsUpdate=true;
  if(_cloudMesh.instanceColor) _cloudMesh.instanceColor.needsUpdate=true;
  SC.add(_cloudMesh);
}
// 공개된 칸의 구름 한 덩이를 치운다(스케일 0)
function hideCloudAt(c,r){
  if(!_cloudMesh||!_cloudIdx) return;
  const i=_cloudIdx[c+','+r]; if(i==null) return;
  const d=_cloudDummy||(_cloudDummy=new T.Object3D());
  d.position.set(0,-999,0); d.rotation.set(0,0,0); d.scale.set(0,0,0); d.updateMatrix();
  _cloudMesh.setMatrixAt(i,d.matrix); _cloudMesh.instanceMatrix.needsUpdate=true;
  delete _cloudIdx[c+','+r];
}
function fogInit(cols,rows,rev,opts,at){
  _fogCols=cols; _fogRows=rows; const K=14;   // 마스크 해상도(가장자리 선명도만 좌우 — 색은 구름 텍스처가 담당)
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const p=opts.hex(c,r); const x=p.x-off.x,z=p.z-off.z;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(z<minZ)minZ=z; if(z>maxZ)maxZ=z; }
  minX-=0.7; maxX+=0.7; minZ-=0.7; maxZ+=0.7;
  const w=maxX-minX, h=maxZ-minZ, cw=Math.ceil(w*K), ch=Math.ceil(h*K);
  _fb={minX,minZ,w,h,cw,ch,k:cw/w};
  _fogCanvas=document.createElement('canvas'); _fogCanvas.width=cw; _fogCanvas.height=ch; _fogCtx=_fogCanvas.getContext('2d');
  _fogCtx.fillStyle='#ffffff'; _fogCtx.fillRect(0,0,cw,ch);   // 전부 안개(흰색=불투명) → 공개된 칸만 파낸다
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ if(rev[c+','+r]) eraseFogCell(c,r); }
  if(_fogPlane){ SC.remove(_fogPlane); _fogPlane.geometry.dispose(); _fogPlane.material.dispose(); if(_fogTex)_fogTex.dispose(); }
  _fogTex=new T.CanvasTexture(_fogCanvas); _fogTex.flipY=false; _fogTex.minFilter=T.LinearFilter; _fogTex.magFilter=T.LinearFilter;
  const geo=new T.PlaneGeometry(w,h);
  const mat=new T.MeshBasicMaterial({alphaMap:_fogTex, color:0xa9b8c6, opacity:0.5, transparent:true, depthWrite:false, fog:false});
  _fogPlane=new T.Mesh(geo,mat); _fogPlane.rotation.x=-Math.PI/2;
  _fogPlane.position.set(minX+w/2,0.24,minZ+h/2); _fogPlane.renderOrder=4; SC.add(_fogPlane);
  buildClouds(cols,rows,rev,opts);
}
// ── 마을 간 길: 헥스 길 타일(path-*)을 경로 헥스에 깔고 회전 맞춤 ──
// 오프셋(odd-r pointy)↔큐브 좌표 + 헥스 라인
function o2c(col,row){ const q=col-((row-(row&1))>>1); return {x:q,z:row,y:-q-row}; }
function c2o(cu){ const row=cu.z, col=cu.x+((row-(row&1))>>1); return {c:col,r:row}; }
function cubeRound(x,y,z){ let rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);
  const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);
  if(dx>dy&&dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry; return {x:rx,y:ry,z:rz}; }
function cubeDist(a,b){ return (Math.abs(a.x-b.x)+Math.abs(a.y-b.y)+Math.abs(a.z-b.z))/2; }
function hexLine(A,B){ const N=cubeDist(A,B); const out=[]; for(let i=0;i<=N;i++){ const t=N===0?0:i/N;
  out.push(c2o(cubeRound(A.x+(B.x-A.x)*t,A.y+(B.y-A.y)*t,A.z+(B.z-A.z)*t))); } return out; }
function rad(d){ return d*Math.PI/180; }
// 두 변(각도, 60°배수)을 잇는 길 타일 + 회전(세계각=국소각-회전)
function pickRoad(a,b){ let d=((b-a)%360+360)%360;
  if(d===180) return {n:'path-straight',rot:rad(-a)};
  if(d===120) return {n:'path-corner',rot:rad(180-a)};
  if(d===240) return {n:'path-corner',rot:rad(180-b)};
  if(d===60)  return {n:'path-corner-sharp',rot:rad(180-a)};
  if(d===300) return {n:'path-corner-sharp',rot:rad(180-b)};
  return {n:'path-straight',rot:rad(-a)}; }
function computeRoads(world, opts, at){
  const road={}, ids=Object.keys(world); if(ids.length<2) return road;
  const dV=(a,b)=>{ const p=opts.hex(a.x,a.y),q=opts.hex(b.x,b.y); return Math.hypot(p.x-q.x,p.z-q.z); };
  // 각 마을→가장 가까운 다른 마을(중복 제거) + 내 성→라이벌
  const seen={}, edges=[];
  for(const id of ids){ let best=null,bd=1e9; for(const j of ids){ if(j===id)continue; const d=dV(world[id],world[j]); if(d<bd){bd=d;best=j;} }
    if(best){ const k=[id,best].sort().join('|'); if(!seen[k]){ seen[k]=1; edges.push([id,best]); } } }
  const HK=opts.HOME; if(world[HK]) for(const id of ids){ if(id===HK||world[id].owner!=='player')continue; const k=[HK,id].sort().join('|'); if(!seen[k]){ seen[k]=1; edges.push([HK,id]); } }
  // 변 방향(세계각 60°배수)
  const edge6=(h1,h2)=>{ const p=opts.hex(h1.c,h1.r),q=opts.hex(h2.c,h2.r); let g=Math.round(Math.atan2(q.z-p.z,q.x-p.x)*180/Math.PI/60)*60; return ((g%360)+360)%360; };
  const conn={};
  for(const [ia,ib] of edges){ const line=hexLine(o2c(world[ia].x,world[ia].y), o2c(world[ib].x,world[ib].y));
    for(let i=1;i<line.length-1;i++){ const h=line[i]; const key=h.c+','+h.r; if(at[key]) continue; // 마을 헥스는 건너뜀
      const s=conn[key]||(conn[key]=new Set()); s.add(edge6(h,line[i-1])); s.add(edge6(h,line[i+1])); } }
  for(const key in conn){ const dirs=[...conn[key]].sort((a,b)=>a-b);
    if(dirs.length===2){ const t=pickRoad(dirs[0],dirs[1]); road[key]={n:t.n,rot:t.rot}; }
    else road[key]={n:'path-crossing',rot:0}; }   // 교차(3+)는 교차로 타일
  return road;
}
function mkrng2(s){ return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
export function resetCam(){ if(!CAM)return; CAM.position.set(16,16,16); CAM.zoom=8; CAM.updateProjectionMatrix(); if(CT){CT.target.set(0,0,0);CT.update();} }
window.addEventListener('resize',resize);
window.Map3D={ mount, build, resetCam, ok:true, dbg:()=>CT?{tx:+CT.target.x.toFixed(2),tz:+CT.target.z.toFixed(2),zoom:+CAM.zoom.toFixed(2)}:null };
</script>

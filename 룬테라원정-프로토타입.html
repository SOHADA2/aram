<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>룬테라 전쟁 — 프로토타입 v0.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#0a0a0f;color:#e8dcc0;font-family:'Noto Sans KR',system-ui,sans-serif;overscroll-behavior:none;}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#12101a,#0a080f);position:relative;}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:8px 10px;background:linear-gradient(180deg,#1a1220,#140e18);border-bottom:1px solid rgba(200,168,75,.25);}
.topbar .tt{font-weight:900;color:#f0dca0;font-size:14px;flex:1;}
.res-chip{font-family:monospace;font-weight:800;font-size:11px;background:rgba(0,0,0,.4);border:1px solid rgba(200,168,75,.3);border-radius:14px;padding:3px 8px;white-space:nowrap;}
.res-chip.g{color:#ffd76a;}
.resbar{display:flex;gap:4px;padding:6px 10px;overflow-x:auto;background:#0e0b14;border-bottom:1px solid rgba(255,255,255,.05);}
.btn{border:none;border-radius:9px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn-gold{background:linear-gradient(135deg,#d4a843,#f0c84a);color:#1a1206;}
.btn-dk{background:rgba(255,255,255,.07);color:#e8dcc0;border:1px solid rgba(255,255,255,.12);}
/* 지도 — 실사 룬테라 맵 배경 + 얇은 상태 마커 */
#map-view{position:relative;padding:12px 8px 6px;background:radial-gradient(120% 100% at 50% 20%,#0e2632,#081820 60%,#050f14 100%);min-height:300px;}
.map-wrap{position:relative;width:100%;height:min(72vh,660px);border-radius:12px;overflow:hidden;cursor:grab;touch-action:none;
  box-shadow:0 10px 34px rgba(0,0,0,.62),inset 0 0 0 1px rgba(202,162,78,.4);}
.map-wrap.grabbing{cursor:grabbing;}
.map-content{position:absolute;top:0;left:0;width:1500px;height:1500px;transform-origin:0 0;will-change:transform;}/* WORLD(100)×FIELD(15) */
.grid-canvas{position:absolute;inset:0;width:1500px;height:1500px;image-rendering:auto;}
#armies{position:absolute;inset:0;z-index:6;pointer-events:none;}
.army-mk{position:absolute;transform:translate(-50%,-50%) scale(var(--mkz,1));transform-origin:center;z-index:6;text-align:center;}
.army-mk .am-ic{font-size:16px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.85));display:inline-block;}
.army-mk .am-lbl{display:block;font-size:8px;font-weight:800;font-family:monospace;color:#f0dca0;background:rgba(10,7,4,.82);border-radius:6px;padding:0 4px;margin-top:-2px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.6);}
.army-mk.attack .am-ic{animation:amBob 1s ease-in-out infinite;}
.army-mk.return .am-lbl{color:#a7f3c0;}
.army-mk.raid{z-index:7;} .army-mk.raid .am-ic{animation:amBob .6s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,70,55,.9));}
.army-mk.raid .am-lbl{color:#ffb0a0;background:rgba(50,10,8,.9);box-shadow:0 0 8px rgba(255,60,50,.5);}
.rep{border-radius:9px;padding:7px 10px;margin-bottom:6px;border:1px solid rgba(255,255,255,.08);}
.rep.win{background:linear-gradient(180deg,rgba(30,90,50,.28),rgba(14,40,24,.3));border-color:rgba(120,220,150,.35);}
.rep.lose{background:linear-gradient(180deg,rgba(90,30,26,.3),rgba(40,14,12,.32));border-color:rgba(255,120,90,.35);}
.rep-h{font-size:11.5px;font-weight:800;color:#f0e2c0;}
.rep-m{font-size:9.5px;color:#c9b98a;margin-top:2px;}
@keyframes amBob{50%{transform:translateY(-2px) scale(1.12)}}
/* 팬/줌 공통 컨트롤 */
.pz-hint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);z-index:6;font-size:9px;color:#cfe0e8;background:rgba(6,12,16,.6);border:1px solid rgba(200,168,75,.25);border-radius:12px;padding:3px 10px;pointer-events:none;white-space:nowrap;transition:opacity .5s;}
.pz-hint.gone{opacity:0;}
.pz-reset{position:absolute;right:8px;top:8px;z-index:6;width:30px;height:30px;border:none;border-radius:8px;background:rgba(8,14,18,.7);border:1px solid rgba(200,168,75,.4);color:#f0dca0;font-size:15px;cursor:pointer;backdrop-filter:blur(2px);}
.pz-reset:active{transform:scale(.94);}
.map-edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
.map-vig{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:12px;box-shadow:inset 0 0 36px 8px rgba(4,10,14,.55);}
#mnodes{position:absolute;inset:0;z-index:5;}
.mk{position:absolute;width:0;height:0;z-index:1;}
.mk-box{position:absolute;left:0;top:0;width:52px;height:52px;transform:translate(-50%,-50%) scale(var(--mkz,1));transform-origin:center;cursor:pointer;}
.mk-ring{position:absolute;left:50%;top:50%;width:88%;height:88%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;transition:box-shadow .2s;}
.mk.open .mk-ring{box-shadow:0 0 0 2px rgba(127,206,122,.85),0 0 15px rgba(127,206,122,.45);}
.mk.openable .mk-ring{box-shadow:0 0 0 2px rgba(169,212,255,.95);animation:mkPulse 1.5s infinite;}
.mk.home .mk-ring{box-shadow:0 0 0 2px rgba(240,220,150,.9),0 0 14px rgba(240,220,150,.5);}
@keyframes mkPulse{50%{box-shadow:0 0 0 6px rgba(120,180,255,.35),0 0 18px rgba(120,180,255,.55);}}
.mk-veil{position:absolute;left:50%;top:50%;width:190%;height:190%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(6,14,20,.72),rgba(6,14,20,.4) 52%,transparent 72%);}
.mk-lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;pointer-events:none;filter:drop-shadow(0 1px 2px #000);opacity:.85;}
.mk-raidmk{position:absolute;top:-2px;right:-2px;font-size:13px;pointer-events:none;filter:drop-shadow(0 1px 2px #000);}
.mk-badge{position:absolute;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:800;white-space:nowrap;padding:1px 7px;border-radius:8px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.6);}
.mk-badge.timer{bottom:-9px;background:rgba(16,12,8,.92);border:1px solid #7a5c1e;color:#f0dca0;font-family:monospace;}
.mk-badge.tag{top:-11px;background:linear-gradient(135deg,#5b8fd6,#a9d4ff);color:#08172c;}
.mk-badge.home{top:-11px;background:linear-gradient(135deg,#f4e3a8,#d8b45a);color:#2a1c06;}
.map-cartouche{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:7;text-align:center;pointer-events:none;
  font-family:Georgia,serif;font-weight:800;letter-spacing:4px;font-size:14px;color:#f7e9b8;text-shadow:0 2px 5px #000;}
.map-cartouche small{display:block;font-size:7px;letter-spacing:3px;color:#caa24e;margin-top:0;opacity:.85;}
.map-compass{position:absolute;right:12px;bottom:34px;z-index:7;width:52px;height:52px;opacity:.85;pointer-events:none;}
.mnode{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;z-index:5;}
.mnode .pin{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding:5px 10px 7px;border-radius:10px;
  background:linear-gradient(180deg,rgba(34,26,14,.96),rgba(16,11,5,.97));border:1px solid #a3812f;
  box-shadow:0 5px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,225,150,.15);min-width:66px;}
.mnode .pin::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;
  background:linear-gradient(135deg,rgba(16,11,5,.97),rgba(16,11,5,.97));border-right:1px solid #a3812f;border-bottom:1px solid #a3812f;}
.mnode .ic{font-size:20px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
.mnode .nm{font-size:11px;font-weight:800;color:#f2e2ad;}
.mnode .blabel{font-size:7.5px;font-weight:700;letter-spacing:.5px;margin-top:-1px;text-shadow:0 1px 2px #000;}
.mnode.locked .blabel{opacity:.55;}
.mnode .meta{font-size:8.5px;color:#c9b98a;font-weight:700;}
.mnode.locked .pin{filter:grayscale(.85);opacity:.4;}
.mnode.locked .pin::after{filter:grayscale(.85);opacity:.4;}
.mnode.open .pin{border-color:#7fce7a;box-shadow:0 5px 14px rgba(0,0,0,.6),0 0 14px rgba(127,206,122,.25),inset 0 1px 0 rgba(255,225,150,.15);}
.mnode.open .pin::after{border-color:#7fce7a;}
.mnode.openable .pin{border-color:#a9d4ff;animation:pulseB 1.6s infinite;}
@keyframes pulseB{50%{box-shadow:0 0 0 4px rgba(120,180,255,.28),0 5px 14px rgba(0,0,0,.6);}}
.mnode.home .badge,.mnode.openable .badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;padding:1px 7px;border-radius:7px;white-space:nowrap;z-index:2;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.mnode.home .badge{background:linear-gradient(135deg,#f4e3a8,#d8b45a);color:#2a1c06;}
.mnode.openable .badge{background:linear-gradient(135deg,#5b8fd6,#a9d4ff);color:#08172c;}
.mnode .raidmk{position:absolute;top:-7px;right:-7px;font-size:13px;z-index:2;filter:drop-shadow(0 1px 2px #000);}
.edge{stroke:rgba(202,162,78,.28);stroke-width:1.6;stroke-dasharray:2 5;stroke-linecap:round;}
.map-tip{position:absolute;bottom:9px;left:8px;right:8px;text-align:center;font-size:9.5px;color:#9db3bf;z-index:7;text-shadow:0 1px 2px #000;}
/* 지역 화면 */
#rgn-view{display:none;padding:10px;}
.sec-h{font-size:11px;font-weight:800;color:#b9a878;letter-spacing:1px;margin:10px 2px 6px;}
.sec-h span{color:#8a7a52;font-weight:600;}
.heroes{display:flex;gap:7px;flex-wrap:wrap;}
.hero{flex:1 1 46%;min-width:150px;display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(40,30,60,.6),rgba(20,14,28,.6));border:1px solid #7a5c9e;border-radius:11px;padding:7px;}
.hero .por{width:42px;height:42px;border-radius:8px;background-size:cover;background-position:35% 15%;border:1px solid #a78bfa;flex:none;}
.hero .hn{font-size:12px;font-weight:900;color:#e8dcf0;}
.hero .hs{font-size:10px;color:#c4b5fd;font-weight:700;}
.hero .hi{flex:1;min-width:0;}
.hpbar{height:5px;border-radius:4px;background:rgba(0,0,0,.45);margin-top:4px;overflow:hidden;}
.hpbar>div{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b 55%,#22c55e);}
.hero.dead{opacity:.75;border-color:#7a3a3a;}
.hero.dead .por{filter:grayscale(1) brightness(.55);}
.hero.dead .hs{color:#ff8a8a;}
.hero-empty{flex:1 1 46%;min-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px dashed rgba(255,255,255,.18);border-radius:11px;padding:12px 7px;color:#9a9aa8;font-size:10px;text-align:center;cursor:pointer;}
.raid{background:linear-gradient(180deg,rgba(60,20,20,.5),rgba(30,12,12,.5));border:1px solid #7a3a2e;border-radius:11px;padding:9px 11px;}
.raid-t{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#ffb4a0;}
.raid-t .mon{font-size:10.5px;color:#ff9a6a;}
.rbar{height:8px;border-radius:6px;background:rgba(0,0,0,.4);margin:7px 0 4px;overflow:hidden;position:relative;}
.rbar .def{height:100%;background:linear-gradient(90deg,#22c55e,#86efac);}
.rbar .line{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ff6a6a;}
.raid-meta{display:flex;justify-content:space-between;font-size:9.5px;color:#c9b98a;}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.bld{background:rgba(0,0,0,.4);border:10px solid transparent;border-image:url('assets/ui/frame-sm.png') 14 stretch;padding:5px 7px;}
.bld-h{display:flex;align-items:center;gap:6px;}
.bld-ic{font-size:19px;}
.bld-nm{font-size:11.5px;font-weight:800;color:#f0e2b8;}
.bld-lv{margin-left:auto;font-size:9px;font-weight:800;color:#1a1206;background:linear-gradient(135deg,#f4e3a8,#d8b45a);padding:1px 6px;border-radius:7px;}
.bld-eff{font-size:9.5px;color:#9fce9a;margin:4px 0 6px;font-weight:700;min-height:12px;}
.bld-up{width:100%;padding:5px;border:none;border-radius:7px;background:rgba(120,90,30,.4);border:1px solid #7a5c1e;color:#f0dca0;font-size:9px;font-weight:700;cursor:pointer;}
.bld-up:disabled{opacity:.45;cursor:default;}
.bld.tower{border-color:rgba(120,160,255,.35);} .bld.tower .bld-lv{background:linear-gradient(135deg,#a9d4ff,#5b8fd6);color:#0a1a30;}
.bld.heal{border-color:rgba(255,150,196,.35);} .bld.heal .bld-lv{background:linear-gradient(135deg,#ffc4dd,#e06a9c);color:#3a0a20;}
/* 오버레이(카드/영웅선택) */
.ov{position:fixed;inset:0;z-index:60;background:rgba(4,4,10,.85);display:flex;align-items:center;justify-content:center;padding:16px;}
.ov-x{position:absolute;top:12px;right:14px;font-size:22px;color:#ccc;cursor:pointer;z-index:2;}
.picker{width:100%;max-width:420px;max-height:82vh;overflow:auto;background:rgba(15,11,19,.97);border:20px solid transparent;border-image:url('assets/ui/frame.png') 30 stretch;padding:4px 10px;}
.pick-h{font-weight:900;color:#f0dca0;margin:0 0 8px;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pcard{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.35);border:1px solid #4a3a66;border-radius:10px;padding:7px;cursor:pointer;}
.pcard .por{width:40px;height:40px;border-radius:7px;background-size:cover;background-position:35% 15%;flex:none;border:1px solid #7a5c9e;}
.pcard .hn{font-size:11.5px;font-weight:800;color:#e8dcf0;}
.pcard .hs{font-size:9.5px;color:#c4b5fd;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;background:rgba(20,14,8,.96);border:1px solid #7a5c1e;color:#f0dca0;font-size:12px;font-weight:700;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.on{opacity:1;}
.proto-tag{font-size:8.5px;color:#8a7a52;text-align:center;padding:6px;}
/* LoR 카드(간이) */
.lor{width:300px;aspect-ratio:2/3;border-radius:16px;overflow:hidden;position:relative;background:#0d0b08;
  box-shadow:inset 0 0 0 2px #5b4416,inset 0 0 0 5px #a3812f,inset 0 0 0 7px #e9d288,inset 0 0 0 10px #6e5417,0 14px 40px rgba(0,0,0,.7);}
.lor .art{position:absolute;top:10px;left:10px;right:10px;height:60%;border-radius:8px;background-size:cover;background-position:35% 18%;
  box-shadow:inset 0 -30px 30px #0a0906;}
.lor .nm{position:absolute;top:58%;left:14px;right:14px;text-align:center;font-size:22px;font-weight:900;color:#f2e2ad;text-shadow:0 2px 4px #000;font-family:Georgia,serif;}
.lor .kw{position:absolute;top:66%;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#dfe7f5;}
.lor .kw b{background:#243050;border:1px solid #4a5a86;border-radius:14px;padding:3px 12px;}
.lor .ds{position:absolute;top:73%;left:18px;right:18px;text-align:center;font-size:11.5px;color:#e8e2d2;line-height:1.5;}
.lor .cost{position:absolute;top:8px;left:8px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#a9d4ff,#3b82f6 55%,#1e3a8a);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #f4e3a8;font-size:12px;font-weight:800;color:#fff;flex-direction:column;line-height:1;}
.lor .cost small{font-size:7px;}
.lor .rgn{position:absolute;top:10px;right:10px;font-size:22px;filter:drop-shadow(0 0 5px rgba(120,255,180,.5));}
.lor .pw,.lor .hp{position:absolute;bottom:6px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);color:#fff;font-weight:900;font-size:18px;}
.lor .pw{left:6px;background:radial-gradient(circle at 40% 32%,#ffcf87,#e07a1e 60%,#8a3d08);}
.lor .hp{right:6px;background:radial-gradient(circle at 40% 32%,#ff9a9a,#d63838 60%,#7a1414);}
.lor .pw small,.lor .hp small{font-size:8px;}
/* ── 게임풍 폴리시 + 애니메이션(전략게임 톤 참고·오리지널) ── */
.topbar{background:linear-gradient(180deg,#241a10,#160f0a);border-bottom:2px solid #6b4f24;box-shadow:0 3px 10px rgba(0,0,0,.5);}
.resbar{background:linear-gradient(180deg,#1a140c,#120d08);border-bottom:1px solid #6b4f24;}
.res-chip{background:linear-gradient(180deg,rgba(60,44,20,.5),rgba(20,14,8,.6));border:1px solid #6b4f24;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);}
#map-view.anim{animation:mapIn .55s ease-out;}
.mnode.pop{animation:nodePop .5s cubic-bezier(.34,1.5,.5,1) backwards;}
#rgn-view.anim{animation:viewIn .4s ease-out;}
@keyframes mapIn{from{opacity:0;transform:scale(1.09)}to{opacity:1;transform:scale(1)}}
@keyframes nodePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}72%{transform:translate(-50%,-50%) scale(1.14)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes bannerZoom{from{transform:scale(1.15)}to{transform:scale(1)}}
/* 정착지 헤더 배너 */
.rgn-banner{position:relative;height:98px;border-radius:12px;overflow:hidden;margin-bottom:6px;border:1px solid #6b4f24;box-shadow:0 4px 14px rgba(0,0,0,.5);}
.rgn-banner .bg{position:absolute;inset:0;background-size:cover;background-position:40% 20%;filter:brightness(.6);animation:bannerZoom .8s ease-out;}
.rgn-banner .ov2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.1),rgba(10,8,6,.88));}
.rgn-banner .tt{position:absolute;left:14px;bottom:9px;font-size:19px;font-weight:900;color:#f0dca0;text-shadow:0 2px 5px #000;}
.rgn-banner .tt small{font-size:11px;color:#ff9a6a;margin-left:6px;}
.rgn-banner .bk{position:absolute;top:8px;left:8px;width:32px;height:32px;border:none;border-radius:8px;background:rgba(0,0,0,.55);color:#e8dcc0;font-size:16px;cursor:pointer;}
.rgn-banner .story2{position:absolute;left:14px;right:12px;bottom:-1px;font-size:9.5px;color:#c9b98a;transform:translateY(-24px);opacity:.9;}
/* 건물 플롯 느낌 */
.bld{background:linear-gradient(180deg,rgba(40,30,16,.6),rgba(18,13,8,.62));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 5px rgba(0,0,0,.35);}
.bld-ic{filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
/* ── 프리미엄 정착지: 아이소 씬 + 영웅 정보 카드 ── */
.scene{position:relative;height:408px;overflow:hidden;border-radius:14px;margin-bottom:6px;border:1px solid #6b4f24;cursor:grab;touch-action:none;
  background:radial-gradient(62% 54% at 50% 46%,#40506a,#1c2230 58%,#0b0e15 100%);box-shadow:0 6px 20px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.45);}
.scene.grabbing{cursor:grabbing;}
.scene-cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform;z-index:1;}
.scene::before{content:'';position:absolute;inset:0;z-index:1;background:radial-gradient(120% 90% at 50% -12%,rgba(255,255,255,.06),transparent 56%);pointer-events:none;}
.scene::after{content:'';position:absolute;inset:0;background:radial-gradient(76% 64% at 50% 48%,transparent 50%,rgba(0,0,0,.66));pointer-events:none;z-index:50;}
.scene .bk2{position:absolute;top:9px;left:9px;z-index:56;width:32px;height:32px;border:none;border-radius:9px;background:rgba(8,6,4,.6);border:1px solid rgba(200,168,75,.35);color:#e8dcc0;font-size:16px;cursor:pointer;backdrop-filter:blur(2px);}
.scene .stt{position:absolute;top:10px;left:50px;z-index:56;font-size:16px;font-weight:900;color:#f0dca0;text-shadow:0 2px 5px #000;pointer-events:none;}
.scene .stt small{font-size:10px;color:#ff9a6a;margin-left:6px;}

// 🛡️ 뉴비 보호 헬퍼 (실제판은 Firebase 서버시각 기준 — 여기선 로컬 시각)
function protectLeft(w){ return (w&&w.protectUntil)? Math.max(0, w.protectUntil-Date.now()) : 0; }
function isProtected(w){ return protectLeft(w)>0; }
function fmtProtect(ms){ const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  return d>0? `${d}일 ${h}시간` : (h>0? `${h}시간 ${m}분` : `${m}분`); }
// 🎯 시작 지점 분배 — 중앙 반경 내, 다른 플레이어와 최소거리 확보한 빈 칸(겹침 방지). 실제판은 Firebase runTransaction으로 원자적 점유
function allocSpawn(taken, players, R){ R=R||Math.random; const cx=WORLD/2, cy=WORLD/2;
  for(let ring=8; ring<=SPAWN_RADIUS; ring+=2){ for(let t=0;t<60;t++){
    const ang=R()*Math.PI*2, rr=ring-R()*4;
    const x=Math.round(cx+Math.cos(ang)*rr), y=Math.round(cy+Math.sin(ang)*rr);
    if(x<2||y<2||x>WORLD-3||y>WORLD-3) continue;
    if(taken.has(x+','+y)) continue;
    let ok=true; for(const p of players){ if(Math.hypot(x-p.x,y-p.y)<SPAWN_MINDIST){ ok=false; break; } }
    if(ok) return {x,y};
  } }
  return null;
}
// 격자 세계 생성 — 내 마을(50,50) + 야만인 마을 ~170개(뭉치고 흩어짐, 정수 좌표=칸). 부족전쟁식
function genWorld(now){
  const R=mkrng(778899); const W={}; now = now || Date.now();
  W[HOME_KEY]={x:50,y:50,name:'내 마을',owner:'me',size:6,loot:{wood:0,clay:0,iron:0},garrison:{},foundedAt:now,protectUntil:now+PROTECT_MS};
  const taken=new Set(['50,50']); const players=[{x:50,y:50}]; let n=0, guard=0;
  // 🎯 라이벌 소환사(멀티 예시) — 스폰 분배로 겹치지 않게 배치 · 일부는 뉴비 보호 중
  for(let i=0;i<5;i++){ const sp=allocSpawn(taken, players, R); if(!sp) break; taken.add(sp.x+','+sp.y); players.push(sp);
    const size=3+Math.floor(R()*3); const prot = i<3 ? now + PROTECT_MS*(0.25+R()*0.7) : 0;   // 5명 중 3명 보호중
    W['p'+i]={x:sp.x,y:sp.y,name:RIVAL_NAMES[i]||('소환사 '+i),owner:'player',size,loot:barbLoot(size),garrison:barbGarrison(size),foundedAt:now,protectUntil:prot}; }
  const clusters=[]; for(let i=0;i<14;i++) clusters.push({cx:6+R()*88, cy:6+R()*88});
  while(n<170 && guard<5000){ guard++;
    let x,y;
    if(R()<0.72){ const cl=clusters[Math.floor(R()*clusters.length)]; x=Math.round(cl.cx+(R()-.5)*20); y=Math.round(cl.cy+(R()-.5)*20); }
    else { x=Math.round(2+R()*96); y=Math.round(2+R()*96); }

function updateArmies(){
  const host=document.getElementById('armies'); if(!host) return;
  const now=Date.now(); const home=S.world[HOME_KEY]; let h='';
  (S.marches||[]).forEach(m=>{
    const org = m.mode==='raid'?S.world[m.from] : (m.mode==='attack'?home:S.world[m.to]);
    const dst = m.mode==='raid'?home : (m.mode==='attack'?S.world[m.to]:home);
    if(!org||!dst) return;
    const span=m.arriveAt-m.dep; const p=span>0?Math.min(1,Math.max(0,(now-m.dep)/span)):1;
    const x=((org.x+(dst.x-org.x)*p+0.5)*FIELD).toFixed(1), y=((org.y+(dst.y-org.y)*p+0.5)*FIELD).toFixed(1);
    const ic=m.mode==='raid'?'🔥':(m.mode==='attack'?'⚔️':'🎒'); const eta=fmtDur(m.arriveAt-now);
    h+=`<div class="army-mk ${m.mode}" style="left:${x}px;top:${y}px"><span class="am-ic">${ic}</span><span class="am-lbl">${eta}</span></div>`; });
  host.innerHTML=h;
}
// 격자 지형 캔버스 — 초원 바탕 + 숲/호수/황무지 얼룩 + 칸 격자선 + 대륙선(10칸) K## 라벨
function drawGrid(){
  const cv=document.getElementById('grid-canvas'); if(!cv) return; const px=WORLD*FIELD; const SS=2; // 2배 슈퍼샘플 → 확대 시 선명
  if(cv.width!==px*SS){ cv.width=px*SS; cv.height=px*SS; }
  const g=cv.getContext('2d'); g.setTransform(SS,0,0,SS,0,0);
  g.fillStyle='#38512e'; g.fillRect(0,0,px,px);                         // 초원
  const R=mkrng(424242);
  for(let i=0;i<300;i++){ const x=Math.floor(R()*WORLD), y=Math.floor(R()*WORLD), t=R();
    if(t<0.55) g.fillStyle='rgba(26,54,22,'+(0.3+R()*0.3).toFixed(2)+')';       // 숲
    else if(t<0.8) g.fillStyle='rgba(38,86,104,'+(0.35+R()*0.35).toFixed(2)+')'; // 물
    else g.fillStyle='rgba(120,104,64,'+(0.18+R()*0.2).toFixed(2)+')';           // 황무지
    const w=(1+Math.floor(R()*2))*FIELD, hh=(1+Math.floor(R()*2))*FIELD;
    g.fillRect(x*FIELD,y*FIELD,w,hh); }
  g.strokeStyle='rgba(0,0,0,.13)'; g.lineWidth=1;                       // 칸 격자
  for(let i=0;i<=WORLD;i++){ const p=i*FIELD+.5;
    g.beginPath(); g.moveTo(p,0); g.lineTo(p,px); g.stroke();
    g.beginPath(); g.moveTo(0,p); g.lineTo(px,p); g.stroke(); }
  g.strokeStyle='rgba(202,168,75,.42)'; g.lineWidth=2;                  // 대륙선(10칸)
  for(let i=0;i<=WORLD;i+=10){ g.beginPath(); g.moveTo(i*FIELD,0); g.lineTo(i*FIELD,px); g.stroke();
    g.beginPath(); g.moveTo(0,i*FIELD); g.lineTo(px,i*FIELD); g.stroke(); }
  g.fillStyle='rgba(240,220,150,.42)'; g.font='bold 20px Georgia,serif'; g.textAlign='center';
  for(let cy=0;cy<10;cy++)for(let cx=0;cx<10;cx++) g.fillText('K'+cy+cx, (cx*10+5)*FIELD, (cy*10+5)*FIELD+7);
}

function buildIso(id){
  const scene=document.getElementById('rgn-scene'); const cam=document.getElementById('rgn-cam'); if(!cam) return;
  const B=BIOME[REGIONS[id]?id:HOME_ID]; const blds=S.v.blds; const A='assets/rune/iso/';
  const TW=60, DX=TW/2, DY=TW/4, AN=0.80, cx=(scene.clientWidth||420)/2, cy=140;
  const GC0=-1,GC1=6,GR0=-1,GR1=6, IC0=0,IC1=5,IR0=0,IR1=5;
  const R=mkrng(1000 + id.length*131 + id.charCodeAt(0)*7);   // 지역별 고정 랜덤(소품 배치)
  const P=(c,r)=>({x:cx+(c-r)*DX, y:cy+(c+r)*DY});
  function put(src,col,row,o){ o=o||{}; const w=TW*(o.scale||1),h=w*2, x=cx+(col-row)*DX, y=cy+(col+row)*DY;
    const img=new Image(); img.src=A+src+'.png';
    img.style.cssText=`position:absolute;width:${w}px;left:${x-w/2}px;top:${y-h*AN+(o.ey||0)}px;z-index:${Math.round((col+row)*10+(o.dz||0))};filter:${o.filter?o.filter+' ':''}drop-shadow(0 5px 5px rgba(0,0,0,.4));pointer-events:none;`;
    cam.appendChild(img); }
  function putPix(src,x,y,o){ o=o||{}; const w=TW*(o.scale||0.5),h=w*2;
    const img=new Image(); img.src=A+src+'.png';
    img.style.cssText=`position:absolute;width:${w}px;left:${x-w/2}px;top:${y-h*AN+(o.ey||0)}px;z-index:${Math.round(o.z||0)};filter:${o.filter?o.filter+' ':''}drop-shadow(0 4px 4px rgba(0,0,0,.38));pointer-events:none;`;
    cam.appendChild(img); }
  function tag(col,row,nm,lv,ey,bkey){ const x=cx+(col-row)*DX, y=cy+(col+row)*DY; const d=document.createElement('div');
    d.className='iso-tag'; d.style.left=x+'px'; d.style.top=(y-40+(ey||0))+'px'; d.style.zIndex=Math.round((col+row)*10+6);
    d.innerHTML=`<span class="ilv">Lv${lv}</span><span class="inm">${nm}</span>`;
    if(bkey) d.onclick=()=>{ if(scene._panned)return; build(bkey); }; cam.appendChild(d); }
  function emp(col,row,ey,bkey){ const x=cx+(col-row)*DX, y=cy+(col+row)*DY; const d=document.createElement('div');
    d.className='iso-emp'; d.style.left=x+'px'; d.style.top=(y-8+(ey||0))+'px'; d.style.zIndex=Math.round((col+row)*10+6);

  // 바닥 — 넓은 정착지(안뜰=돌 광장 + 바깥=흙길), 바이옴 색
  for(let r=GR0;r<=GR1;r++)for(let c=GC0;c<=GC1;c++){ const inner=(c>=IC0&&c<=IC1&&r>=IR0&&r<=IR1);
    put(inner?((c+r)%2?'stoneTile_E':'stoneTile_N'):((c+r)%2?'dirt_E':'dirtTiles_E'),c,r,{dz:-9,filter:B.gf}); }
  // 가벼운 둘레 — 뒷 성벽(북)만 + 코너/중간 탑 + 남동 성문 (요새 아닌 성곽 도시 느낌)

  put('stoneWallRoundWindow_E',GC1,GR0,{ey:-5,dz:3,filter:B.wf});
  put('stoneWallRoundWindow_E',3,GR0,{ey:-5,dz:3,filter:B.wf});

    <h3 class="pick-h" style="justify-content:center;color:#ffcf87">뉴비 보호가 풀려요</h3>
    <div class="muted" style="margin:8px 4px 2px;line-height:1.55">지금 먼저 공격하면 남은 <b style="color:#9fd0ff">${fmtProtect(left)}</b>의<br>🛡️ 뉴비 보호가 <b style="color:#ff9a6a">즉시 해제</b>됩니다.<br>이후 다른 소환사에게 공격받을 수 있어요.</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-dk cr-no" style="flex:1;padding:11px">취소</button>
      <button class="btn btn-gold cr-yes" style="flex:1;padding:11px">무시하고 공격</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('.cr-no').onclick=()=>ov.remove();
  ov.querySelector('.cr-yes').onclick=()=>{ S.world[HOME_KEY].protectUntil=0; save(); renderTop(); toast('🛡️ 뉴비 보호가 해제됐어요'); ov.remove(); onYes(); };
}
function openAttack(id){ const w=S.world[id]; if(!w) return; const v=S.v;
  if(isProtected(w)){   // 🛡️ 보호 중인 소환사는 공격 불가
    const ov=document.createElement('div'); ov.className='ov'; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
    ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span><div class="picker" style="max-width:320px;text-align:center">
      <div style="font-size:34px;margin:4px 0">🛡️</div>
      <h3 class="pick-h" style="justify-content:center">${w.name} · 뉴비 보호 중</h3>
      <div class="muted" style="margin:8px 0 2px;line-height:1.5">이 소환사는 <b style="color:#9fd0ff">${fmtProtect(protectLeft(w))}</b> 동안<br>공격받지 않아요. 보호가 끝나면 공격할 수 있어요.</div>
      <button class="btn btn-dk" style="width:100%;padding:11px;margin-top:10px" onclick="this.closest('.ov').remove()">확인</button>
    </div>`;
    document.body.appendChild(ov); return;
  }
  const owned=Object.keys(TROOP).filter(u=>(v.troops[u]||0)>0);
  const from=S.world[HOME_KEY]; const dist=fieldDist(w,from);
  const sel={}; owned.forEach(u=>sel[u]=0);
  const ov=document.createElement('div'); ov.className='ov';
  function estimate(){ let slow=0,atk=0; for(const u in sel){ if(sel[u]>0){ slow=Math.max(slow,TROOP[u].speed); atk+=sel[u]*TROOP[u].atk; } }
    const travel=slow?Math.max(4000,travelMs(dist,slow)):0; let def=0; for(const u in (w.garrison||{})) def+=(w.garrison[u]||0)*TROOP[u].def; def=Math.round(def*(1+(w.wall||0)*0.04)); return {travel,atk,def}; }
  function draw(){ const es=estimate();
    ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span><div class="picker atk">
      <h3 class="pick-h">🏚️ ${w.name} <small style="font-size:11px;color:#c9a86a">${w.size}★ · 📍${dist.toFixed(1)}칸</small></h3>
      <div class="atk-info">📦 약탈 가능 ${Math.floor((w.loot.wood||0)+(w.loot.clay||0)+(w.loot.iron||0))} · 🛡️ 수비 ${es.def} · 👑 충성도 <b>${Math.round(w.loyalty==null?100:w.loyalty)}</b>${(v.troops.noble>0)?' <span style="color:#c4b5fd">· 귀족 넣으면 충성도↓→0에서 함락</span>':''}</div>
      ${owned.length? owned.map(u=>`<div class="atk-row"><span class="u-ic">${TROOP[u].ic}</span><span class="u-nm">${TROOP[u].nm}</span><span class="u-have">보유 ${v.troops[u]}</span>
        <span class="atk-step"><button data-u="${u}" data-d="-1">－</button><b>${sel[u]}</b><button data-u="${u}" data-d="1">＋</button><button data-u="${u}" data-d="max" class="mx">최대</button></span></div>`).join('')
        : `<div class="muted" style="margin:10px 0">보낼 병력이 없어요 · 병영/마구간에서 훈련하세요</div>`}
      <div class="atk-est">⚔️ 공격력 <b>${es.atk}</b> vs 🛡️ <b>${es.def}</b>${es.atk>es.def?' · <span style="color:#8ef0a8">승리 예상</span>':(es.atk>0?' · <span style="color:#ff9a6a">패배 예상</span>':'')} · ${es.travel?('행군 '+fmtDur(es.travel)):'—'}</div>
      <button class="btn btn-gold atk-go" ${owned.length?'':'disabled'} style="width:100%;padding:12px;margin-top:8px;font-size:14px">⚔️ 공격 출발</button>
    </div>`;
    ov.querySelectorAll('.atk-step button').forEach(bn=>bn.onclick=()=>{ const u=bn.dataset.u,d=bn.dataset.d; if(d==='max') sel[u]=v.troops[u]||0; else sel[u]=Math.max(0,Math.min(v.troops[u]||0, sel[u]+(+d))); draw(); });
    const go=ov.querySelector('.atk-go'); if(go) go.onclick=()=>{
      const doSend=()=>{ if(sendAttack(id,sel)){ ov.remove(); renderMap(); renderTop(); } };
      if(isProtected(S.world[HOME_KEY])) confirmRelease(doSend); else doSend();   // 내가 보호 중이면 선공 경고
    };
  }
  draw(); ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); }; document.body.appendChild(ov);
}
function heroBy(slug){ return HEROES.find(h=>h.slug===slug); }
window.showCard=function(slug){ const h=heroBy(slug); if(!h)return; const hs=hstat(h), R=REGIONS[h.region];
  const ov=document.createElement('div'); ov.className='ov'; ov.onclick=(e)=>{ if(e.target===ov)ov.remove(); };
  ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span>
   <div style="display:flex;flex-direction:column;align-items:center">
    <div class="lor"><div class="cost">★★★<small>PRISM</small></div><div class="rgn">${R.rgnIc}</div>
      <div class="art" style="background-image:url('${heroImg(slug,'splash')}')"></div>
      <div class="nm">${h.kr}</div><div class="kw"><b>${ROLE_TRAIT[h.role]}</b></div>
      <div class="ds">⚡이동 ${hs.mv} · 🏠 <b>${R.nm}</b> · ${ROLE_DESC[h.role]}</div>
      <div class="pw">⚔️<span>${hs.atk}</span><small>전투</small></div><div class="hp">❤️<span>${hs.hp}</span><small>체력</small></div>
    </div></div>`;
  document.body.appendChild(ov);
};
window.openDex=function(){ const ov=document.createElement('div'); ov.className='ov'; ov.onclick=(e)=>{ if(e.target===ov)ov.remove(); };
  ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span><div class="picker"><h3 class="pick-h">🎴 영웅 카드 도감 (${HEROES.length})</h3><div class="pgrid">`+
    HEROES.map(h=>{ const hs=hstat(h); return `<div class="pcard" data-s="${h.slug}"><div class="por" style="background-image:url('${heroImg(h.slug)}')"></div><div><div class="hn">${h.kr}</div><div class="hs">${REGIONS[h.region].ic} ${REGIONS[h.region].nm}</div><div class="hs" style="color:#8fce8a">⚔️${hs.atk} ❤️${hs.hp}</div></div></div>`;}).join('')+
    `</div><div style="font-size:10px;color:#8a7a52;margin-top:8px;text-align:center">챔피언은 앞으로 특수 지휘관으로 합류 예정</div></div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.pcard').forEach(c=>c.onclick=()=>showCard(c.dataset.s));
};

// ═══════════ 루프 ═══════════
function loop(){ tick(); if(view==='map') renderMap(); else if(curRgn) renderRgn(false); renderTop(); save(); }
showView(); loop(); setInterval(loop, 1000);
// 지도 팬/줌 초기화(휠·핀치 확대, 드래그 이동, 더블탭)
let _mapPZ=null;
(function initMapPZ(){ const w=document.getElementById('map-wrap'), c=document.getElementById('map-content'); if(!w||!c) return;
  drawGrid();
  const hk=S.world[HOME_KEY]; const fx=hk?(hk.x+0.5)/WORLD:0.5, fy=hk?(hk.y+0.5)/WORLD:0.5;
  _mapPZ=attachPanZoom(w,c,{maxScale:2.4, minScale:0.3, initScale:1.8, dbl:1.6, focus:{fx,fy},
    onTap:(px,py)=>{ let best=null,bd=1e9; for(const id in S.world){ const wv=S.world[id]; const d=Math.hypot((wv.x+0.5)*FIELD-px,(wv.y+0.5)*FIELD-py); if(d<bd){bd=d;best=id;} }
      if(best && bd<FIELD*0.9){ onVillage(best); return true; } return false; },   // 탭한 칸의 마을 선택
    onZoom:(sc)=>{ c.style.setProperty('--mkz',(1/Math.max(sc,1)).toFixed(3)); }});  // 확대=고정크기, 축소=점처럼 작아짐
  const rb=document.getElementById('map-reset'); if(rb) rb.onclick=()=>_mapPZ.reset();
  setTimeout(()=>{ const h=document.getElementById('map-hint'); if(h) h.classList.add('gone'); },4500);
})();
// 지도 위 행군 마커 실시간 이동(rAF)
(function armyLoop(){ if(view==='map'){ const host=document.getElementById('armies'); if(host && (S.marches||[]).length) updateArmies(); } requestAnimationFrame(armyLoop); })();
window.runeReset=function(){ localStorage.removeItem('rune_proto'); S=fresh(); bindActive(); showView(); toast('프로토타입 초기화'); };
window.runeGrantNoble=function(n){ n=n||3; S.v.troops.noble=(S.v.troops.noble||0)+n; save(); if(view==='rgn')renderRgn(true); toast(`👑 귀족 +${n}(테스트) · 활성 마을`); };
window.rune=()=>S;  // 콘솔 디버그: 현재 상태 접근
// 💾 저장 무결성 검사(실시간 저장 확인) — 저장→다시 읽기→구조/좌표 비교
window.runeSaveCheck=function(){ save(); let ok=false, msg='';
  try{ const j=JSON.parse(localStorage.getItem('rune_proto'));
    ok = j && j.ver===SAVE_VER && j.villages && j.villages[S.active] && j.world && j.world[HOME_KEY] && JSON.stringify(j.villages[S.active].blds)===JSON.stringify(S.v.blds);
    msg=`내 마을 ${ownedIds().length}개 · world ${Object.keys(j.world).length}칸 · 자원 목${Math.floor(S.v.res.wood)}/점${Math.floor(S.v.res.clay)}/철${Math.floor(S.v.res.iron)} · 내 보호 ${protectLeft(S.world[HOME_KEY])>0?fmtProtect(protectLeft(S.world[HOME_KEY])):'해제됨'}`;
  }catch(e){ msg='읽기 오류 '+e.message; }
  console.log((ok?'✅ 저장 정상 · ':'❌ 저장 이상 · ')+msg+' (자동저장=매 1초 loop + 액션마다)'); toast(ok?'💾 저장 정상':'❌ 저장 이상'); return ok;
};
// 🎯 스폰 분배 데모 — N명 플레이어를 겹치지 않게 재배치(최소거리 확인)
window.runeSpawnDemo=function(n){ n=Math.max(2,Math.min(9,n||8)); const R=Math.random;
  const taken=new Set(['50,50']); const players=[{x:50,y:50}]; const now=Date.now();
  for(const id in S.world){ if(id!==HOME_KEY && S.world[id].owner==='player') delete S.world[id]; }  // 기존 라이벌 제거
  let placed=0; for(let i=0;i<n-1;i++){ const sp=allocSpawn(taken,players,R); if(!sp)break; taken.add(sp.x+','+sp.y); players.push(sp);
    const size=3+Math.floor(R()*3); S.world['p'+i]={x:sp.x,y:sp.y,name:RIVAL_NAMES[i%RIVAL_NAMES.length]+' '+(i+1),owner:'player',size,loot:barbLoot(size),garrison:barbGarrison(size),foundedAt:now,protectUntil:(i%2?now+PROTECT_MS:0)}; placed++; }
  // 최소거리 검산
  let minD=1e9; for(let a=0;a<players.length;a++)for(let b=a+1;b<players.length;b++) minD=Math.min(minD,Math.hypot(players[a].x-players[b].x,players[a].y-players[b].y));
  save(); if(view==='map') showView();
  console.log(`🎯 플레이어 ${placed+1}명 배치 · 최소 간격 ${minD.toFixed(1)}칸(기준 ${SPAWN_MINDIST}칸)`); toast(`🎯 ${placed+1}명 분배 · 최소 ${minD.toFixed(1)}칸`);
};
window.runeEndProtect=function(){ S.world[HOME_KEY].protectUntil=0; save(); renderTop(); if(view==='map')renderMap(); toast('🛡️ 내 보호 해제(테스트)'); };
// ⚔️ 습격 테스트 — 지금 즉시 라이벌 습격 발생(보호 무시)
window.runeRaid=function(){ const rivals=Object.keys(S.world).filter(id=>S.world[id].owner==='player'); if(!rivals.length){ toast('라이벌 없음'); return; }
  const aid=rivals[Math.floor(Math.random()*rivals.length)], a=S.world[aid], home=S.world[HOME_KEY];
  const units={axe:Math.max(6,a.size*8), lcav:a.size*2}; let slow=1; for(const u in units) slow=Math.max(slow,TROOP[u].speed);
  const travel=Math.max(4000, travelMs(fieldDist(a,home),slow));
  S.marches.push({from:aid,to:HOME_KEY,units,dep:Date.now(),arriveAt:Date.now()+travel,mode:'raid'}); save();
  if(view==='map')renderMap(); toast(`⚔️ ${a.name} 습격(테스트) · ${fmtDur(travel)} 후 도착`); };
</script>
</body></html>

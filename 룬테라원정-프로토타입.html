<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>룬테라 원정 — 프로토타입 v0.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#0a0a0f;color:#e8dcc0;font-family:'Noto Sans KR',system-ui,sans-serif;overscroll-behavior:none;}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#12101a,#0a080f);position:relative;}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:8px 10px;background:linear-gradient(180deg,#1a1220,#140e18);border-bottom:1px solid rgba(200,168,75,.25);}
.topbar .tt{font-weight:900;color:#f0dca0;font-size:14px;flex:1;}
.res-chip{font-family:monospace;font-weight:800;font-size:11px;background:rgba(0,0,0,.4);border:1px solid rgba(200,168,75,.3);border-radius:14px;padding:3px 8px;white-space:nowrap;}
.res-chip.g{color:#ffd76a;}
.resbar{display:flex;gap:4px;padding:6px 10px;overflow-x:auto;background:#0e0b14;border-bottom:1px solid rgba(255,255,255,.05);}
.btn{border:none;border-radius:9px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn-gold{background:linear-gradient(135deg,#d4a843,#f0c84a);color:#1a1206;}
.btn-dk{background:rgba(255,255,255,.07);color:#e8dcc0;border:1px solid rgba(255,255,255,.12);}
/* 지도 — 프리미엄 전황 지도(딥씨 + 청동 해안선) */
#map-view{position:relative;height:640px;overflow:hidden;
  background:radial-gradient(130% 90% at 50% 26%,#173a4e,#0d2635 52%,#071722 100%);}
#map-view::after{content:'';position:absolute;inset:0;z-index:8;pointer-events:none;border-radius:2px;
  box-shadow:inset 0 0 0 2px rgba(202,162,78,.5),inset 0 0 0 5px rgba(20,14,8,.9),inset 0 0 90px rgba(0,0,0,.6);}
#map-art{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.map-cartouche{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:7;text-align:center;pointer-events:none;
  font-family:Georgia,serif;font-weight:800;letter-spacing:4px;font-size:14px;color:#f7e9b8;text-shadow:0 2px 5px #000;}
.map-cartouche small{display:block;font-size:7px;letter-spacing:3px;color:#caa24e;margin-top:0;opacity:.85;}
.map-compass{position:absolute;right:12px;bottom:34px;z-index:7;width:52px;height:52px;opacity:.85;pointer-events:none;}
.mnode{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;z-index:5;}
.mnode .pin{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding:5px 10px 7px;border-radius:10px;
  background:linear-gradient(180deg,rgba(34,26,14,.96),rgba(16,11,5,.97));border:1px solid #a3812f;
  box-shadow:0 5px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,225,150,.15);min-width:66px;}
.mnode .pin::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;
  background:linear-gradient(135deg,rgba(16,11,5,.97),rgba(16,11,5,.97));border-right:1px solid #a3812f;border-bottom:1px solid #a3812f;}
.mnode .ic{font-size:20px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
.mnode .nm{font-size:11px;font-weight:800;color:#f2e2ad;}
.mnode .blabel{font-size:7.5px;font-weight:700;letter-spacing:.5px;margin-top:-1px;text-shadow:0 1px 2px #000;}
.mnode.locked .blabel{opacity:.55;}
.mnode .meta{font-size:8.5px;color:#c9b98a;font-weight:700;}
.mnode.locked .pin{filter:grayscale(.85);opacity:.4;}
.mnode.locked .pin::after{filter:grayscale(.85);opacity:.4;}
.mnode.open .pin{border-color:#7fce7a;box-shadow:0 5px 14px rgba(0,0,0,.6),0 0 14px rgba(127,206,122,.25),inset 0 1px 0 rgba(255,225,150,.15);}
.mnode.open .pin::after{border-color:#7fce7a;}
.mnode.openable .pin{border-color:#a9d4ff;animation:pulseB 1.6s infinite;}
@keyframes pulseB{50%{box-shadow:0 0 0 4px rgba(120,180,255,.28),0 5px 14px rgba(0,0,0,.6);}}
.mnode.home .badge,.mnode.openable .badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;padding:1px 7px;border-radius:7px;white-space:nowrap;z-index:2;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.mnode.home .badge{background:linear-gradient(135deg,#f4e3a8,#d8b45a);color:#2a1c06;}
.mnode.openable .badge{background:linear-gradient(135deg,#5b8fd6,#a9d4ff);color:#08172c;}
.mnode .raidmk{position:absolute;top:-7px;right:-7px;font-size:13px;z-index:2;filter:drop-shadow(0 1px 2px #000);}
.edge{stroke:rgba(202,162,78,.28);stroke-width:1.6;stroke-dasharray:2 5;stroke-linecap:round;}
.map-tip{position:absolute;bottom:9px;left:8px;right:8px;text-align:center;font-size:9.5px;color:#9db3bf;z-index:7;text-shadow:0 1px 2px #000;}
/* 지역 화면 */
#rgn-view{display:none;padding:10px;}
.sec-h{font-size:11px;font-weight:800;color:#b9a878;letter-spacing:1px;margin:10px 2px 6px;}
.sec-h span{color:#8a7a52;font-weight:600;}
.heroes{display:flex;gap:7px;flex-wrap:wrap;}
.hero{flex:1 1 46%;min-width:150px;display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(40,30,60,.6),rgba(20,14,28,.6));border:1px solid #7a5c9e;border-radius:11px;padding:7px;}
.hero .por{width:42px;height:42px;border-radius:8px;background-size:cover;background-position:35% 15%;border:1px solid #a78bfa;flex:none;}
.hero .hn{font-size:12px;font-weight:900;color:#e8dcf0;}
.hero .hs{font-size:10px;color:#c4b5fd;font-weight:700;}
.hero .hi{flex:1;min-width:0;}
.hpbar{height:5px;border-radius:4px;background:rgba(0,0,0,.45);margin-top:4px;overflow:hidden;}
.hpbar>div{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b 55%,#22c55e);}
.hero.dead{opacity:.75;border-color:#7a3a3a;}
.hero.dead .por{filter:grayscale(1) brightness(.55);}
.hero.dead .hs{color:#ff8a8a;}
.hero-empty{flex:1 1 46%;min-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px dashed rgba(255,255,255,.18);border-radius:11px;padding:12px 7px;color:#9a9aa8;font-size:10px;text-align:center;cursor:pointer;}
.raid{background:linear-gradient(180deg,rgba(60,20,20,.5),rgba(30,12,12,.5));border:1px solid #7a3a2e;border-radius:11px;padding:9px 11px;}
.raid-t{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#ffb4a0;}
.raid-t .mon{font-size:10.5px;color:#ff9a6a;}
.rbar{height:8px;border-radius:6px;background:rgba(0,0,0,.4);margin:7px 0 4px;overflow:hidden;position:relative;}
.rbar .def{height:100%;background:linear-gradient(90deg,#22c55e,#86efac);}
.rbar .line{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ff6a6a;}
.raid-meta{display:flex;justify-content:space-between;font-size:9.5px;color:#c9b98a;}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.bld{background:rgba(0,0,0,.4);border:1px solid rgba(200,168,75,.25);border-radius:10px;padding:8px 9px;}
.bld-h{display:flex;align-items:center;gap:6px;}
.bld-ic{font-size:19px;}
.bld-nm{font-size:11.5px;font-weight:800;color:#f0e2b8;}
.bld-lv{margin-left:auto;font-size:9px;font-weight:800;color:#1a1206;background:linear-gradient(135deg,#f4e3a8,#d8b45a);padding:1px 6px;border-radius:7px;}
.bld-eff{font-size:9.5px;color:#9fce9a;margin:4px 0 6px;font-weight:700;min-height:12px;}
.bld-up{width:100%;padding:5px;border:none;border-radius:7px;background:rgba(120,90,30,.4);border:1px solid #7a5c1e;color:#f0dca0;font-size:9px;font-weight:700;cursor:pointer;}
.bld-up:disabled{opacity:.45;cursor:default;}
.bld.tower{border-color:rgba(120,160,255,.35);} .bld.tower .bld-lv{background:linear-gradient(135deg,#a9d4ff,#5b8fd6);color:#0a1a30;}
.bld.heal{border-color:rgba(255,150,196,.35);} .bld.heal .bld-lv{background:linear-gradient(135deg,#ffc4dd,#e06a9c);color:#3a0a20;}
/* 오버레이(카드/영웅선택) */
.ov{position:fixed;inset:0;z-index:60;background:rgba(4,4,10,.85);display:flex;align-items:center;justify-content:center;padding:16px;}
.ov-x{position:absolute;top:12px;right:14px;font-size:22px;color:#ccc;cursor:pointer;z-index:2;}
.picker{width:100%;max-width:420px;max-height:82vh;overflow:auto;background:#161019;border:1px solid rgba(200,168,75,.3);border-radius:14px;padding:12px;}
.pick-h{font-weight:900;color:#f0dca0;margin:0 0 8px;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pcard{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.35);border:1px solid #4a3a66;border-radius:10px;padding:7px;cursor:pointer;}
.pcard .por{width:40px;height:40px;border-radius:7px;background-size:cover;background-position:35% 15%;flex:none;border:1px solid #7a5c9e;}
.pcard .hn{font-size:11.5px;font-weight:800;color:#e8dcf0;}
.pcard .hs{font-size:9.5px;color:#c4b5fd;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;background:rgba(20,14,8,.96);border:1px solid #7a5c1e;color:#f0dca0;font-size:12px;font-weight:700;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.on{opacity:1;}
.proto-tag{font-size:8.5px;color:#8a7a52;text-align:center;padding:6px;}
/* LoR 카드(간이) */
.lor{width:300px;aspect-ratio:2/3;border-radius:16px;overflow:hidden;position:relative;background:#0d0b08;
  box-shadow:inset 0 0 0 2px #5b4416,inset 0 0 0 5px #a3812f,inset 0 0 0 7px #e9d288,inset 0 0 0 10px #6e5417,0 14px 40px rgba(0,0,0,.7);}
.lor .art{position:absolute;top:10px;left:10px;right:10px;height:60%;border-radius:8px;background-size:cover;background-position:35% 18%;
  box-shadow:inset 0 -30px 30px #0a0906;}
.lor .nm{position:absolute;top:58%;left:14px;right:14px;text-align:center;font-size:22px;font-weight:900;color:#f2e2ad;text-shadow:0 2px 4px #000;font-family:Georgia,serif;}
.lor .kw{position:absolute;top:66%;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#dfe7f5;}
.lor .kw b{background:#243050;border:1px solid #4a5a86;border-radius:14px;padding:3px 12px;}
.lor .ds{position:absolute;top:73%;left:18px;right:18px;text-align:center;font-size:11.5px;color:#e8e2d2;line-height:1.5;}
.lor .cost{position:absolute;top:8px;left:8px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#a9d4ff,#3b82f6 55%,#1e3a8a);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #f4e3a8;font-size:12px;font-weight:800;color:#fff;flex-direction:column;line-height:1;}
.lor .cost small{font-size:7px;}
.lor .rgn{position:absolute;top:10px;right:10px;font-size:22px;filter:drop-shadow(0 0 5px rgba(120,255,180,.5));}
.lor .pw,.lor .hp{position:absolute;bottom:6px;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);color:#fff;font-weight:900;font-size:18px;}
.lor .pw{left:6px;background:radial-gradient(circle at 40% 32%,#ffcf87,#e07a1e 60%,#8a3d08);}
.lor .hp{right:6px;background:radial-gradient(circle at 40% 32%,#ff9a9a,#d63838 60%,#7a1414);}
.lor .pw small,.lor .hp small{font-size:8px;}
/* ── 게임풍 폴리시 + 애니메이션(전략게임 톤 참고·오리지널) ── */
.topbar{background:linear-gradient(180deg,#241a10,#160f0a);border-bottom:2px solid #6b4f24;box-shadow:0 3px 10px rgba(0,0,0,.5);}
.resbar{background:linear-gradient(180deg,#1a140c,#120d08);border-bottom:1px solid #6b4f24;}
.res-chip{background:linear-gradient(180deg,rgba(60,44,20,.5),rgba(20,14,8,.6));border:1px solid #6b4f24;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);}
#map-view.anim{animation:mapIn .55s ease-out;}
.mnode.pop{animation:nodePop .5s cubic-bezier(.34,1.5,.5,1) backwards;}
#rgn-view.anim{animation:viewIn .4s ease-out;}
@keyframes mapIn{from{opacity:0;transform:scale(1.09)}to{opacity:1;transform:scale(1)}}
@keyframes nodePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}72%{transform:translate(-50%,-50%) scale(1.14)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes bannerZoom{from{transform:scale(1.15)}to{transform:scale(1)}}
/* 정착지 헤더 배너 */
.rgn-banner{position:relative;height:98px;border-radius:12px;overflow:hidden;margin-bottom:6px;border:1px solid #6b4f24;box-shadow:0 4px 14px rgba(0,0,0,.5);}
.rgn-banner .bg{position:absolute;inset:0;background-size:cover;background-position:40% 20%;filter:brightness(.6);animation:bannerZoom .8s ease-out;}
.rgn-banner .ov2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.1),rgba(10,8,6,.88));}
.rgn-banner .tt{position:absolute;left:14px;bottom:9px;font-size:19px;font-weight:900;color:#f0dca0;text-shadow:0 2px 5px #000;}
.rgn-banner .tt small{font-size:11px;color:#ff9a6a;margin-left:6px;}
.rgn-banner .bk{position:absolute;top:8px;left:8px;width:32px;height:32px;border:none;border-radius:8px;background:rgba(0,0,0,.55);color:#e8dcc0;font-size:16px;cursor:pointer;}
.rgn-banner .story2{position:absolute;left:14px;right:12px;bottom:-1px;font-size:9.5px;color:#c9b98a;transform:translateY(-24px);opacity:.9;}
/* 건물 플롯 느낌 */
.bld{background:linear-gradient(180deg,rgba(40,30,16,.6),rgba(18,13,8,.62));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 5px rgba(0,0,0,.35);}
.bld-ic{filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
/* ── 프리미엄 정착지: 아이소 씬 + 영웅 정보 카드 ── */
.scene{position:relative;height:408px;overflow:hidden;border-radius:14px;margin-bottom:6px;border:1px solid #6b4f24;
  background:radial-gradient(62% 54% at 50% 46%,#40506a,#1c2230 58%,#0b0e15 100%);box-shadow:0 6px 20px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.45);}
.scene::before{content:'';position:absolute;inset:0;z-index:1;background:radial-gradient(120% 90% at 50% -12%,rgba(255,255,255,.06),transparent 56%);pointer-events:none;}
.scene::after{content:'';position:absolute;inset:0;background:radial-gradient(76% 64% at 50% 48%,transparent 50%,rgba(0,0,0,.66));pointer-events:none;z-index:50;}
.scene .bk2{position:absolute;top:9px;left:9px;z-index:56;width:32px;height:32px;border:none;border-radius:9px;background:rgba(8,6,4,.6);border:1px solid rgba(200,168,75,.35);color:#e8dcc0;font-size:16px;cursor:pointer;backdrop-filter:blur(2px);}
.scene .stt{position:absolute;top:10px;left:50px;z-index:56;font-size:16px;font-weight:900;color:#f0dca0;text-shadow:0 2px 5px #000;pointer-events:none;}
.scene .stt small{font-size:10px;color:#ff9a6a;margin-left:6px;}
.scene .schint{position:absolute;top:34px;left:50px;z-index:56;font-size:9px;color:#c9b98a;text-shadow:0 1px 2px #000;pointer-events:none;opacity:.85;}
.iso-tag{position:absolute;z-index:60;transform:translate(-50%,0);text-align:center;cursor:pointer;}
.iso-tag .ilv{font-size:9px;font-weight:800;color:#3a2a08;background:linear-gradient(180deg,#fbe9a8,#d9ab48);border:1px solid #8a6a24;border-radius:7px;padding:0 7px;box-shadow:0 2px 3px rgba(0,0,0,.5);}
.iso-tag .inm{display:block;font-size:9px;font-weight:800;color:#f0e2c0;text-shadow:0 1px 2px #000;margin-top:1px;}
.iso-tag:active{transform:translate(-50%,1px);}
.iso-emp{position:absolute;z-index:60;transform:translate(-50%,-50%);font-size:8.5px;font-weight:800;color:#e6d29a;background:rgba(10,8,4,.5);border:1px dashed rgba(200,168,75,.55);border-radius:9px;padding:2px 8px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);}
.iso-emp:active{transform:translate(-50%,calc(-50% + 1px));}
.raidtag{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);z-index:48;font-size:10px;font-weight:800;color:#ffd0b8;background:linear-gradient(180deg,rgba(60,18,14,.92),rgba(30,10,8,.92));border:1px solid #8a3a2a;border-radius:20px;padding:3px 12px;white-space:nowrap;}
.raidtag b{color:#ff9a6a;}
.hero2{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,rgba(50,38,70,.55),rgba(20,15,28,.55));border:1px solid #6a4f9e;border-radius:12px;padding:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);margin-bottom:6px;}
.hero2.dead{border-color:#7a3a3a;opacity:.9;}
.hero2 .por{width:54px;height:54px;border-radius:10px;background-size:cover;background-position:35% 14%;box-shadow:0 0 0 2px #a78bfa,0 0 0 4px #2a1e3a,0 0 12px rgba(167,139,250,.35);flex:none;}
.hero2.dead .por{filter:grayscale(1) brightness(.55);box-shadow:0 0 0 2px #7a3a3a;}
.hero2 .hi{flex:1;min-width:0;}
.hero2 .hn{font-size:14px;font-weight:900;color:#efe6ff;}
.hero2 .hn small{font-size:9px;color:#c9a86a;margin-left:5px;font-weight:700;}
.hero2 .trait{font-size:10px;color:#8fce8a;font-weight:800;margin-top:1px;}
.hero2 .hdesc{font-size:9px;color:#b9a878;margin-top:3px;line-height:1.4;}
.hero2 .stats{display:flex;gap:10px;margin-top:5px;font-size:11px;font-weight:800;color:#f0e2c0;}
.hero2 .stats b{color:#c4b5fd;}
.hero2 .hpwrap{margin-top:4px;}
.hero2 .hp2{height:6px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;}
.hero2 .hp2>div{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);}
.hero2 .hplbl{font-size:8.5px;color:#c9a86a;margin-top:2px;}
.hero2 .revive{margin-top:5px;padding:5px 9px;border:none;border-radius:7px;background:rgba(120,90,30,.5);border:1px solid #7a5c1e;color:#f0dca0;font-size:9.5px;font-weight:800;cursor:pointer;}
.hero2-empty{display:flex;gap:8px;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,.2);border-radius:12px;padding:14px;color:#9a9aa8;font-size:11px;font-weight:700;cursor:pointer;margin-bottom:6px;text-align:center;}
.hero2-empty b{color:#c4b5fd;font-size:17px;}
.def2{background:linear-gradient(180deg,rgba(60,20,20,.42),rgba(24,10,10,.42));border:1px solid #7a3a2e;border-radius:12px;padding:9px 11px;}
.def2 .dtop{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#ffb4a0;}
.def2 .dtop .mon{font-size:10px;color:#ff9a6a;}
.def2 .dbar{height:9px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;position:relative;margin:7px 0 4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
.def2 .dbar .d{height:100%;background:linear-gradient(90deg,#1f7a3a,#4ade80 60%,#a7f3c0);box-shadow:0 0 10px rgba(74,222,128,.5);}
.def2 .dbar .d.bad{background:linear-gradient(90deg,#7a3a1f,#f59e0b 60%,#fbbf24);box-shadow:0 0 10px rgba(245,158,11,.4);}
.def2 .dbar .ln{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ff7a5a;}
.def2 .dmeta{display:flex;justify-content:space-between;font-size:9.5px;color:#c9a86a;}
.def2 .dmeta b{color:#f0e2c0;}
.sec2{font-size:10px;font-weight:800;color:#c9a86a;letter-spacing:2px;margin:12px 2px 6px;}
.sec2 span{color:#8a7a52;font-weight:600;}
/* ── 바이옴: 씬 조명 · 로어 · 분위기 파티클 ── */
.scene-amb{position:absolute;inset:0;z-index:2;pointer-events:none;}

const RAID_INTERVAL = 90*1000; // 프로토타입: 90초마다 습격(실서비스는 수 시간)
const HP_MAX = 100;

// ═══════════ 상태 ═══════════
let S = load();
function fresh(){
  const rg = {};
  for(const id in REGIONS){ rg[id] = { open:!!REGIONS[id].home, blds:{}, heroes:[], nextRaid:0 }; }
  return { res:{gold:1000,stone:200,wood:200,rune:20}, rg, t:Date.now() };
}
function load(){ try{ const j=JSON.parse(localStorage.getItem('rune_proto')); if(j&&j.rg) return j; }catch(e){} return fresh(); }
function save(){ S.t=Date.now(); localStorage.setItem('rune_proto', JSON.stringify(S)); }

// ═══════════ 로직 ═══════════
function prodRates(){ // 전 지역 건물 합산 → 시간당(프로토타입은 분당 체감 위해 ×)
  const r={gold:0,stone:0,wood:0,rune:0};
  for(const id in S.rg){ const rg=S.rg[id]; if(!rg.open)continue;
    for(const b in rg.blds){ const d=BLD[b]; if(d&&d.type==='prod'){ const lv=rg.blds[b]; r[d.res]+=d.base+d.per*(lv-1); } } }
  return r;
}
function tick(){
  const now=Date.now(); const dt=(now-S.t)/1000; if(dt<=0){ S.t=now; return; }
  // 자원 생산(프로토타입: 표기 rate = /분, 즉 초당 rate/60)
  const pr=prodRates();
  for(const k in pr){ S.res[k]=Math.floor((S.res[k]+pr[k]*dt/60)*100)/100; }
  // 영웅 회복 + 재생성
  for(const id in S.rg){ const rg=S.rg[id];
    const healLv=rg.blds.heal||0; const regen=(HP_MAX/600)*(1+healLv*0.6); // 기본 10분 풀회복, 치료소로 단축
    rg.heroes.forEach(h=>{
      if(h.dead){ if(now>=h.respawnAt){ h.dead=false; h.hp=HP_MAX; toast(`💫 ${heroKr(h.slug)} 재생성 완료!`); } }
      else if(h.hp<HP_MAX){ h.hp=Math.min(HP_MAX, h.hp+regen*dt); }
    });
    // 습격
    if(rg.open){
      if(!rg.nextRaid) rg.nextRaid=now+RAID_INTERVAL;
      if(now>=rg.nextRaid){ resolveRaid(id); rg.nextRaid=now+RAID_INTERVAL; }
    }
  }
  S.t=now;
}
function defenseOf(id){ const rg=S.rg[id]; let d=0;
  const tl=rg.blds.tower||0; if(tl) d+=BLD.tower.base+BLD.tower.per*(tl-1);
  rg.heroes.forEach(h=>{ if(!h.dead){ const hs=hstat(heroBy(h.slug)); d+= hs.atk*4 * (h.hp/HP_MAX); } });
  return Math.round(d);
}
function raidPowerOf(id){ return Math.round(REGIONS[id].threat*22 + REGIONS[id].threat*REGIONS[id].threat*3); }
function resolveRaid(id){
  const rg=S.rg[id]; const def=defenseOf(id), pw=raidPowerOf(id); const mon=REGIONS[id].mon;
  if(def>=pw){ // 격퇴 → 전리품
    const loot=Math.round(pw*2.2);
    S.res.gold+=loot; S.res.stone+=Math.round(pw*0.4); S.res.wood+=Math.round(pw*0.4);
    toast(`✅ ${REGIONS[id].nm}: ${mon.nm} 격퇴! +${loot}🪙`);
  } else { // 방어 실패 → 영웅 피해 + 건물 손상
    const over=(pw-def)/Math.max(1,pw);
    const dmg=Math.round(30+over*70);
    let downed=0;
    rg.heroes.forEach(h=>{ if(!h.dead){ h.hp-=dmg; if(h.hp<=0){ h.dead=true; h.hp=0; h.respawnAt=Date.now()+respawnMs(id,h); downed++; } } });
    // 타워 손상(가끔 레벨 다운)
    if(rg.blds.tower>1 && Math.random()<0.4) rg.blds.tower--;
    const plunder=Math.round(pw*1.0); S.res.gold=Math.max(0,S.res.gold-plunder);
    toast(`💥 ${REGIONS[id].nm} 방어 실패! ${mon.nm} 침입 · -${plunder}🪙${downed?` · 영웅 ${downed}명 전사`:''}`);
  }
}
function respawnMs(id,h){ const rg=S.rg[id]; const healLv=rg.blds.heal||0; const base=180*1000; return Math.round(base*(1-healLv*0.22)); }
function heroBy(slug){ return HEROES.find(h=>h.slug===slug); }
function heroKr(slug){ const h=heroBy(slug); return h?h.kr:slug; }
function heroSlots(id){ return 1 + (S.rg[id].blds.summon||0); }
function canOpen(id){ if(S.rg[id].open) return false; return REGIONS[id].adj.some(a=>S.rg[a]&&S.rg[a].open); }

function fmtDur(ms){ const s=Math.max(0,Math.ceil(ms/1000)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

function renderMap(){

    let meta = open?`⏱습격 ${fmtDur((rg.nextRaid||0)-Date.now())} · 🦸${rg.heroes.length}/${heroSlots(id)}`:(canO?'열기 →':'🔒 근접 해금 필요');
    let raidmk = open && (rg.nextRaid-Date.now()<20000) ? '<span class="raidmk">⚔️</span>':'';
    return `<div class="${cls}" style="left:${R.x}%;top:${R.y}%;animation-delay:${(_mapAnimed?0:ix*40)}ms" data-id="${id}">${badge}<div class="pin">${raidmk}<span class="ic">${R.ic}</span><span class="nm">${R.nm}</span><span class="blabel" style="color:rgba(${BIOME[id].aura},.95)">${BIOME[id].label}</span><span class="meta">${'★'.repeat(R.threat)}<br>${meta}</span></div></div>`;
  }).join('');
  mn.querySelectorAll('.mnode').forEach(n=>n.onclick=()=>onNode(n.dataset.id));

function onNode(id){ const rg=S.rg[id];
  if(rg.open){ curRgn=id; view='rgn'; showView(); }
  else if(canOpen(id)){ // 개방
    const cost={stone:REGIONS[id].threat*80, wood:REGIONS[id].threat*60};
    if(!pay(cost)){ toast('자원 부족 — '+costStr(cost)); return; }
    rg.open=true; rg.nextRaid=Date.now()+RAID_INTERVAL; save(); toast(`🚩 ${REGIONS[id].nm} 개방! 영웅을 투입하세요`); renderMap(); renderTop();
  } else toast('근접한 개방 지역이 있어야 열려요');
}
function costStr(c){ return Object.keys(c).map(k=>`${RES[k]}${c[k]}`).join(' '); }
function pay(c){ for(const k in c){ if((S.res[k]||0)<c[k]) return false; } for(const k in c){ S.res[k]-=c[k]; } return true; }

function showView(){ const mv=document.getElementById('map-view'), rv=document.getElementById('rgn-view');

// 건물 → 아이소 스프라이트 배치도(3×3 플롯)
const ISO_PLOTS = [
  {b:'gold',  sp:'chestClosed_E',     c:0,r:0,ey:-4},
  {b:'tower', sp:'woodenCrates_E',    c:1,r:0,ey:0},
  {b:'wood',  sp:'woodenPile_E',      c:2,r:0,ey:-2},
  {b:'heal',  sp:'barrels_E',         c:0,r:1,ey:0},
  {b:'summon',sp:'tableRoundChairs_E',c:1,r:1,ey:0},

];
function buildIso(id){
  const scene=document.getElementById('rgn-scene'); if(!scene) return;
  const rg=S.rg[id]; const B=BIOME[id]; const A='assets/rune/iso/';
  const TW=138, DX=TW/2, DY=TW/4, AN=0.80, cx=(scene.clientWidth||420)/2, cy=90;
  function put(src,col,row,o){ o=o||{}; const w=TW*(o.scale||1),h=w*2, x=cx+(col-row)*DX, y=cy+(col+row)*DY;
    const img=new Image(); img.src=A+src+'.png';
    img.style.cssText=`position:absolute;width:${w}px;left:${x-w/2}px;top:${y-h*AN+(o.ey||0)}px;z-index:${Math.round((col+row)*10+(o.dz||0))};filter:${o.filter?o.filter+' ':''}drop-shadow(0 7px 7px rgba(0,0,0,.45));pointer-events:none;`;
    scene.appendChild(img); }
  function tag(col,row,nm,lv,ey,bkey){ const x=cx+(col-row)*DX, y=cy+(col+row)*DY; const d=document.createElement('div');
    d.className='iso-tag'; d.style.left=x+'px'; d.style.top=(y-46+(ey||0))+'px';
    d.innerHTML=`<span class="ilv">Lv${lv}</span><span class="inm">${nm}</span>`;
    if(bkey) d.onclick=()=>build(id,bkey); scene.appendChild(d); }
  function emp(col,row,ey,bkey){ const x=cx+(col-row)*DX, y=cy+(col+row)*DY; const d=document.createElement('div');
    d.className='iso-emp'; d.style.left=x+'px'; d.style.top=(y-10+(ey||0))+'px';
    d.innerHTML=`＋ ${BLD[bkey].ic} ${BLD[bkey].nm}`; d.onclick=()=>build(id,bkey); scene.appendChild(d); }
  // 흙 바닥 앞마당(3×3 밖 한 겹) → 돌 안뜰(3×3) — 바이옴 색으로 물들임
  for(let r=-1;r<=3;r++)for(let c=-1;c<=3;c++){ const inner=(c>=0&&c<=2&&r>=0&&r<=2);
    put(inner?((c+r)%2?'stoneTile_E':'stoneTile_N'):((c+r)%2?'dirt_E':'dirtTiles_E'),c,r,{dz:-9,filter:B.gf}); }
  // 성벽 링: 좌측 벽(col=-1) + 뒷벽(row=-1) + 둥근 코너 탑 + 정문 — 바이옴 벽 색
  put('stoneWall_N',-1,0,{filter:B.wf});put('stoneWall_N',-1,1,{filter:B.wf});put('stoneWall_N',-1,2,{filter:B.wf});
  put('stoneWall_E',0,-1,{filter:B.wf});put('stoneWall_E',1,-1,{filter:B.wf});put('stoneWall_E',2,-1,{filter:B.wf});
  put('stoneWallRoundWindow_E',-1,-1,{ey:-6,dz:3,filter:B.wf}); // 뒤 코너 탑
  put('stoneWallRoundWindow_E',3,-1,{ey:-6,dz:3,filter:B.wf});  // 우 코너 탑
  put('stoneWallRoundWindow_E',-1,3,{ey:-6,dz:3,filter:B.wf});  // 좌 코너 탑
  put('stoneWallGateOpen_E',3,3,{ey:-2,dz:4,filter:B.wf});      // 앞 정문
  // 건물(지어진 것만 스프라이트, 빈 플롯은 건설 버튼) — 건물은 원색 유지(식별성)
  ISO_PLOTS.forEach(p=>{ const lv=rg.blds[p.b]||0;
    if(lv>0){ put(p.sp,p.c,p.r,{dz:2}); tag(p.c,p.r,BLD[p.b].nm,lv,p.ey,p.b); }
    else emp(p.c,p.r,p.ey,p.b); });
}

// 매초 갱신 — 습격 카운트다운·영웅 HP/부활·방어 수치·건물 버튼(자원 변동)
function updateRgnDynamic(id){
  const R=REGIONS[id], rg=S.rg[id], slots=heroSlots(id);
  const def=defenseOf(id), pw=raidPowerOf(id); const mx=Math.max(pw,def,1);
  const pct=Math.min(100,Math.round(def/mx*100)), linePct=Math.min(100,Math.round(pw/mx*100));
  const ok=def>=pw; const dur=fmtDur((rg.nextRaid||0)-Date.now());
  const rt=document.getElementById('rgn-raidtag'); if(rt) rt.innerHTML=`⚔️ <b>${R.mon.nm}</b> 습격 · <b>${dur}</b>`;
  const hc=document.getElementById('rgn-hcount'); if(hc) hc.textContent=`${rg.heroes.length}/${slots}`;
  const heroHtml = rg.heroes.map(h=>{ const H=heroBy(h.slug),hs=hstat(H);
    return `<div class="hero2 ${h.dead?'dead':''}">
      <div class="por" style="background-image:url('${heroImg(h.slug)}')"></div>
      <div class="hi">
        <div class="hn">${H.kr}${h.dead?' 💀':''} <small>🏠 ${REGIONS[H.region].nm}</small></div>
        <div class="trait">${ROLE_TRAIT[H.role]}</div>
        <div class="hdesc">${ROLE_DESC[H.role]}</div>
        <div class="stats"><span>⚡ 이동 <b>${hs.mv}</b></span><span>⚔️ 전투 <b>${hs.atk}</b></span><span>❤️ 체력 <b>${hs.hp}</b></span></div>
        <div class="hpwrap"><div class="hp2"><div style="width:${Math.round(h.hp)}%"></div></div>
          <div class="hplbl">${h.dead?('재생성 대기 ⏱ '+fmtDur(h.respawnAt-Date.now())):('체력 '+Math.round(h.hp)+' / 100 · 습격 사이 자동 회복')}</div></div>
        ${h.dead?`<button class="revive" onclick="reviveNow('${id}','${h.slug}')">🔮 룬 20 · 즉시 부활</button>`:''}
      </div></div>`; }).join('');
  const empties = Array.from({length:Math.max(0,slots-rg.heroes.length)}).map(()=>
    `<div class="hero2-empty" onclick="openHeroPick('${id}')"><b>＋</b> ${R.nm} 영웅 투입하기</div>`).join('');
  const he=document.getElementById('rgn-heroes'); if(he) he.innerHTML=heroHtml+empties;
  const de=document.getElementById('rgn-def'); if(de) de.innerHTML=`
    <div class="def2">
      <div class="dtop"><span>⚔️ 다음 습격 ⏱ ${dur}</span><span class="mon">${R.mon.ic} ${R.mon.nm} · ${'★'.repeat(R.threat)}</span></div>
      <div class="dbar"><div class="d ${ok?'':'bad'}" style="width:${pct}%"></div><div class="ln" style="left:${linePct}%"></div></div>
      <div class="dmeta"><span>🛡️ 방어력 <b>${def}</b> vs 습격 <b style="color:#ff9a6a">${pw}</b></span><span style="color:${ok?'#8ef0a8':'#ffb86a'};font-weight:800">${ok?'✦ 방어 성공 예상':'⚠️ 방어 부족'}</span></div>
    </div>`;
  const blds = Object.keys(BLD).map(b=>{ const d=BLD[b]; const lv=rg.blds[b]||0; const nextCost=d.cost(lv+1); const maxed=lv>=d.maxLv;
    let eff='';
    if(d.type==='prod') eff=`${RES[d.res]} +${lv?(d.base+d.per*(lv-1)):0}/분`;
    else if(d.type==='def') eff=`🛡️ 방어력 +${lv?(d.base+d.per*(lv-1)):0}`;
    else if(d.type==='heal') eff=`❤️ 회복↑·💀 재생성 -${lv*22}%`;
    else if(d.type==='slot') eff=`🦸 영웅 슬롯 ${1+lv}`;
    const cls='bld'+(b==='tower'?' tower':'')+(b==='heal'?' heal':'');
    return `<div class="${cls}"><div class="bld-h"><span class="bld-ic">${d.ic}</span><span class="bld-nm">${d.nm}</span><span class="bld-lv">Lv${lv}</span></div>
      <div class="bld-eff">${eff}</div>
      <button class="bld-up" ${maxed?'disabled':''} onclick="build('${id}','${b}')">${maxed?'최대':(lv?'업글':'건설')+' · '+costStr(nextCost)}</button></div>`;
  }).join('');
  const be=document.getElementById('rgn-blds'); if(be) be.innerHTML=blds;
}
window.build=function(id,b){ const rg=S.rg[id]; const lv=rg.blds[b]||0; const d=BLD[b]; if(lv>=d.maxLv)return;
  const c=d.cost(lv+1); if(!pay(c)){ toast('자원 부족 — '+costStr(c)); return; } rg.blds[b]=lv+1; save(); toast(`${d.ic} ${d.nm} Lv${lv+1}!`); renderRgn(true); renderTop(); };
window.reviveNow=function(id,slug){ const rg=S.rg[id]; const h=rg.heroes.find(x=>x.slug===slug); if(!h||!h.dead)return;
  if((S.res.rune||0)<20){ toast('룬 부족(20 필요)'); return; } S.res.rune-=20; h.dead=false; h.hp=HP_MAX; save(); toast(`💫 ${heroKr(slug)} 즉시 부활!`); renderRgn(true); renderTop(); };
function openHeroPick(id){ const R=REGIONS[id], rg=S.rg[id];
  const avail=HEROES.filter(h=>h.region===id && !rg.heroes.some(x=>x.slug===h.slug));
  if(!avail.length){ toast('이 지역에 투입할 영웅이 더 없어요'); return; }
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span><div class="picker"><h3 class="pick-h">🦸 ${R.nm}에 투입할 영웅</h3><div class="pgrid">`+
    avail.map(h=>{ const hs=hstat(h); return `<div class="pcard" data-s="${h.slug}"><div class="por" style="background-image:url('${heroImg(h.slug)}')"></div><div><div class="hn">${h.kr}</div><div class="hs">⚡${hs.mv} ⚔️${hs.atk} ❤️${hs.hp}</div><div class="hs" style="color:#8fce8a">${ROLE_TRAIT[h.role]}</div></div></div>`;}).join('')+
    `</div><div style="font-size:10px;color:#8a7a52;margin-top:8px;text-align:center">카드를 탭하면 원정 카드(LoR)로 크게 봐요</div></div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.pcard').forEach(c=>{ c.onclick=()=>{ ov.remove(); showCard(c.dataset.s, id); }; });
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
}
window.showCard=function(slug, deployId){ const h=heroBy(slug), hs=hstat(h), R=REGIONS[h.region];
  const ov=document.createElement('div'); ov.className='ov'; ov.onclick=(e)=>{ if(e.target===ov)ov.remove(); };
  const canDeploy = deployId && !S.rg[deployId].heroes.some(x=>x.slug===slug) && S.rg[deployId].heroes.length<heroSlots(deployId);
  const deployBtn = deployId ? `<button class="btn ${canDeploy?'btn-gold':'btn-dk'}" style="margin-top:12px;padding:11px 22px;font-size:14px;width:300px" ${canDeploy?`onclick="deployHero('${deployId}','${slug}');this.closest('.ov').remove();"`:'disabled'}>${canDeploy?`🦸 ${REGIONS[deployId].nm}에 투입`:'투입 불가(중복/슬롯 참)'}</button>` : '';
  ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span>
   <div style="display:flex;flex-direction:column;align-items:center">
    <div class="lor"><div class="cost">★★★<small>PRISM</small></div><div class="rgn">${R.rgnIc}</div>
      <div class="art" style="background-image:url('${heroImg(slug,'splash')}')"></div>
      <div class="nm">${h.kr}</div>
      <div class="kw"><b>${ROLE_TRAIT[h.role]}</b></div>
      <div class="ds">⚡이동 ${hs.mv} · 🏠 <b>${R.nm}</b> · ${ROLE_DESC[h.role]}</div>
      <div class="pw">⚔️<span>${hs.atk}</span><small>전투</small></div>
      <div class="hp">❤️<span>${hs.hp}</span><small>체력</small></div>
    </div>${deployBtn}</div>`;
  document.body.appendChild(ov);
};
window.deployHero=function(id,slug){ const rg=S.rg[id]; if(rg.heroes.some(x=>x.slug===slug))return; if(rg.heroes.length>=heroSlots(id)){ toast('영웅 슬롯이 가득 찼어요(소환소 업글)'); return; }
  rg.heroes.push({slug,hp:HP_MAX,dead:false}); save(); toast(`🦸 ${heroKr(slug)} ${REGIONS[id].nm} 투입!`); renderRgn(true); renderTop(); };
window.openDex=function(){ const ov=document.createElement('div'); ov.className='ov'; ov.onclick=(e)=>{ if(e.target===ov)ov.remove(); };
  ov.innerHTML=`<span class="ov-x" onclick="this.parentNode.remove()">✕</span><div class="picker"><h3 class="pick-h">🎴 영웅 카드 도감 (${HEROES.length})</h3><div class="pgrid">`+
    HEROES.map(h=>{ const hs=hstat(h); return `<div class="pcard" data-s="${h.slug}"><div class="por" style="background-image:url('${heroImg(h.slug)}')"></div><div><div class="hn">${h.kr}</div><div class="hs">${REGIONS[h.region].ic} ${REGIONS[h.region].nm}</div><div class="hs" style="color:#8fce8a">⚔️${hs.atk} ❤️${hs.hp}</div></div></div>`;}).join('')+
    `</div><div style="font-size:10px;color:#8a7a52;margin-top:8px;text-align:center">카드를 탭하면 원정 카드(LoR)로 크게 봐요</div></div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.pcard').forEach(c=>c.onclick=()=>showCard(c.dataset.s));
};
window.openHeroPick=openHeroPick;

// ═══════════ 루프 ═══════════
function loop(){ tick(); if(view==='map') renderMap(); else if(curRgn) renderRgn(false); renderTop(); save(); }
showView(); loop(); setInterval(loop, 1000);
window.runeReset=function(){ localStorage.removeItem('rune_proto'); S=fresh(); showView(); toast('프로토타입 초기화'); };
</script>
</body></html>
